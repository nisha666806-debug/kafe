<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Идораи Кафе</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#2A2118;
    --paper:#F3ECDD;
    --paper-dim:#E9DFC8;
    --card:#FBF7EE;
    --brick:#A8402A;
    --brick-dim:#8C331F;
    --olive:#6B7A4F;
    --gold:#C99A3E;
    --line:#D8CBAE;
    --green:#5C7A4A;
    --amber:#C08A2E;
    --white:#FFFDF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'IBM Plex Mono','Courier New',monospace;}
  .display{font-family:'Fraunces', Georgia, serif;}

  #app{max-width:1100px;margin:0 auto;padding:0 0 60px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border-bottom:2px solid var(--ink);
    background:var(--paper);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .name{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.3px;}
  .brand .tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brick);font-weight:600;}
  .top-right{display:flex;align-items:center;gap:12px;}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6b5f4d;display:none;}
  @media(min-width:560px){.clock{display:block;}}
  .role-pill{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;
    background:var(--ink);color:var(--paper);letter-spacing:.3px;
  }
  .btn-ghost{
    background:transparent;border:1.5px solid var(--ink);color:var(--ink);
    padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;
  }
  .btn-ghost:hover{background:var(--ink);color:var(--paper);}

  /* ---------- Generic ---------- */
  .container{padding:24px 20px;}
  .section-title{
    font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;margin:0 0 16px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .num{font-family:'IBM Plex Mono',monospace;color:var(--brick);font-size:14px;}

  button{cursor:pointer;}

  /* ---------- Role select ---------- */
  .role-select{
    min-height:calc(100vh - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;gap:28px;
  }
  .role-select h1{font-family:'Fraunces',Georgia,serif;font-size:34px;margin:0;font-weight:700;}
  .role-select p{color:#6b5f4d;margin:0;font-size:15px;}
  .role-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .login-box{display:flex;flex-direction:column;gap:14px;width:260px;margin-top:10px;text-align:left;}
  .login-box .field label{font-size:12px;color:#6b5f4d;font-weight:600;margin-bottom:4px;display:block;}
  .login-box .field input{width:100%;padding:11px 12px;border:1.5px solid var(--ink);border-radius:10px;font-family:inherit;font-size:14px;background:var(--white);}
  .login-error{color:var(--brick);font-size:13px;font-weight:600;}
  .role-card{
    width:190px;padding:28px 18px;border:2px solid var(--ink);border-radius:14px;
    background:var(--card);display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{transform:translateY(-4px);box-shadow:6px 6px 0 var(--ink);}
  .role-card .icon{font-size:32px;}
  .role-card .label{font-weight:700;font-size:16px;font-family:'Fraunces',Georgia,serif;}
  .role-card .desc{font-size:12px;color:#6b5f4d;}

  /* ---------- Table grid (waiter) ---------- */
  .table-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;
  }
  .table-card{
    border:2px solid var(--ink);border-radius:12px;padding:16px 14px;background:var(--card);
    display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit;
  }
  .table-card:hover{box-shadow:5px 5px 0 var(--ink);transform:translateY(-2px);}
  .table-card .row1{display:flex;justify-content:space-between;align-items:center;}
  .table-card .tnum{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .dot.free{background:var(--green);}
  .dot.occupied{background:var(--amber);}
  .dot.reserved{background:var(--gold);}
  .table-card.reserved-table{border-style:dashed;border-color:var(--gold);}
  .table-card.locked-table{opacity:.55;}
  .reserve-note{font-size:10px;color:var(--gold-dim,#8a6a1f);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .reserve-detail{font-size:9px;color:#9c8f78;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-family:'IBM Plex Mono',monospace;}
  .table-card .status{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b5f4d;}
  .table-card .total{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--brick);}

  /* ---------- Ticket / order builder ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(42,33,24,.55);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:760px){.overlay{align-items:center;}}
  .ticket-wrap{
    background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
    border-radius:16px 16px 0 0;border:2px solid var(--ink);border-bottom:none;
  }
  @media(min-width:760px){.ticket-wrap{border-radius:16px;border-bottom:2px solid var(--ink);max-height:88vh;}}
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2;
  }
  .ticket-head h2{font-family:'Fraunces',Georgia,serif;margin:0;font-size:20px;}
  .close-x{background:none;border:none;font-size:22px;color:var(--ink);line-height:1;}

  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;}
  .cat-tab{
    flex:none;padding:6px 14px;border-radius:16px;border:1.5px solid var(--ink);background:transparent;
    font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;
  }
  .cat-tab.active{background:var(--ink);color:var(--paper);}

  .menu-list{padding:8px 20px 4px;display:flex;flex-direction:column;gap:8px;}
  .menu-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;
  }
  .menu-row .mname{font-weight:600;font-size:14px;}
  .menu-row .mprice{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6b5f4d;margin-top:2px;}
  .add-btn{
    background:var(--olive);color:var(--white);border:none;width:32px;height:32px;border-radius:50%;
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
  }

  .receipt{
    margin:18px 20px 20px;background:var(--white);border:1px solid var(--line);border-radius:2px;
    padding:18px 18px 26px;
    clip-path:polygon(0% 0%,100% 0%,100% 96%,95% 100%,90% 96%,85% 100%,80% 96%,75% 100%,70% 96%,65% 100%,60% 96%,55% 100%,50% 96%,45% 100%,40% 96%,35% 100%,30% 96%,25% 100%,20% 96%,15% 100%,10% 96%,5% 100%,0% 96%);
    box-shadow:0 2px 8px rgba(42,33,24,.12);
  }
  .receipt-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6b5f4d;text-align:center;margin-bottom:10px;border-bottom:1px dashed var(--line);padding-bottom:10px;}
  .receipt-line{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:5px 0;}
  .receipt-line .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:20px;height:20px;border:1px solid var(--ink);background:none;border-radius:4px;font-size:12px;line-height:1;font-family:inherit;}
  .receipt-empty{text-align:center;color:#9c8f78;font-size:13px;padding:14px 0;font-family:'IBM Plex Mono',monospace;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;}

  .ticket-actions{display:flex;gap:10px;padding:0 20px 24px;}
  .btn-primary{
    flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;
  }
  .btn-primary:disabled{opacity:.4;}
  .btn-pay{
    flex:1;background:var(--brick);color:var(--white);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;
  }
  .btn-pay:disabled{opacity:.4;}

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex;gap:8px;padding:0 20px;border-bottom:2px solid var(--ink);}
  .admin-tab{
    padding:12px 6px;background:none;border:none;font-family:'Fraunces',Georgia,serif;font-size:15px;
    font-weight:600;color:#8a7c64;position:relative;top:2px;
  }
  .admin-tab.active{color:var(--ink);border-bottom:3px solid var(--brick);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-card{
    flex:1;min-width:150px;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:16px 18px;
  }
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b5f4d;font-weight:600;}
  .stat-card .value{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;color:var(--brick);margin-top:4px;}

  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
  }
  .item-row .info .nm{font-weight:600;font-size:14px;}
  .item-row .info .cat{font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:2px;}
  .item-row .price{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .icon-btn{background:none;border:1.5px solid var(--ink);border-radius:8px;width:30px;height:30px;font-size:13px;}
  .icon-btn.danger{border-color:var(--brick);color:var(--brick);}

  .cat-group{margin-bottom:20px;}
  .cat-group h3{font-family:'Fraunces',Georgia,serif;font-size:15px;margin:0 0 10px;color:var(--olive);}

  .form-box{
    background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:16px;margin-bottom:20px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b5f4d;font-weight:600;}
  .field input, .field select{
    font-family:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:8px;background:var(--white);
  }
  .field input{width:150px;}
  .field.small input{width:90px;}

  .receipt-item-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;
  }
  .receipt-item-row .l1{font-weight:600;font-family:'IBM Plex Sans',sans-serif;}
  .receipt-item-row .l2{color:#8a7c64;font-size:12px;margin-top:3px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:#9c8f78;
  }
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:50;
    opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}

  .chef-osh-line{font-weight:700;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:3px 0;color:var(--ink);}
  .chef-other-line{font-size:12px;color:#8a7c64;font-family:'IBM Plex Mono',monospace;padding:3px 0;}
  .osh-banner{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;
    background:var(--card);border-bottom:1px solid var(--line);font-size:12px;color:#6b5f4d;
  }
  .settings-form{display:flex;flex-direction:column;gap:16px;max-width:340px;}
  .salary-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
  }
  .salary-row .salary-name{min-width:110px;}
  .salary-row .salary-name .nm{font-weight:600;font-size:14px;}
  .salary-row .salary-name .cat{font-size:11px;color:var(--olive);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
  .salary-select{padding:7px 8px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:12px;background:var(--white);}
  .salary-input{width:100px;padding:7px 8px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:13px;}
  .salary-computed{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#6b5f4d;margin-left:auto;}
  .xls-table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:10px;}
  .xls-table th, .xls-table td{border:1px solid var(--line);padding:8px 10px;text-align:right;}
  .xls-table th{background:var(--paper-dim);font-family:'IBM Plex Sans',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#6b5f4d;font-weight:700;}
  .xls-table td:first-child, .xls-table th:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .xls-table tr:nth-child(even) td{background:var(--card);}
  .xls-table td.total-cell{font-weight:700;color:var(--brick);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ FIREBASE SETUP ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCVgddT7ycblQxi1DWjJ6zQ92ArRIP8PgM",
  authDomain: "oshi-foram.firebaseapp.com",
  projectId: "oshi-foram",
  storageBucket: "oshi-foram.firebasestorage.app",
  messagingSenderId: "564752367082",
  appId: "1:564752367082:web:6fd330f414cd7afef48693"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){ console.error('Firebase init failed', e); }

async function fsGet(key){
  try{
    const snap = await db.collection('cafeData').doc(key).get();
    return snap.exists ? snap.data().value : null;
  }catch(e){ console.error('fsGet failed', key, e); return null; }
}
async function fsSet(key, value){
  try{
    await db.collection('cafeData').doc(key).set({value, updatedAt: Date.now()});
    return true;
  }catch(e){ console.error('fsSet failed', key, e); return false; }
}

/* ============ STORAGE HELPERS ============ */
async function loadAll(){
  const out = {menu:null, orders:null, settings:null, reservations:null, tables:null, oshStock:null, accounts:null};
  try{
    const m = await fsGet('menu');
    out.menu = m ? JSON.parse(m) : null;
  }catch(e){ out.menu = null; }
  try{
    const o = await fsGet('orders');
    out.orders = o ? JSON.parse(o) : null;
  }catch(e){ out.orders = null; }
  try{
    const s = await fsGet('settings');
    out.settings = s ? JSON.parse(s) : null;
  }catch(e){ out.settings = null; }
  try{
    const r = await fsGet('reservations');
    out.reservations = r ? JSON.parse(r) : null;
  }catch(e){ out.reservations = null; }
  try{
    const tb = await fsGet('tables');
    out.tables = tb ? JSON.parse(tb) : null;
  }catch(e){ out.tables = null; }
  try{
    const os = await fsGet('oshStock');
    out.oshStock = os ? JSON.parse(os) : null;
  }catch(e){ out.oshStock = null; }
  try{
    const ac = await fsGet('accounts');
    out.accounts = ac ? JSON.parse(ac) : null;
  }catch(e){ out.accounts = null; }
  return out;
}
async function saveMenu(menu){
  const ok = await fsSet('menu', JSON.stringify(menu));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveOrders(orders){
  const ok = await fsSet('orders', JSON.stringify(orders));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveSettings(settings){
  const ok = await fsSet('settings', JSON.stringify(settings));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveReservations(reservations){
  const ok = await fsSet('reservations', JSON.stringify(reservations));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveTables(tables){
  const ok = await fsSet('tables', JSON.stringify(tables));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveOshStock(data){
  const ok = await fsSet('oshStock', JSON.stringify(data));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveAccounts(accounts){
  const ok = await fsSet('accounts', JSON.stringify(accounts));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}

const DEFAULT_MENU = [
  {id:'m1', name:'Оши палов (порсия)', price:25, category:'Ош', unit:'dona'},
  {id:'m2', name:'Оши палов', price:80, category:'Ош', unit:'kg'},
  {id:'m3', name:'Чойи сиёҳ', price:10, category:'Нӯшокиҳо', unit:'dona'},
  {id:'m4', name:'Чойи сабз', price:10, category:'Нӯшокиҳо', unit:'dona'},
  {id:'m5', name:'Оби маъданӣ', price:8, category:'Нӯшокиҳо', unit:'dona'},
  {id:'m6', name:'Афшура', price:15, category:'Нӯшокиҳо', unit:'dona'},
  {id:'m7', name:'Кока-кола', price:12, category:'Нӯшокиҳо', unit:'dona'},
  {id:'m8', name:'Себ', price:15, category:'Мевагиҳо', unit:'kg'},
  {id:'m9', name:'Ангур', price:25, category:'Мевагиҳо', unit:'kg'},
  {id:'m10', name:'Тарбуз', price:12, category:'Мевагиҳо', unit:'kg'},
  {id:'m11', name:'Банан', price:20, category:'Мевагиҳо', unit:'kg'},
];
const DEFAULT_SETTINGS = {cafeName:'Кафеи ман', workDaysPerMonth:30, porsiyaGrams:120};

/* ============ STATE ============ */
let state = {
  loaded:false,
  role:null,               // null | 'waiter' | 'admin'
  menu:[],
  orders:[],
  settings:{...DEFAULT_SETTINGS},
  reservations:{},          // tableNumber -> {note, bookedAt}
  bookingPreOrder:{},       // menuId -> qty (while building a table booking's pre-order)
  bookingName:'',
  bookingPhone:'',
  tables:[],                // [{id, name, seats}]
  oshStock:{date:'', kg:0}, // admin-entered total osh cooked today
  accounts:[],              // [{id, username, password, role}]
  currentUser:null,         // {username, role}
  loginError:null,
  showAddAccountForm:false,
  editingAccountId:null,
  confirmDeleteAccountId:null,
  activeTable:null,        // table number currently open in ticket
  draftItems:{},           // menuId -> qty  (for open ticket)
  activeCat:null,
  adminTab:'tables',
  showAddForm:false,
  editingId:null,
  confirmDeleteId:null,
  confirmResetMenu:false,
  showAddTableForm:false,
  takeawayOpen:false,
  takeawayItems:{},
  takeawayCat:null,
  scheduledOpen:false,
  scheduledItems:{},
  scheduledCat:null,
  scheduledName:'',
  scheduledPhone:'',
  scheduledTime:'',
  viewingOrderId:null,
  viewingMode:null,
  previewUsername:null,     // when admin is previewing AS a specific staff account
  editingTableId:null,
  confirmDeleteTableId:null,
  formOpen:false,           // prevents polling refresh while typing
  formOpenAt:null,          // safety timeout for stuck forms
};

function uid(prefix){ return prefix + '_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function fmtMoney(n){
  return (Math.round(n*100)/100).toString().replace(/\.00$/,'') + ' смн';
}
function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('tg-TJ',{hour:'2-digit',minute:'2-digit'});
}
function isToday(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function oshOrderedKgToday(){

async function init(){

  state.orders = orders || [];
  state.settings = settings || {...DEFAULT_SETTINGS};
  state.reservations = reservations || {};
  state.oshStock = oshStock || {date:'', kg:0};
  if(tables && tables.length){
    state.tables = tables;
  } else {
    const tc = (settings && settings.tableCount) || 8;
    state.tables = Array.from({length:tc}, (_,i)=>({id:i+1, name:'Мизи '+(i+1), seats:4}));
    await saveTables(state.tables);
  }
  if(accounts && accounts.length){
    state.accounts = accounts;
  } else {
    state.accounts = [{id:'acc_admin', username:'admin', password:'admin123', role:'admin'}];
    await saveAccounts(state.accounts);
  }
  state.loaded = true;
  render();
  setInterval(pollRefresh, 6000);
}

async function pollRefresh(){
  if(!state.role) return; // don't wipe the login form while the person is typing
  if(state.formOpen && state.formOpenAt && (Date.now()-state.formOpenAt) < 120000) return;
  if(state.formOpen) state.formOpen = false; // safety: don't let a stuck form block sync forever
  const {menu, orders, settings, reservations, tables, oshStock, accounts} = await loadAll();
  if(menu) state.menu = menu;
  if(orders) state.orders = orders;
  if(settings) state.settings = settings;
  if(reservations) state.reservations = reservations;
  if(tables) state.tables = tables;
  if(oshStock) state.oshStock = oshStock;
  if(accounts) state.accounts = accounts;
  render();
}

function closeTicket(){

}
function draftTotal(){
  let total = 0;
  Object.keys(state.draftItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item) total += lineTotal(item, state.draftItems[mid]);
  });
  return total;
}
function lineTotal(menuItem, amount){
  return menuItem.unit==='kg' ? menuItem.price * (amount/1000) : menuItem.price * amount;
}
function changeQty(mid, delta){
  const cur = state.draftItems[mid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.draftItems[mid];
  else state.draftItems[mid] = next;
  render();
}
function addGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.draftItems[mid] || 0;
  state.draftItems[mid] = cur + g;
  render();
}
function setGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) delete state.draftItems[mid];
  else state.draftItems[mid] = g;
  render();
}

}
async function saveTicket(sendFlag){
  let order = activeOrderForTable(state.activeTable);
  const prevItems = order ? order.items : [];
  const items = Object.keys(state.draftItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    const prev = prevItems.find(p=>p.menuId===mid);
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.draftItems[mid], servedQty: prev?(prev.servedQty||0):0};
  });
  const total = draftTotal();
  let isNew = false;
  if(!order){
    isNew = true;
    order = {id:uid('ord'), table:state.activeTable, status:'active', items:[], total:0, createdAt:Date.now(),
      createdBy: actingUsername(), sentToKitchen:false};
    state.orders.push(order);
  }
  order.items = items;
  order.total = total;
  order.updatedAt = Date.now();
  if(sendFlag) order.sentToKitchen = true;
  await saveOrders(state.orders);
  if(isNew && state.reservations && state.reservations[state.activeTable]){
    delete state.reservations[state.activeTable];
    await saveReservations(state.reservations);
  }
  showToast(sendFlag ? '🍚 Ба ошпаз фиристода шуд' : 'Фармоиш захира шуд');
  closeTicket();
}

function attachSplitPaymentEvents(idPrefix, total, onConfirm){
  const cashInput = document.getElementById(idPrefix+'-cash');
  const noncashInput = document.getElementById(idPrefix+'-noncash');
  if(!cashInput || !noncashInput) return;
  const clamp = (v)=> Math.max(0, Math.min(total, Number(v)||0));
  const fmt = (v)=> (Math.round(v*100)/100).toString();
  cashInput.addEventListener('input', ()=>{
    const c = clamp(cashInput.value);
    noncashInput.value = fmt(total - c);
  });
  noncashInput.addEventListener('input', ()=>{
    const n = clamp(noncashInput.value);
    cashInput.value = fmt(total - n);
  });
  document.querySelectorAll(`[data-splitquick^="${idPrefix}|"]`).forEach(el=>{
    el.addEventListener('click', ()=>{
      const mode = el.dataset.splitquick.split('|')[1];
      if(mode==='allcash'){ cashInput.value = fmt(total); noncashInput.value = '0'; }
      else if(mode==='allnoncash'){ cashInput.value = '0'; noncashInput.value = fmt(total); }
      else if(mode==='half'){ cashInput.value = fmt(total/2); noncashInput.value = fmt(total/2); }
    });
  });
  const confirmBtn = document.getElementById(idPrefix+'-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
    const c = Math.max(0, Number(cashInput.value)||0);
    const n = Math.max(0, Number(noncashInput.value)||0);
    onConfirm(c, n);
  });
}
function paymentSplit(o){
  if(o.cashAmount!=null || o.noncashAmount!=null){
    return {cash:o.cashAmount||0, noncash:o.noncashAmount||0, unknown:0};

  if(o.paymentMethod==='cash') return {cash:o.total||0, noncash:0, unknown:0};
  if(o.paymentMethod==='noncash') return {cash:0, noncash:o.total||0, unknown:0};
  return {cash:0, noncash:0, unknown:o.total||0};
}
function paymentMethodLabel(o){

function isThisMonth(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
}
function orderCommission(order){
  let oshGrams = 0, oshValue = 0;
  order.items.forEach(it=>{
    if(getItemCategory(it)==='Ош' && it.unit==='kg'){
      oshGrams += it.qty;
      oshValue += lineTotal({unit:'kg', price:it.price}, it.qty);
    }
  });
  const oshCommission = oshGrams >= 500 ? 12 : oshValue*0.05;
  const otherValue = Math.max(0, (order.total||0) - oshValue);
  const otherCommission = otherValue*0.05;
  return oshCommission + otherCommission;
}
function staffCommissionBreakdown(username, role, scope){
  const orders = state.orders.filter(o=>{
    if(o.status!=='paid') return false;
    const ts = o.paidAt || o.updatedAt || o.createdAt;
    if(scope==='today' && !isToday(ts)) return false;
    if(scope==='month' && !isThisMonth(ts)) return false;
    return (role==='waiter' && o.createdBy===username) || (role==='cashier' && o.paidBy===username);
  });
  let countHigh=0, countLow=0, countNoOsh=0, oshSum=0, otherSum=0;
  orders.forEach(o=>{
    let oshGrams=0, oshValue=0;
    o.items.forEach(it=>{
      if(getItemCategory(it)==='Ош' && it.unit==='kg'){ oshGrams+=it.qty; oshValue+=lineTotal({unit:'kg',price:it.price}, it.qty); }
    });
    if(oshGrams>=500){ countHigh++; oshSum+=12; }
    else if(oshGrams>0){ countLow++; oshSum+=oshValue*0.05; }
    else { countNoOsh++; }
    const otherValue = Math.max(0, (o.total||0)-oshValue);
    otherSum += otherValue*0.05;
  });
  return {orderCount:orders.length, countHigh, countLow, countNoOsh, oshSum, otherSum, total: oshSum+otherSum};
}
function staffCommission(username, role, scope){
  return staffCommissionBreakdown(username, role, scope).total;
}
function computeWages(acc){
  if(acc.wageType==='commission'){
    return {
      daily: staffCommission(acc.username, acc.role, 'today'),
      monthly: staffCommission(acc.username, acc.role, 'month')
    };
  }
  const days = Math.max(1, Number(state.settings.workDaysPerMonth) || 30);
  const amount = Number(acc.wageAmount) || 0;
  if(acc.wageType==='monthly'){
    return {daily: amount/days, monthly: amount};
  }
  return {daily: amount, monthly: amount*days};
}
function formatQtyLabel(it){
  if(it.unit==='kg'){
    const g = it.qty;
    const label = g>=1000 ? (Math.round((g/1000)*100)/100)+' кг' : Math.round(g)+' г';
    return label+' '+it.name;
  }
  return it.qty+'× '+it.name;
}
function getItemCategory(it){
  if(it.category) return it.category;
  const m = state.menu.find(x=>x.id===it.menuId);
  return m ? m.category : '';
}

/* ---------- Shared table grid ---------- */
function buildTableCards(){
  let cards = '';
  state.tables.forEach(tbl=>{
    const t = tbl.id;
    const order = activeOrderForTable(t);
    const occ = !!order;
    const reservation = !occ && state.reservations ? state.reservations[t] : null;
    const isRealAdmin = state.currentUser && state.currentUser.role==='admin';
    const actingName = actingUsername();
    const lockedForMe = state.role==='waiter' && tbl.assignedTo && actingName && tbl.assignedTo!==actingName && !(isRealAdmin && !state.previewUsername);
    let dotClass = 'free', statusText = 'Озод', extra = '';
    if(occ){
      dotClass = 'occupied'; statusText = 'Банд';
      extra = `<span class="total mono">${fmtMoney(order.total)}</span>`;
      if(order.type!=='takeaway' && order.type!=='scheduled' && !order.sentToKitchen){
        extra += `<span class="reserve-detail" style="color:var(--brick);">⏳ ба ошпаз нафиристода шуд</span>`;
      }
    } else if(reservation){
      dotClass = 'reserved'; statusText = 'Брон';
      const nm = reservation.name || reservation.note || '';
      const detailParts = [];
      if(reservation.phone) detailParts.push(reservation.phone);
      if(reservation.bookedAt) detailParts.push(fmtTime(reservation.bookedAt));
      const preSum = preOrderSummary(reservation);
      extra = (nm ? `<span class="reserve-note">${escapeHtml(nm)}</span>` : '') +
              (detailParts.length ? `<span class="reserve-detail">${escapeHtml(detailParts.join(' · '))}</span>` : '') +
              (preSum ? `<span class="reserve-detail">🍽 ${escapeHtml(preSum)}</span>` : '');
    }
    const assignBadge = tbl.assignedTo ? `<span class="reserve-detail">👤 ${escapeHtml(tbl.assignedTo)}</span>` : '';
    cards += `
    <button class="table-card ${reservation?'reserved-table':''} ${lockedForMe?'locked-table':''}" data-table="${t}">
      <div class="row1">
        <span class="tnum">${escapeHtml(tbl.name)}</span>
        <span class="dot ${dotClass}"></span>
      </div>
      <span class="status">${statusText} · ${tbl.seats} ҷой</span>
      ${extra}
      ${assignBadge}
      ${lockedForMe ? `<span class="reserve-detail" style="color:var(--brick);">🔒 танҳо ${escapeHtml(tbl.assignedTo)}</span>` : ''}
    </button>`;
  });
  return cards;
}
function attachTableGridEvents(){
  document.querySelectorAll('.table-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      openTable(Number(el.dataset.table));
    });
  });
}

/* ---------- Takeaway (cashier -> chef, no waiter, no table) ---------- */
function takeawayTotal(){
  let total = 0;
  Object.keys(state.takeawayItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item) total += lineTotal(item, state.takeawayItems[mid]);
  });
  return total;
}
function openTakeaway(){
  state.takeawayOpen = true;
  state.takeawayItems = {};
  state.takeawayCat = (state.menu[0] && state.menu[0].category) || null;
  render();
}
function closeTakeaway(){
  state.takeawayOpen = false;
  state.takeawayItems = {};
  render();
}
function changeTakeawayQty(mid, delta){
  const cur = state.takeawayItems[mid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = next;
  render();
}
function addTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.takeawayItems[mid] || 0;
  state.takeawayItems[mid] = cur + g;
  render();
}
function setTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = g;
  render();
}
function removeTakeawayItem(mid){
  delete state.takeawayItems[mid];
  render();
}
async function submitTakeaway(cashAmount, noncashAmount){
  const items = Object.keys(state.takeawayItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.takeawayItems[mid]};
  });
  if(!items.length) return;
  const total = takeawayTotal();
  const todayCount = state.orders.filter(o=>o.type==='takeaway' && isToday(o.createdAt)).length;
  const cash = Math.max(0, Number(cashAmount)||0);
  const noncash = Math.max(0, Number(noncashAmount)||0);
  const order = {
    id: uid('ord'), table: null, type: 'takeaway', status: 'paid', takeawayNumber: todayCount+1,
    items, total, createdAt: Date.now(), updatedAt: Date.now(),
    createdBy: null, paidAt: Date.now(), paidBy: actingUsername(),
    cashAmount: cash, noncashAmount: noncash,
    paymentMethod: cash>0 && noncash>0 ? 'mixed' : (noncash>0 ? 'noncash' : 'cash'),
    prepared: false
  };
  state.orders.push(order);
  await saveOrders(state.orders);
  showToast('Фармоиш пардохт шуд ва ба ошпаз фиристода шуд');
  closeTakeaway();
}

  order.cashAmount = Math.max(0, Number(cashAmount)||0);
  order.noncashAmount = Math.max(0, Number(noncashAmount)||0);

/* ---------- Chef view ---------- */
async function toggleOrderPrepared(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.prepared = !order.prepared;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
}
async function markItemServed(orderId, menuId, amount){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  const amt = Math.max(0, Number(amount)||0);
  if(amt<=0) return;
  const served = Math.min(item.qty, (item.servedQty||0) + amt);
  item.servedQty = served;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
  showToast('Кашида шуд');
}
async function undoItemServed(orderId, menuId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  item.servedQty = 0;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
}
function renderChef(){
  const todays = state.orders.filter(o=>isToday(o.createdAt));
  let porsiyaTotal = 0;
  todays.forEach(o=>{
    o.items.forEach(it=>{
      if(getItemCategory(it)==='Ош' && it.unit!=='kg') porsiyaTotal += it.qty;
    });
  });
  const kgTotal = oshOrderedKgToday();
  const pending = state.orders.filter(o=>{
    if(o.prepared) return false;
    if(o.type==='takeaway') return o.status==='paid';
    if(o.type==='scheduled') return o.status==='active';
    return o.status==='active' && o.sentToKitchen===true;
  }).sort((a,b)=>a.createdAt-b.createdAt);
  const done = state.orders.filter(o=>{
    if(!o.prepared) return false;
    if(o.type==='takeaway') return isToday(o.createdAt);
    if(o.type==='scheduled') return isToday(o.createdAt);
    return o.status==='active' && o.sentToKitchen===true;
  }).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  const hasStock = state.oshStock && state.oshStock.date === todayKey();
  const cookedKg = hasStock ? (Number(state.oshStock.kg)||0) : null;
  const remainingKg = hasStock ? (cookedKg - kgTotal) : null;
  const remainingCard = hasStock
    ? `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="color:${remainingKg<0?'var(--brick)':'var(--olive)'};">${remainingKg.toFixed(2)} кг</div></div>`
    : `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="font-size:13px;color:#9c8f78;">админ ҳанӯз сабт накардааст</div></div>`;

  const renderOrderCard = (o, isDone) => {
    const isTakeaway = o.type==='takeaway' || o.table===null;
    const tbl = isTakeaway ? null : state.tables.find(t=>t.id===o.table);
    const title = orderLabel(o);
    const itemsHtml = o.items.length ? o.items.map(it=>{
      const cat = getItemCategory(it);
      const lineClass = cat==='Ош'?'chef-osh-line':'chef-other-line';
      const served = it.servedQty||0;
      const remaining = Math.max(0, it.qty - served);
      const servedLabel = it.unit==='kg'
        ? formatQtyLabel({name:'', unit:'kg', qty:served}).trim()
        : served+'×';
      const totalLabel = formatQtyLabel(it);
      const progressLine = `<div style="font-size:10px;color:${remaining<=0?'var(--olive)':'#9c8f78'};margin:1px 0 4px;">${remaining<=0?'✅ пурра кашида шуд':`${servedLabel||'0'} аз ${totalLabel} кашида шуд · ${it.unit==='kg'?formatQtyLabel({name:'',unit:'kg',qty:remaining}).trim():remaining+'×'} боқӣ`}</div>`;
      const controlHtml = (!isDone && remaining>0) ? (
        it.unit==='kg' ? `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <input type="number" class="kg-qty-input" id="serve-${o.id}-${it.menuId}" value="${Math.min(remaining,500)}" min="10" max="${remaining}" step="50" style="width:64px;padding:5px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:12px;">
          <span style="font-size:11px;color:#6b5f4d;">г</span>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveitem="${o.id}|${it.menuId}">Кашидан</button>
        </div>` : `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|1">+1 кашидан</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|${remaining}">Ҳама (${remaining}) кашидан</button>
        </div>`
      ) : '';
      return `<div class="${lineClass}">${formatQtyLabel(it)}</div>${progressLine}${controlHtml}`;
    }).join('') : `<div class="receipt-empty">холӣ</div>`;
    return `
    <div class="receipt" style="margin:0 0 14px;${isDone?'opacity:.55;':''}">
      <div class="receipt-title">${escapeHtml(title)}</div>
      ${itemsHtml}
      <div style="margin-top:10px;">
        <button class="${isDone?'btn-ghost':'btn-primary'}" style="padding:8px 16px;font-size:12px;" data-toggleprep="${o.id}">${isDone?'Бозгашт ба навбат':'Тайёр шуд'}</button>
      </div>
    </div>`;
  };

  return `
  <div class="container">
    <div class="section-title">Захираи ош — фақат шумо мебинед</div>
    <div class="stat-row">
      <div class="stat-card"><div class="label">Ош фармоишшуда (кило)</div><div class="value">${kgTotal.toFixed(2)} кг</div></div>
      ${remainingCard}
      <div class="stat-card"><div class="label">Дар навбат</div><div class="value">${pending.length}</div></div>
    </div>
    <p style="font-size:12px;color:#9c8f78;margin:-10px 0 24px;">${porsiyaTotal} порсияи оши имрӯза (ҳар як ${state.settings.porsiyaGrams||120} г — аллакай дар ҳисоби боло ҳамроҳ шудааст)</p>
    <div class="section-title">Дар навбати тайёркунӣ</div>
    ${pending.length ? pending.map(o=>renderOrderCard(o,false)).join('') : '<div class="empty-state">Ҳоло фармоише нест</div>'}
    ${done.length ? `<div class="section-title" style="margin-top:24px;">Тайёр шудаанд</div>${done.map(o=>renderOrderCard(o,true)).join('')}` : ''}
  </div>`;
}
function attachChefEvents(){
  document.querySelectorAll('[data-toggleprep]').forEach(el=>{

      await toggleOrderPrepared(el.dataset.toggleprep);

  document.querySelectorAll('[data-serveitem]').forEach(el=>{

}

    const prevItem = currentOrder ? currentOrder.items.find(p=>p.menuId===mid) : null;

    if(served<=0) return '';
    const m = state.menu.find(x=>x.id===mid) || {unit:'dona'};
    const remaining = Math.max(0, qty - served);
    const servedLabel = m.unit==='kg' ? formatQtyLabel({name:'',unit:'kg',qty:served}).trim() : served+'×';
    const remLabel = m.unit==='kg' ? formatQtyLabel({name:'',unit:'kg',qty:remaining}).trim() : remaining+'×';
    return `<div style="font-size:10px;color:${remaining<=0?'var(--olive)':'#9c8f78'};margin-top:-2px;">${remaining<=0?'✅ пурра кашида шуд':`${servedLabel} кашида шуд · ${remLabel} боқӣ`}</div>`;
  };

    });
    document.querySelectorAll('[data-removeitem]').forEach(el=>{
      el.addEventListener('click', ()=> removeDraftItem(el.dataset.removeitem));
    });
    const saveBtn = document.getElementById('saveTicketBtn');
    if(saveBtn) saveBtn.addEventListener('click', ()=> saveTicket(false));
    const sendKitchenBtn = document.getElementById('sendKitchenBtn');
    if(sendKitchenBtn) sendKitchenBtn.addEventListener('click', ()=> saveTicket(true));
  } else if(mode==='pay'){
    attachSplitPaymentEvents('paytk', draftTotal(), (cash, noncash)=> payTicket(cash, noncash));
  }
}

function renderDailyPaymentTable(){
  const paid = state.orders.filter(o=>o.status==='paid' && o.paidAt);
  if(!paid.length) return `<p style="font-size:13px;color:#9c8f78;">Ҳанӯз ҳеҷ чек пардохт нашудааст</p>`;
  const map = {};
  paid.forEach(o=>{
    const d = new Date(o.paidAt);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!map[key]) map[key] = {cash:0, noncash:0, unknown:0, count:0, label: d.toLocaleDateString('tg-TJ',{day:'2-digit',month:'2-digit',year:'numeric'})};
    const s = paymentSplit(o);
    map[key].cash += s.cash;
    map[key].noncash += s.noncash;
    map[key].unknown += s.unknown;
    map[key].count++;
  });
  const days = Object.keys(map).sort().reverse().slice(0,30);
  const rows = days.map(key=>{
    const d = map[key];
    const total = d.cash + d.noncash + d.unknown;
    return `
    <tr>
      <td>${d.label}</td>
      <td>${d.cash.toFixed(1)}</td>
      <td>${d.noncash.toFixed(1)}</td>
      <td>${d.unknown>0?d.unknown.toFixed(1):'—'}</td>
      <td>${d.count}</td>
      <td class="total-cell">${total.toFixed(1)}</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Сана</th><th>💵 Нақд</th><th>💳 Ғайринақд</th><th>Номаълум</th><th>Чекҳо</th><th>Ҳамагӣ</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderProductBreakdownTable(orders){
  if(!orders.length) return `<p style="font-size:13px;color:#9c8f78;">Имрӯз ҳанӯз фурӯше нашудааст</p>`;
  const map = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      if(!map[it.name]) map[it.name] = {qty:0, unit:it.unit, revenue:0};
      map[it.name].qty += it.qty;
      map[it.name].revenue += lineTotal({unit:it.unit, price:it.price}, it.qty);
    });
  });
  const list = Object.entries(map).map(([name,v])=>({name, ...v})).sort((a,b)=>b.revenue-a.revenue);
  const totalRevenue = list.reduce((s,p)=>s+p.revenue,0);
  const rows = list.map(p=>{
    const qtyLabel = p.unit==='kg'
      ? (p.qty>=1000 ? (Math.round((p.qty/1000)*100)/100)+' кг' : Math.round(p.qty)+' г')
      : p.qty+' дона';
    return `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${qtyLabel}</td>
      <td class="total-cell">${p.revenue.toFixed(1)} смн</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Маҳсулот</th><th>Миқдор</th><th>Даромад</th></tr></thead>
    <tbody>
      ${rows}
      <tr><td style="font-weight:700;">Ҳамагӣ</td><td></td><td class="total-cell">${totalRevenue.toFixed(1)} смн</td></tr>
    </tbody>
  </table>`;
}

    if(btn) btn.addEventListener('click', async ()=>{
      const cafeName = document.getElementById('cafeNameInput').value.trim() || 'Кафеи ман';
      state.settings = {...state.settings, cafeName};
      await saveSettings(state.settings);
      showToast('Танзимот сабт шуд');
      render();
    });
    const resetBtn = document.getElementById('resetMenuBtn');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{ state.confirmResetMenu = true; render(); });
    const cancelResetBtn = document.getElementById('cancelResetBtn');
    if(cancelResetBtn) cancelResetBtn.addEventListener('click', ()=>{ state.confirmResetMenu = false; render(); });
    const saveOshBtn = document.getElementById('saveOshStockBtn');
    if(saveOshBtn) saveOshBtn.addEventListener('click', async ()=>{
      const kg = Math.max(0, Number(document.getElementById('oshStockInput').value) || 0);
      state.oshStock = {date: todayKey(), kg};
      await saveOshStock(state.oshStock);
      showToast('Миқдори ош сабт шуд');
      render();
    });
    const savePorsiyaBtn = document.getElementById('savePorsiyaGramsBtn');
    if(savePorsiyaBtn) savePorsiyaBtn.addEventListener('click', async ()=>{
      const g = Math.max(1, Number(document.getElementById('porsiyaGramsInput').value) || 120);
      state.settings = {...state.settings, porsiyaGrams: g};
      await saveSettings(state.settings);
      showToast('Сабт шуд');
      render();
    });
    const confirmResetBtn = document.getElementById('confirmResetBtn');
    if(confirmResetBtn) confirmResetBtn.addEventListener('click', async ()=>{
      state.menu = DEFAULT_MENU.map(m=>({...m}));
      await saveMenu(state.menu);
      state.confirmResetMenu = false;
      showToast('Менюи пешфарз барқарор шуд');
      render();
    });
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

init();
