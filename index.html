function renderDailyPaymentTable(){
  // The daily payment history is a report view. Archived orders belong to the
  // closed/cleared accounting archive and must never reappear in this table.
  const paid = state.orders.filter(o=>o.status==='paid' && o.paidAt && o.archived!==true && inCurrentReportPeriod(o.paidAt));
  if(!paid.length) return `<p style="font-size:13px;color:#9c8f78;">Ҳанӯз ҳеҷ чек пардохт нашудааст</p>`;
  const map = {};
  paid.forEach(o=>{
    const d = new Date(o.paidAt);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!map[key]) map[key] = {cash:0, noncash:0, unknown:0, count:0, label: d.toLocaleDateString('tg-TJ',{day:'2-digit',month:'2-digit',year:'numeric'})};
    const s = paymentSplit(o);
    map[key].cash += s.cash;
    map[key].noncash += s.noncash;
    map[key].unknown += s.unknown;
    map[key].count++;
  });
  const days = Object.keys(map).sort().reverse().slice(0,30);
  const rows = days.map(key=>{
    const d = map[key];
    const total = d.cash + d.noncash + d.unknown;
    return `
    <tr>
      <td>${d.label}</td>
      <td>${d.cash.toFixed(1)}</td>
      <td>${d.noncash.toFixed(1)}</td>
      <td>${d.unknown>0?d.unknown.toFixed(1):'—'}</td>
      <td>${d.count}</td>
      <td class="total-cell">${total.toFixed(1)}</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Сана</th><th>💵 Нақд</th><th>💳 Ғайринақд</th><th>Номаълум</th><th>Чекҳо</th><th>Ҳамагӣ</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderProductBreakdownTable(orders){
  if(!orders.length) return `<p style="font-size:13px;color:#9c8f78;">Имрӯз ҳанӯз фурӯше нашудааст</p>`;
  const map = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      const dName = reportItemDisplayName(o, it);
      if(!map[dName]) map[dName] = {qty:0, unit:it.unit, revenue:0};
      map[dName].qty += it.qty;
      map[dName].revenue += lineTotal({unit:it.unit, price:it.price}, it.qty);
    });
  });
  const list = Object.entries(map).map(([name,v])=>({name, ...v})).sort((a,b)=>b.revenue-a.revenue);
  const totalRevenue = list.reduce((s,p)=>s+p.revenue,0);
  const rows = list.map(p=>{
    const qtyLabel = p.unit==='kg'
      ? (p.qty>=1000 ? (Math.round((p.qty/1000)*100)/100)+' кг' : Math.round(p.qty)+' г')
      : p.qty+' дона';
    return `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${qtyLabel}</td>
      <td class="total-cell">${p.revenue.toFixed(1)} смн</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Маҳсулот</th><th>Миқдор</th><th>Даромад</th></tr></thead>
    <tbody>
      ${rows}
      <tr><td style="font-weight:700;">Ҳамагӣ</td><td></td><td class="total-cell">${totalRevenue.toFixed(1)} смн</td></tr>
    </tbody>
  </table>`;
}

  if(typeof XLSX === 'undefined'){ showToast('Китобхонаи Excel бор нашуд — интернетро санҷед'); return; }
  const paidToday = state.orders.filter(o=>o.status==='paid' && o.archived!==true && o.paidAt && inCurrentReportPeriod(o.paidAt));
  const revenue = paidToday.reduce((s,o)=>s+o.total,0);
  const cashToday = paidToday.reduce((s,o)=>s+paymentSplit(o).cash,0);
  const noncashToday = paidToday.reduce((s,o)=>s+paymentSplit(o).noncash,0);
  const serviceChargeToday = paidToday.reduce((s,o)=>s+(Number(o.serviceCharge)||0),0);

  const wb = XLSX.utils.book_new();

  const summaryRows = [
    ['Ҳисоботи рӯзи', new Date().toLocaleDateString('tg-TJ')],
    [],
    ['Даромади имрӯз (смн)', Number(revenue.toFixed(2))],
    ['Нақд (смн)', Number(cashToday.toFixed(2))],
    ['Ғайринақд (смн)', Number(noncashToday.toFixed(2))],
    ['Ҳаққи хизматрасонӣ (смн)', Number(serviceChargeToday.toFixed(2))],
    ['Шумораи чекҳо', paidToday.length]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'Хулоса');

  const prodMap = {};
  paidToday.forEach(o=>{
    o.items.forEach(it=>{
      if(!prodMap[it.name]) prodMap[it.name] = {qty:0, unit:it.unit, revenue:0};
      prodMap[it.name].qty += it.qty;
      prodMap[it.name].revenue += lineTotal({unit:it.unit, price:it.price}, it.qty);
    });
  });
  const prodRows = [['Маҳсулот','Миқдор','Воҳид','Даромад (смн)']];
  Object.entries(prodMap).sort((a,b)=>b[1].revenue-a[1].revenue).forEach(([name,v])=>{
    prodRows.push([name, Number(v.qty.toFixed(2)), v.unit==='kg'?'кг/г':'дона', Number(v.revenue.toFixed(2))]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(prodRows), 'Маҳсулот');

  const receiptRows = [['Вақт','Миз/Навъ','Пардохткунанда','Нақд','Ғайринақд','Ҳамагӣ']];
  paidToday.sort((a,b)=>b.paidAt-a.paidAt).forEach(o=>{
    const s = paymentSplit(o);
    receiptRows.push([
      new Date(o.paidAt).toLocaleTimeString('tg-TJ',{hour:'2-digit',minute:'2-digit'}),
      o.type==='takeaway' ? 'Бо худ бурдан №'+(o.takeawayNumber||'') : o.type==='scheduled' ? 'Вақтдор' : ('Мизи '+o.table),
      o.paidBy||'',
      Number(s.cash.toFixed(2)), Number(s.noncash.toFixed(2)), Number(o.total.toFixed(2))
    ]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(receiptRows), 'Чекҳои имрӯза');

  const dayMap = {};
  // Exported daily history must match the on-screen report and exclude archived
  // orders, including orders archived when the report history was cleared.
  state.orders.filter(o=>o.status==='paid' && o.paidAt && o.archived!==true).forEach(o=>{
    const d = new Date(o.paidAt);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!dayMap[key]) dayMap[key] = {cash:0, noncash:0, count:0, label: d.toLocaleDateString('tg-TJ')};
    const s = paymentSplit(o);
    dayMap[key].cash += s.cash; dayMap[key].noncash += s.noncash; dayMap[key].count++;
  });
  const dailyRows = [['Сана','Нақд','Ғайринақд','Чекҳо','Ҳамагӣ']];
  Object.keys(dayMap).sort().reverse().slice(0,30).forEach(key=>{
    const d = dayMap[key];
    dailyRows.push([d.label, Number(d.cash.toFixed(2)), Number(d.noncash.toFixed(2)), d.count, Number((d.cash+d.noncash).toFixed(2))]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dailyRows), 'Рӯзона (30 рӯз)');

  const fname = 'hisobot-' + todayKey() + '.xlsx';
  XLSX.writeFile(wb, fname);
  showToast('Файли Excel боргирӣ шуд');
}

    if(saveDelayWarnBtn) saveDelayWarnBtn.addEventListener('click', async ()=>{
      const m = Math.max(1, Number(document.getElementById('delayWarnInput').value) || 15);
      state.settings = {...state.settings, delayWarnMinutes: m};
      await saveSettings(state.settings);
      showToast('Сабт шуд');
      render();
    });
    const saveTakeawayDiscountBtn = document.getElementById('saveTakeawayDiscountBtn');
    if(saveTakeawayDiscountBtn) saveTakeawayDiscountBtn.addEventListener('click', async ()=>{
      const pct = Math.max(0, Math.min(100, Number(document.getElementById('takeawayDiscountInput').value) || 0));
      state.settings = {...state.settings, takeawayDiscountPct: pct};
      await saveSettings(state.settings);
      showToast('Сабт шуд');
      render();
    });
    const saveServiceChargeBtn = document.getElementById('saveServiceChargeBtn');
    if(saveServiceChargeBtn) saveServiceChargeBtn.addEventListener('click', async ()=>{
      const pct = Math.max(0, Math.min(100, Number(document.getElementById('serviceChargeInput').value) || 0));
      state.settings = {...state.settings, serviceChargePct: pct};
      await saveSettings(state.settings);
      showToast('Сабт шуд');
      render();
    });
    const savePaymentVoice = async ()=>{
      const enabled = !!document.getElementById('paymentVoiceEnabled').checked;
      const input = document.getElementById('paymentVoiceText');
      const voiceText = String(input ? input.value : '').trim()
        || 'Пардохти мизи рақами {TABLE} иҷро шуд.{NAME}';

      const nextSettings = Object.assign({}, state.settings, {
        paymentVoiceEnabled: enabled,
        paymentVoiceText: voiceText
      });

      const ok = await saveSettings(nextSettings);
      if(!ok) return;

      state.settings = nextSettings;
      showToast('Матни овози пардохт сабт шуд');
      render();
    };

    const savePaymentVoiceBtn = document.getElementById('savePaymentVoiceBtn');
    if(savePaymentVoiceBtn) savePaymentVoiceBtn.addEventListener('click', savePaymentVoice);

    const paymentVoiceTextInput = document.getElementById('paymentVoiceText');
    if(paymentVoiceTextInput) paymentVoiceTextInput.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); savePaymentVoice(); }
    });

    const confirmResetBtn = document.getElementById('confirmResetBtn');
    if(confirmResetBtn) confirmResetBtn.addEventListener('click', async ()=>{
      state.menu = DEFAULT_MENU.map(m=>({...m}));
      await saveMenu(state.menu);
      state.confirmResetMenu = false; state.confirmDeleteOldOrders = false;
      showToast('Менюи пешфарз барқарор шуд');
      render();
    });
  }
}


// Catch up on any real-time data that arrived while a field had focus: the moment focus
// leaves an input/select/textarea (and doesn't immediately land on another one), redraw once
// so the screen reflects whatever came in while it was deferred.
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(state.role && state.activeTable===null && !state.scheduledOpen && !state.takeawayOpen && !state.viewingOrderId && !isActivelyEditingFormField()){
      render();
    }
  }, 50);
}, true);

// Mobile OSes routinely suspend a backgrounded tab's network/JS to save battery, so a real-time
// listener can sit stale for as long as the phone was locked or the app was switched away from.
// The instant the app becomes visible again, force one fresh fetch of everything (not just wait
// for Firestore's listeners to reconnect on their own) so the screen is correct within moments
// of the person looking at it again, regardless of how long it was backgrounded.
document.addEventListener('visibilitychange', ()=>{
  // When the app comes back to foreground, just re-render from current state.
  // onSnapshot listeners reconnect automatically; a full re-read is not needed
  // and was causing a surge of reads every time the phone screen was unlocked.
  if(document.visibilityState==='visible' && state.role && state.loaded && !state.loadError && !state.needsSetup){
    render();
  }
});

// The browser fires this the moment it detects the connection is back after being down —
// catch up immediately rather than waiting for the next watchdog tick.
window.addEventListener('online', ()=>{
  // Firestore onSnapshot listeners automatically resume on network reconnect without re-reading unchanged docs.
  if(state.role && state.loaded && !state.loadError && !state.needsSetup){
    render();
  }
});

/* ============ UPDATE CHECK ============
   A PWA that's been left open for hours (a whole shift) keeps running the JS it loaded at
   launch — a fix shipped after that stays invisible until the person happens to fully close
   and reopen the app. Periodically check a small version file (never cached) and, if it no
   longer matches what's running, show a banner offering an immediate reload. */
let __updateBannerShown = false;
// Fully clears everything the browser cached for this app — unregisters the service worker
// (so a stale worker never intercepts requests again) and empties every Cache Storage bucket
// it created — then reloads. This is what staff used to have to do by hand in Chrome's
// settings; doing it here means the "Навсозӣ" button alone is enough, every time.
async function hardRefreshApp(){
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){ console.error('hardRefreshApp cleanup failed', e); }
  // A plain reload() can still be answered by the browser's (or a CDN's) HTTP cache with the
  // very same stale index.html — the service worker and Cache Storage are clean, but that
  // doesn't touch this layer, so the banner would just reappear forever. Force a truly fresh
  // fetch by navigating to a cache-busted URL instead of calling reload().
  const url = new URL(window.location.href);
  url.searchParams.set('_v', String(Date.now()));
  window.location.replace(url.toString());
}
function showUpdateBanner(){
  if(__updateBannerShown) return;
  __updateBannerShown = true;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;background:var(--ink);color:var(--paper);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;box-shadow:0 -2px 10px rgba(0,0,0,.2);';
  bar.innerHTML = `<span>🔄 Нусхаи нави барнома дастрас аст</span><button style="background:var(--brick);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-weight:700;font-family:inherit;font-size:13px;">Навсозӣ</button>`;
  bar.querySelector('button').addEventListener('click', hardRefreshApp);
  document.body.appendChild(bar);
}
async function checkForUpdate(){
  try{
    const res = await fetch('./version.json?t=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data && data.version && data.version !== APP_VERSION) showUpdateBanner();
  }catch(e){}
}
setInterval(checkForUpdate, 3*60*1000); // every 3 minutes
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') checkForUpdate();
});
window.addEventListener('online', checkForUpdate);
setTimeout(checkForUpdate, 5000); // one soon after launch too, not just on the long timer

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
