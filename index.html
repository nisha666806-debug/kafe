}
function draftTotal(){
  let total = 0;
  Object.keys(state.draftItems).forEach(mid=>{
    const item = menuForKey(mid);
    if(item) total += lineTotal(item, state.draftItems[mid]);
  });
  return total;
}
// Тахфифи оши собойи иловагӣ дар чеки миз
function draftDiscount(){
  const pct = takeawayOshDiscountPct();
  if(pct<=0) return 0;
  let base = 0;
  Object.keys(state.draftItems).forEach(k=>{
    if(!isTaKey(k)) return;
    const m = menuForKey(k);
    if(m && isOshDiscountItem(m)) base += lineTotal(m, state.draftItems[k]);
  });
  return roundMoney(base * pct / 100);
}
function ticketDraftDirty(order){
  if(!order) return false;
  const items = order.items || [];
  const keys = Object.keys(state.draftItems);
  if(keys.length !== items.length) return true;
  return items.some(it=> Number(state.draftItems[it.menuId]) !== Number(it.qty));
}
// Service charge — only for dine-in (eat-in) checks, never takeaway.
function serviceChargeAmount(subtotal){
  const pct = Math.max(0, Math.min(100, Number(state.settings.serviceChargePct)||0));
  return subtotal * (pct/100);
}
function serviceBaseFromItems(items){
  return (items||[]).reduce((s,it)=>{
    const m = state.menu.find(x=>x.id===baseMenuId(it.menuId));
    if((m && m.noService) || it.noService || it.isExtra || it.takeawayOsh || isTaKey(it.menuId) || isLaaliName(it.name)) return s;
    return s + lineTotal({unit:it.unit, price:it.price}, it.qty);
  },0);
}
function draftServiceBase(){
  let t = 0;
  Object.keys(state.draftItems).forEach(mid=>{
    if(isTaKey(mid)) return;
    const m = menuForKey(mid);
    if(m && !m.noService && !m.isExtra && !m.takeawayOsh && !isLaaliName(m.name)) t += lineTotal(m, state.draftItems[mid]);
  });
  return t;
}
function draftTotalWithService(){
  return roundMoney(Math.max(0, draftTotal() - draftDiscount()) + serviceChargeAmount(draftServiceBase()));
}
function draftTotalWithService_old(){
  const subtotal = draftTotal();
  return subtotal + serviceChargeAmount(subtotal);
}
function lineTotal(menuItem, amount){
  return menuItem.unit==='kg' ? menuItem.price * (amount/1000) : menuItem.price * amount;
}
function isHeadWaiterAccount(accOrUsername){
  const acc = (typeof accOrUsername === 'string')
    ? (state.accounts||[]).find(a=>a.username===accOrUsername)
    : accOrUsername;
  return !!(acc && acc.role==='waiter' && acc.isHeadWaiter);
}
function isCurrentHeadWaiter(){
  return state.role==='waiter' && isHeadWaiterAccount(actingUsername());
}
function waiterLockedFromReducing(){
  return state.role==='waiter' && !isCurrentHeadWaiter();
}
function committedTicketItemQty(mid){
  const ord = activeOrderForTable(state.activeTable);
  if(!ord || !Array.isArray(ord.items)) return 0;
  const found = ord.items.find(it=>it.menuId===mid);
  return found ? Math.max(0, Number(found.qty)||0) : 0;
}
function changeQty(mid, delta){
  const cur = state.draftItems[mid] || 0;
  const minQty = waiterLockedFromReducing() ? committedTicketItemQty(mid) : 0;
  if(delta < 0 && waiterLockedFromReducing() && cur + delta < minQty){
    showToast('Танҳо Сарофитсиант, Кассир ё Админ маҳсулоти қабулшударо кам карда метавонад');
    return;
  }
  const next = Math.max(minQty, cur + delta);
  if(next === 0) delete state.draftItems[mid];
  else state.draftItems[mid] = next;
  render();
}
function addGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.draftItems[mid] || 0;
  state.draftItems[mid] = cur + g;
  render();
}
function setGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  const minQty = waiterLockedFromReducing() ? committedTicketItemQty(mid) : 0;
  if(waiterLockedFromReducing() && g < minQty){
    showToast('Танҳо Сарофитсиант, Кассир ё Админ миқдори қабулшударо кам карда метавонад');
    state.draftItems[mid] = Math.max(curQtyOrMin(mid, minQty), minQty);
    render();
    return;
  }
  if(g<=0) delete state.draftItems[mid];
  else state.draftItems[mid] = g;
  render();
}
function curQtyOrMin(mid, minQty){
  return Math.max(Number(state.draftItems[mid])||0, minQty);
}
function removeDraftItem(mid){
  const minQty = waiterLockedFromReducing() ? committedTicketItemQty(mid) : 0;
  if(waiterLockedFromReducing() && minQty > 0){
    showToast('Танҳо Сарофитсиант, Кассир ё Админ маҳсулоти қабулшударо нест карда метавонад');
    return;
  }
  delete state.draftItems[mid];
  render();
}
async function saveTicket(sendFlag, opts){
  opts = opts || {};
  try{
    if(!validateCustomerArrival()) return false;
  let order = activeOrderForTable(state.activeTable);
  const prevItems = order ? (order.items || []) : [];
  if(order && waiterLockedFromReducing()){
    for(const p of prevItems){
      const curQ = Number(state.draftItems[p.menuId]) || 0;
      const prevQ = Number(p.qty) || 0;
      if(curQ < prevQ){
        showToast('Танҳо Сарофитсиант, Кассир ё Админ маҳсулоти қабулшударо кам карда метавонад');
        state.draftItems[p.menuId] = prevQ;
        render();
        return false;
      }
    }
  }
  if(!Object.keys(state.draftItems).length && order && isCurrentHeadWaiter()){
    showToast('Чек холӣ шуда наметавонад — «Бекор кардани фармоиш»-ро истифода баред');
    return false;
  }
  let droppedAny = false;
  const items = Object.keys(state.draftItems).map(mid=>{
    const m = menuForKey(mid);
    if(!m){ droppedAny = true; return null; }
    const prev = prevItems.find(p=>p.menuId===mid);
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category,
      noService:!!m.noService || !!m.isExtra || isLaaliName(m.name), isExtra:!!m.isExtra, takeawayOsh:!!m.takeawayOsh,
      qty:state.draftItems[mid], servedQty: prev?(prev.servedQty||0):0};
  }).filter(Boolean);
  if(droppedAny) showToast('Баъзе маҳсулот дигар дар меню нест — аз чек хориҷ шуд');
  if(!items.length && order && state.role==='cashier'){
    showToast('Чек холӣ шуда наметавонад — «Бекор кардани фармоиш»-ро истифода баред');
    return false;
  }
  const subtotal = draftTotal();
  const discount = draftDiscount();
  const serviceCharge = serviceChargeAmount(draftServiceBase());
  const total = roundMoney(Math.max(0, subtotal - discount) + serviceCharge);
  let isNew = false;
  if(!order){
    isNew = true;
    order = {id:uid('ord'), table:state.activeTable, status:'active', items:[], total:0, createdAt:Date.now(),
      createdBy: actingUsername(), sentToKitchen:false, source:'waiter',
      oshShift: activeOshShift(),
      customerType: state.customerPhone ? 'with_order' : 'without_order',
      customerPhone: state.customerPhone || null};
    state.orders.push(order);
  }
  if(isNew && state.role==='waiter'){
    order.customerType = state.customerPhone ? 'with_order' : 'without_order';
    order.customerPhone = state.customerPhone || null;
  }
  if(!isNew && order && orderSourceKind(order)==='sched' && (!Array.isArray(order.initialItems) || !order.initialItems.length)){
    order.initialItems = (prevItems||[]).map(it=>({menuId:baseMenuId(it.menuId), name:it.name, unit:it.unit||'dona', category:it.category, qty:Number(it.qty)||0}));
  }
  const editedByCashier = !isNew && !!opts.cashierEdit;
  order.items = items;
  order.total = total;
  order.subtotal = subtotal;
  order.discount = discount;
  order.discountPct = discount>0 ? takeawayOshDiscountPct() : 0;
  order.serviceCharge = serviceCharge;
  order.updatedAt = Date.now();
  if(editedByCashier){ order.editedByCashier = actingUsername(); order.editedByCashierAt = Date.now(); }
  const prevSentToKitchen = !isNew && !!order.sentToKitchen;
  const prevOshKg = oshWeightFromItems(prevItems);
  const nextOshKg = oshWeightFromItems(items);
  if(sendFlag){
    const enteringQueueNow = !prevSentToKitchen || !!order.oshDelivered || !!order.prepared || (nextOshKg > prevOshKg + 0.001);
    order.sentToKitchen = true;
    if(enteringQueueNow){
      order.sentToKitchenAt = Date.now();
      order.prepared = false;
      order.oshDelivered = false;
    }
    const inventoryOk = await deductForOrderDelta(order, items);
    if(inventoryOk===false){
      showToast('Анбор нав нашуд — фармоиш фиристода нашуд');
      return false;
    }
  } else {
    if(isNew){
      order.sentToKitchen = false;
      order.oshDelivered = false;
    }
  }
  // Save ONLY the order being created/edited.
  const saved = await saveOrderV2(order);
  if(!saved){
    showToast('Хатогӣ ҳангоми нигоҳдории фармоиш');
    return false;
  }
  if(editedByCashier){
    try{ await logActivity('Кассир чекро тағйир дод: '+orderLabel(order)+' → '+fmtMoney(total)); }catch(e){}
  }
  if(!opts.silent){
    if(sendFlag) showToast('🍚 Фармоиш ба ошпаз фиристода шуд');
    else if(editedByCashier) showToast('✏️ Тағйироти чек сабт шуд');
    else showToast(order.sentToKitchen ? '💾 Тағйироти чек захира шуд' : '💾 Чек захира шуд (ҳанӯз ба ошпаз фиристода нашудааст)');
  }
  if(!opts.keepOpen) closeTicket();
  return true;
  }catch(e){
    console.error('saveTicket failed', e);
    showToast('Хатогӣ ҳангоми захира кардани фармоиш');
    return false;
  }
}


async function moveOrderToTable(orderId, targetTableId, newWaiterUsername){
  const order = state.orders.find(o=>o.id===orderId && o.status==='active');
  if(!order){ showToast('Фармоиши фаъол ёфт нашуд'); return false; }
  const targetId = Number(targetTableId);
  if(!targetId || targetId === Number(order.table)){ showToast('Мизи навро интихоб кунед'); return false; }
  if(activeOrderForTable(targetId)){ showToast('Ин миз аллакай банд аст'); return false; }
  const oldTbl = state.tables.find(t=>t.id===order.table);
  const newTbl = state.tables.find(t=>t.id===targetId);
  const oldName = oldTbl ? oldTbl.name : ('Мизи №'+order.table);
  const newName = newTbl ? newTbl.name : ('Мизи №'+targetId);
  const prevWaiter = order.createdBy || '';
  const chosenWaiter = (newWaiterUsername !== undefined && newWaiterUsername !== null && String(newWaiterUsername).trim() !== '')
    ? String(newWaiterUsername).trim()
    : ((newTbl && newTbl.assignedTo) ? newTbl.assignedTo : (state.role==='waiter' && actingUsername() ? actingUsername() : prevWaiter));
  order.table = targetId;
  if(chosenWaiter) order.createdBy = chosenWaiter;
  order.updatedAt = Date.now();
  const ok = await saveOrderV2(order);
  if(!ok){ showToast('Хатогӣ ҳангоми кӯчонидани миз'); return false; }
  if(state.activeTable !== null) state.activeTable = targetId;
  const waiterLogPart = chosenWaiter && chosenWaiter !== prevWaiter
    ? (' · официант: '+(prevWaiter||'—')+' → '+chosenWaiter)
    : (chosenWaiter ? (' · официант: '+chosenWaiter) : '');
  try{ await logActivity('Фармоишро аз '+oldName+' ба '+newName+' кӯчонид'+waiterLogPart); }catch(e){}
  showToast('🔄 Фармоиш ба '+newName+' кӯчонида шуд'+(order.createdBy ? ' (👤 '+order.createdBy+')' : ''));
  render();
  return true;
}

/* ---------- PAYMENT SAFETY v11 ----------
   Payment is committed atomically in Firestore. A paid/cancelled order can never
   be downgraded by a stale client copy. The same helper is used by cash/non-cash/mixed.
*/
async function commitPaidOrderAtomic(orderId, cashAmount, noncashAmount){
  if(!db) return {ok:false,message:'Хатогӣ дар нигоҳдорӣ'};
  const cash=Math.max(0,Number(cashAmount)||0);
  const noncash=Math.max(0,Number(noncashAmount)||0);
  try{
    return await db.runTransaction(async tx=>{
      const ref=orderDocRef(orderId);
      const snap=await tx.get(ref);
      if(!snap.exists) return {ok:false,message:'Фармоиш дар база ёфт нашуд'};
      const remote={...(snap.data()||{}),id:(snap.data()||{}).id||snap.id};

      // Idempotency: terminal orders can never be paid twice or reopened.
      if(remote.status==='paid'||remote.status==='cancelled'){
        return {ok:false,alreadyTerminal:true,status:remote.status,order:remote};
      }

      const total=Number(remote.total||0);
      if(Math.abs(cash+noncash-total)>0.01){
        return {ok:false,message:'Маблағи пардохт ба маблағи чек баробар нест'};
      }

      const now=Date.now();
      const isSchedTakeaway = remote.type==='scheduled' && remote.deliveryType==='takeaway';
      const paid={
        ...remote,
        type: isSchedTakeaway ? 'takeaway' : remote.type,
        prepared: (remote.type==='takeaway' || isSchedTakeaway) ? true : !!remote.prepared,
        status:'paid',
        paidAt:now,
        paidBy:actingUsername(),
        receivedAt: (remote.type==='scheduled' || remote.type==='takeaway') ? now : (remote.receivedAt || null),
        cashAmount:cash,
        noncashAmount:noncash,
        paymentMethod:cash>0&&noncash>0?'mixed':(noncash>0?'noncash':'cash'),
        lockedAt:now,
        updatedAt:now
      };
      const paidClean=stripUndefinedDeep(paid);
      tx.set(ref,paidClean,{merge:true});
      return {ok:true,order:paidClean};
    });
  }catch(e){
    console.error('commitPaidOrderAtomic failed:',e);
    return {ok:false,message:'Пардохт дар база сабт нашуд'};
  }
}

async function payTicket(cashAmount, noncashAmount){
  const order=activeOrderForTable(state.activeTable);
  if(!order) return;
  // Агар кассир чекро тағйир дода бошад — аввал тағйирот сабт мешавад, баъд пардохт.
  if(state.role==='cashier' && ticketDraftDirty(order)){
    const okSave = await saveTicket(!!order.sentToKitchen, {keepOpen:true, silent:true, cashierEdit:true});
    if(!okSave) return;
  }
  const cash=Math.max(0,Number(cashAmount)||0);
  const noncash=Math.max(0,Number(noncashAmount)||0);
  const expected=Number(order.total||0);
  if(Math.abs(cash+noncash-expected)>0.01){
    showToast('Маблағи нақд + ғайринақд бояд ба маблағи чек баробар бошад'); return;
  }

  const result=await commitPaidOrderAtomic(order.id,cash,noncash);
  if(!result.ok){
    if(result.alreadyTerminal && result.order){
      state.orders=state.orders.map(o=>o.id===result.order.id?result.order:o);
      if(result.status==='paid') showToast('Ин чек аллакай баста шудааст');
      else showToast('Ин фармоиш аллакай бекор шудааст');
    }else{
      showToast(result.message||'Пардохт сабт нашуд');
    }
    render();
    return;
  }

  // Update local state only AFTER the Firebase transaction has committed.
  state.orders=state.orders.map(o=>o.id===order.id?result.order:o);
  speakPaymentSuccess(result.order);
  // Reset the chef/cashier "new order" detector before redraw so a terminal order
  // can never generate a false "Фармоиши нав" announcement.
  if(state.seenPendingIds instanceof Set) state.seenPendingIds.delete(order.id);
  if(state.seenCashierOrderIds instanceof Set) state.seenCashierOrderIds.delete(order.id);
  showToast('Чек пардохт шуд');
  closeTicket();
}

function speakPaymentSuccess(order){
  try{
    if(!('speechSynthesis' in window)) return;
    if(state.settings && state.settings.paymentVoiceEnabled===false) return;
    const tbl=state.tables.find(t=>t.id===order.table);
    const tableName=tbl ? String(tbl.name||tbl.number||order.table||'').trim() : String(order.table||'').trim();
    const customer=String(order.customerName||order.clientName||order.customer||'').trim();
    const template=String((state.settings && state.settings.paymentVoiceText)||'Пардохти мизи рақами {TABLE} иҷро шуд.{NAME}');
    const namePart=customer ? ` Номи клиент: ${customer}.` : '';
    const spoken=template.replace(/\{TABLE\}/gi,tableName||'—').replace(/\{NAME\}/gi,namePart);
    if(!spoken.trim()) return;
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(spoken);
    utter.lang='ru-RU'; utter.rate=0.9; utter.pitch=1;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function attachSplitPaymentEvents(idPrefix, total, onConfirm){
  const cashInput = document.getElementById(idPrefix+'-cash');
  const noncashInput = document.getElementById(idPrefix+'-noncash');
  if(!cashInput || !noncashInput) return;
  const clamp = (v)=> Math.max(0, Math.min(total, Number(v)||0));
  const fmt = (v)=> (Math.round(v*100)/100).toString();
  cashInput.addEventListener('input', ()=>{
    const c = clamp(cashInput.value);
    noncashInput.value = fmt(total - c);
  });
  noncashInput.addEventListener('input', ()=>{
    const n = clamp(noncashInput.value);
    cashInput.value = fmt(total - n);
  });
  document.querySelectorAll('[data-splitquick^="' + idPrefix + '|"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const mode = el.dataset.splitquick.split('|')[1];
      if(mode==='allcash'){ cashInput.value = fmt(total); noncashInput.value = '0'; }
      else if(mode==='allnoncash'){ cashInput.value = '0'; noncashInput.value = fmt(total); }
      else if(mode==='half'){ cashInput.value = fmt(total/2); noncashInput.value = fmt(total/2); }
    });
  });
  const confirmBtn = document.getElementById(idPrefix+'-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
    const c = Math.max(0, Number(cashInput.value)||0);
    const n = Math.max(0, Number(noncashInput.value)||0);
    onConfirm(c, n);
  });
}

function playWaiterCallRingBurst(){
  try{
    __alertAudioCtx = __alertAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __alertAudioCtx;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    // Loud 4-tone phone bell ring pattern
    const notes = [
      {f:880, t:0, d:0.16},
      {f:1174.66, t:0.18, d:0.16},
      {f:880, t:0.36, d:0.16},
      {f:1174.66, t:0.54, d:0.22},
      {f:880, t:0.90, d:0.16},
      {f:1174.66, t:1.08, d:0.16},
      {f:880, t:1.26, d:0.16},
      {f:1174.66, t:1.44, d:0.25}
    ];
    notes.forEach(n=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0.001, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.45, now + n.t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.t + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + n.t);
      osc.stop(now + n.t + n.d + 0.02);
    });
    if(navigator.vibrate){
      try{ navigator.vibrate([450, 150, 450, 150, 600]); }catch(e){}
    }
  }catch(e){}
}

function activeCashierCallsForMe(){
  if(state.role!=='waiter') return [];
  const me = actingUsername();
  return (state.orders||[]).filter(o=>{
    if(!o || o.status!=='active') return false;
    const callAt = Number(o.cashierCallAt)||0;
    const ackAt = Number(o.cashierCallAckAt)||0;
    if(!callAt || ackAt >= callAt) return false;
    // Ignore stale calls older than 30 minutes
    if(Date.now() - callAt > 30*60*1000) return false;
    const target = o.cashierCallTarget || o.createdBy || '';
    if(!target || target==='all' || !me) return true;
    return target.toLowerCase() === me.toLowerCase() || (o.createdBy && o.createdBy.toLowerCase() === me.toLowerCase());
  });
}
function checkAndTriggerWaiterCallAlerts(){
  const calls = activeCashierCallsForMe();
  if(!calls.length){
    if(__waiterRingInterval){ clearInterval(__waiterRingInterval); __waiterRingInterval = null; }
    return;
  }
  state.__seenCashierCallMap = state.__seenCashierCallMap || {};
  let hasNewCall = false;
  let newestOrder = calls[0];
  calls.forEach(o=>{
    const callAt = Number(o.cashierCallAt)||0;
    if(callAt > (state.__seenCashierCallMap[o.id]||0)){
      state.__seenCashierCallMap[o.id] = callAt;
      hasNewCall = true;
      newestOrder = o;
    }
  });
  if(hasNewCall){
    playWaiterCallRingBurst();
    setTimeout(()=>speakWaiterCallAlert(newestOrder), 600);
    if('Notification' in window && Notification.permission==='granted'){
      try{ new Notification('🔔 Даъват ба назди касса!', {body: orderLabel(newestOrder)+' — Кассир шуморо ба назди касса ҷеғ мезанад'}); }catch(e){}
    }
  }
  if(!__waiterRingInterval){
    __waiterRingInterval = setInterval(()=>{
      const stillCalling = activeCashierCallsForMe();
      if(!stillCalling.length){
        clearInterval(__waiterRingInterval);
        __waiterRingInterval = null;
        return;
      }
      playWaiterCallRingBurst();
    }, 4500);
  }
}

// Cancel an active (not-yet-paid) order — e.g. the customer changed their mind. Any inventory
// already deducted for it (recipe-based, from sending to kitchen) is restored, since the food
// was never actually used.
async function cancelOrder(id){
  const order=state.orders.find(o=>o.id===id);
  if(!order) return;
  if(order.status==='paid'){showToast('Фармоиши пардохтшударо бекор кардан лозим нест');return;}
  if(order.status==='cancelled'){showToast('Ин фармоиш аллакай бекор шудааст');return;}
  if(order.inventoryDeductedFor && Object.keys(order.inventoryDeductedFor).length){
    const restoreItems=Object.keys(order.inventoryDeductedFor).map(menuId=>({
      menuId,qty:order.inventoryDeductedFor[menuId],
      unit:(order.items.find(it=>it.menuId===menuId)||{}).unit
    }));
    const deduction=computeInventoryDeduction(restoreItems), restoreDeltas={};
    Object.keys(deduction).forEach(invId=>restoreDeltas[invId]=deduction[invId]);
    await applyInventoryDeltas(restoreDeltas);
  }
  const label=orderLabel(order);
  // Never physically delete an accounting record.
  order.status='cancelled'; order.cancelledAt=Date.now();
  order.cancelledBy=actingUsername()||'?'; order.updatedAt=Date.now();
  order.cancelReason=order.cancelReason||'Бекор карда шуд';
  order.inventoryDeductedFor={};
  const ok=await saveOrderV2(order); if(!ok) return;
  await logActivity('Фармоишро бекор кард: '+label);
  showToast('Фармоиш бекор карда шуд');
}

  await logActivity((delta>0?'Ба анбор илова кард ':'Аз анбор кам кард ')+Math.abs(delta)+' '+(item.unit==='kg'?'кг':item.unit==='l'?'литр':'дона')+' '+item.name);
  showToast(delta>0 ? 'Илова шуд' : 'Кам карда шуд');
}
/* ---------- Recipe-based automatic inventory deduction ---------- */
function computeInventoryDeduction(orderItems){
  const deduction = {};
  orderItems.forEach(it=>{
    const menuItem = state.menu.find(m=>m.id===baseMenuId(it.menuId));
    if(!menuItem || !menuItem.recipe || !menuItem.recipe.length) return;
    const soldAmount = menuItem.unit==='kg' ? (it.qty/1000) : it.qty; // recipe is "per 1kg" or "per 1 dona"
    menuItem.recipe.forEach(r=>{
      deduction[r.invId] = (deduction[r.invId]||0) + (Number(r.qty)||0) * soldAmount;
    });
  });
  return deduction;
}
async function applyInventoryDeduction(deduction){
  const deltas = {};
  Object.keys(deduction).forEach(invId=>{ deltas[invId] = -deduction[invId]; }); // negative = subtract
  return await applyInventoryDeltas(deltas);
}
// Deducts only the DELTA vs what was already deducted for this order before (so re-sending
// an order after adding more items doesn't double-subtract the items already accounted for).
async function deductForOrderDelta(order, currentItems){
  const prevMap = order.inventoryDeductedFor || {};
  const currentMap = {};
  currentItems.forEach(it=>{ currentMap[it.menuId] = Math.max(0, Number(it.qty)||0); });

  // Keep inventory in sync with the amount actually committed to this order.
  // Positive delta = newly added quantity -> subtract from stock.
  // Negative delta = quantity removed/reduced -> return stock.
  const deductItems = [];
  const restoreItems = [];
  const allMenuIds = new Set([...Object.keys(prevMap), ...Object.keys(currentMap)]);
  allMenuIds.forEach(menuId=>{
    const prevQty = Math.max(0, Number(prevMap[menuId])||0);
    const nextQty = Math.max(0, Number(currentMap[menuId])||0);
    const delta = nextQty - prevQty;
    if(delta > 0) deductItems.push({menuId, qty:delta, unit:(currentItems.find(i=>i.menuId===menuId)||{}).unit});
    else if(delta < 0) restoreItems.push({menuId, qty:-delta, unit:(order.items||[]).find(i=>i.menuId===menuId)?.unit});
  });

  const deduction = computeInventoryDeduction(deductItems);
  if(Object.keys(deduction).length){
    const ok = await applyInventoryDeduction(deduction);
    if(ok===false) return false;
  }

  const restoration = computeInventoryDeduction(restoreItems);
  if(Object.keys(restoration).length){
    const restoreDeltas = {};
    Object.keys(restoration).forEach(invId=>{ restoreDeltas[invId] = restoration[invId]; });
    const ok = await applyInventoryDeltas(restoreDeltas);
    if(ok===false) return false;
  }

  order.inventoryDeductedFor = currentMap;
  return true;
}
function accountCommissionPct(accOrUsername){
  const acc = (typeof accOrUsername === 'string')
    ? (state.accounts||[]).find(a=>a.username===accOrUsername)

  if(acc && acc.commissionPct !== undefined && acc.commissionPct !== null && acc.commissionPct !== ''){
    const n = Number(acc.commissionPct);
    if(Number.isFinite(n)) return Math.max(0, Math.min(100, n));
  }

}

function isThisMonth(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
}
function salaryShiftResetAt(shift){
  return Number(state.settings && state.settings['salaryResetAtShift'+shift]) || 0;
}
function salaryMonthResetAt(){
  return Math.max(
    Number(state.settings && state.settings.salaryMonthResetAt) || 0,
    Number(state.settings && state.settings.salaryResetAt) || 0
  );
}
function orderCommission(order, ratePct){
  // Фоизи инфиродии корманд (пешфарз 5%) аз маблағи воқеии чек
  const pct = (ratePct !== undefined && ratePct !== null) ? Math.max(0, Number(ratePct)||0) : 5;
  return Math.max(0, Number(order && order.total)||0) * (pct / 100);
}
function staffCommissionBreakdown(username, role, scope, shift){
  const reset1=salaryShiftResetAt(1), reset2=salaryShiftResetAt(2);
  const monthReset=salaryMonthResetAt();
  const rate = accountCommissionPct(username);
  const orders = state.orders.filter(o=>{
    if(o.status!=='paid' || o.archived===true) return false;
    const ts = o.paidAt || o.updatedAt || o.createdAt;
    if(monthReset && Number(ts)<=monthReset) return false;
    if(scope==='today' && !isToday(ts)) return false;
    if(scope==='month' && !isThisMonth(ts)) return false;
    if(shift){
      if(shiftForTimestamp(ts)!==shift) return false;
      const reset=salaryShiftResetAt(shift);
      if(reset && Number(ts)<=reset) return false;
    } else if(scope==='today'){
      const sh=shiftForTimestamp(ts);
      const reset=sh===1?reset1:sh===2?reset2:0;
      if(reset && Number(ts)<=reset) return false;
    }
    return (role==='waiter' && o.createdBy===username) || (role==='cashier' && o.paidBy===username);
  });
  let total=0;
  orders.forEach(o=>{ total+=orderCommission(o, rate); });
  return {orderCount:orders.length, salesTotal:orders.reduce((n,o)=>n+(Number(o.total)||0),0), commissionRate:rate, countHigh:0, countLow:0, countNoOsh:0, oshSum:0, otherSum:total, total};
}
function staffCommission(username, role, scope){
  return staffCommissionBreakdown(username, role, scope).total;
}
function manualBonusSum(username, scope){
  const monthReset = salaryMonthResetAt();
  return (state.bonuses||[]).filter(b=>{
    if(b.username!==username) return false;
    if(monthReset && Number(b.ts)<=monthReset) return false;
    return scope==='today' ? isToday(b.ts) : isThisMonth(b.ts);
  }).reduce((s,b)=>s+(Number(b.amount)||0), 0);
}
// Automatic bonuses are evaluated live against TODAY's performance only (we don't retroactively
// re-earn past days), for waiters and cashiers.
function autoBonusToday(username, role){
  const empty = {checkCountBonus:0, revenueBonus:0, total:0, orderCount:0, commissionTotal:0};
  if(role!=='waiter' && role!=='cashier') return empty;
  const breakdown = staffCommissionBreakdown(username, role, 'today');
  let checkCountBonus = 0, revenueBonus = 0;
  const cThresh = Number(state.settings.checkCountBonusThreshold)||0;
  const cAmt = Number(state.settings.checkCountBonusAmount)||0;
  if(cThresh>0 && cAmt>0 && breakdown.orderCount > cThresh) checkCountBonus = cAmt;
  const rThresh = Number(state.settings.revenueBonusThreshold)||0;
  const rAmt = Number(state.settings.revenueBonusAmount)||0;
  if(rThresh>0 && rAmt>0 && breakdown.total > rThresh) revenueBonus = rAmt;
  return {checkCountBonus, revenueBonus, total: checkCountBonus+revenueBonus, orderCount: breakdown.orderCount, commissionTotal: breakdown.total};
}
function computeWages(acc){
  // reportClearedToday is ONLY true when admin manually pressed "Пок кардани ҳисобот"
  // (which sets salaryResetAt). Daily closure (closeDailyReport) sets reportClosedAt
  // but must NOT zero out wages — staff earned their commission on those closed orders.
  const salaryResetAt = salaryMonthResetAt();
  const salaryResetThisMonth = salaryResetAt && isThisMonth(salaryResetAt);
  const salaryResetForToday = salaryResetAt && isToday(salaryResetAt);

  if(isCommissionAccount(acc)){
    const auto = autoBonusToday(acc.username, acc.role);
    const manualToday = manualBonusSum(acc.username, 'today');
    const manualMonth = manualBonusSum(acc.username, 'month');
    const dailyCommission = staffCommission(acc.username, acc.role, 'today');
    const monthlyCommission = staffCommission(acc.username, acc.role, 'month');
    return {
      daily: dailyCommission + auto.total + manualToday,
      monthly: monthlyCommission + manualMonth,
      bonusToday: auto.total + manualToday
    };
  }

  const days = Math.max(1, Number(state.settings.workDaysPerMonth) || 30);
  const amount = Number(acc.wageAmount) || 0;
  const manualToday = salaryResetForToday ? 0 : manualBonusSum(acc.username, 'today');
  const manualMonth = salaryResetThisMonth ? 0 : manualBonusSum(acc.username, 'month');

  if(acc.wageType==='monthly'){
    return {
      daily: salaryResetForToday ? 0 : amount/days + manualToday,
      monthly: salaryResetThisMonth ? 0 : amount + manualMonth,
      bonusToday: manualToday
    };
  }

  return {
    daily: salaryResetForToday ? 0 : amount + manualToday,
    monthly: salaryResetThisMonth ? 0 : amount*days + manualMonth,
    bonusToday: manualToday
  };
}

/* ---------- Shared table grid ---------- */
function buildTableCards(){
  let cards = '';
  sortedTables().forEach((tbl,i)=>{
    const t = tbl.id;
    const order = activeOrderForTable(t);
    const occ = !!order;
    const isRealAdmin = state.currentUser && state.currentUser.role==='admin';
    const actingName = actingUsername();
    const lockedForMe = state.role==='waiter' && tbl.assignedTo && actingName && tbl.assignedTo!==actingName && !isRealAdmin;
    let dotClass = 'free', statusText = 'Озод', extra = '', arrivalBadge = '';
    if(occ){
      dotClass = 'occupied'; statusText = 'Банд';
      const _cardPhone = String(order.customerPhone || '').replace(/\D/g,'').slice(0,9);
      if(_cardPhone.length) arrivalBadge = `<span class="arrival-badge with-order">📞 ${escapeHtml(_cardPhone)}</span>`;
      extra = `<span class="total mono">${fmtMoney(order.total)}</span>`;
      const mins = Math.floor((Date.now()-order.createdAt)/60000);
      extra += `<span class="reserve-detail" style="color:${mins>=60?'var(--brick)':'#8a7c64'};">⏱ ${mins < 60 ? mins+' дақ' : Math.floor(mins/60)+' соат '+(mins%60)+' дақ'}</span>`;
      if(order.createdBy) extra += `<span class="reserve-detail">👤 ${escapeHtml(order.createdBy)}</span>`;
      extra += renderOrderKitchenCardBadge(order);
      extra += renderScheduledOshCardBadge(order);
    }
    const srcKind = occ ? orderSourceKind(order) : '';
    const srcClass = srcKind==='own' ? 'waiter-own' : (srcKind==='sched' ? 'from-scheduled' : '');
    const srcBadge = occ ? orderSourceBadge(order) : '';
    const assignBadge = tbl.assignedTo ? `<span class="reserve-detail">👤 ${escapeHtml(tbl.assignedTo)}</span>` : '';
    cards += `<button class="table-card ${lockedForMe?'locked-table':''} ${srcClass}" data-table="${t}">
      ${arrivalBadge}${srcBadge}<div class="row1"><span class="tnum">${escapeHtml(tbl.name)}</span><span class="dot ${dotClass}"></span></div>
      <span class="status">${statusText} · ${tbl.seats} ҷой</span>${extra}${assignBadge}
      ${lockedForMe ? `<span class="reserve-detail" style="color:var(--brick);">🔒 танҳо ${escapeHtml(tbl.assignedTo)}</span>` : ''}
    </button>`;
  });
  return cards;
}
function attachTableGridEvents(){
  document.querySelectorAll('.table-card').forEach(el=>{
    const id=Number(el.dataset.table);
    el.addEventListener('click',()=>openTable(id));
  });

/* ---------- Waiter view ---------- */
function renderPhoneSearchMatches(queryRaw){
  const raw = String(queryRaw||'').trim().toLowerCase();
  const digits = raw.replace(/\D/g,'');
  if(!raw) return '';
  const matches = (state.orders||[]).filter(o=>{
    if(!o || o.status==='cancelled' || o.archived) return false;
    const ph = String(o.customerPhone||'').replace(/\D/g,'');
    const nm = String(o.customerName||'').toLowerCase();
    if(digits && ph.includes(digits)) return true;
    if(raw && nm && nm.includes(raw)) return true;
    return false;
  }).sort((a,b)=>{
    if((a.status==='active') !== (b.status==='active')) return a.status==='active' ? -1 : 1;
    return (b.updatedAt||b.createdAt||0) - (a.updatedAt||a.createdAt||0);
  });
  if(!matches.length){
    return `<div class="empty-state" style="padding:14px;">Бо ин рақам ё ном ягон мизоҷ (на дар миз ва на дар брон) ёфт нашуд</div>`;
  }
  const freeTables = state.tables.filter(t=>!activeOrderForTable(t.id));
  return `<div style="margin-bottom:16px;">` + matches.map(o=>{
    const isSeated = o.table!==null && o.table!==undefined && o.type!=='scheduled';
    const tbl = isSeated ? state.tables.find(t=>t.id===o.table) : null;
    const tblName = tbl ? tbl.name : (isSeated ? ('Мизи №'+o.table) : '');
    const statusBadge = o.status==='paid'
      ? `<span style="color:var(--olive);font-weight:800;">✅ Пардохт шуда (${ tblName ? escapeHtml(tblName) : 'Собой/Брон' })</span>`
      : (isSeated
          ? `<span style="color:var(--blue);font-weight:800;">🍽 Алҳол дар ${escapeHtml(tblName)} нишастааст${o.createdBy ? ' · 👤 '+escapeHtml(o.createdBy) : ''}</span>`
          : `<span style="color:#c07f00;font-weight:800;">⏳ Дар брон (интизор — ҳанӯз ба миз нагузаштааст)</span>`);
    let actionHtml = '';
    if(o.status==='active' && isSeated){
      actionHtml = `<button type="button" class="btn-primary" style="flex:none;padding:7px 14px;font-size:12px;" data-opentable="${o.table}">🪑 Кушодани ${escapeHtml(tblName)}</button>`;
    } else if(o.status==='active' && o.type==='scheduled'){
      const tableOptions = freeTables.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
      actionHtml = freeTables.length ? `
        <select id="assignSel-${o.id}" style="padding:6px 8px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:12px;">${tableOptions}</select>
        <button type="button" class="btn-ghost" style="padding:6px 12px;font-size:12px;" data-assignsched="${o.id}">Ба миз гузоштан</button>
      ` : `<span style="font-size:12px;color:#9c8f78;">мизи озод нест</span>`;
    }
    return `
    <div class="receipt-item-row" style="flex-wrap:wrap;gap:8px;border:1.5px solid ${isSeated?'var(--blue)':'var(--line)'};background:${isSeated?'#EFF6FF':'var(--card)'};">
      <div>
        <div class="l1">📞 ${escapeHtml(o.customerPhone||'бе рақам')} ${o.customerName ? '· '+escapeHtml(o.customerName) : ''} ${o.readyTime ? '· 🕐 '+escapeHtml(o.readyTime) : ''}</div>
        <div class="l2">${statusBadge} · <b>${fmtMoney(o.total)}</b></div>
        <div class="l2">${(o.items||[]).map(i=>formatQtyLabel(i)).join(', ')}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${actionHtml}
      </div>
    </div>`;
  }).join('') + `</div>`;
}

/* ---------- Takeaway (cashier -> chef, no waiter, no table) ---------- */
function takeawaySubtotal(){
  let total = 0;
  Object.keys(state.takeawayItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item) total += lineTotal(item, state.takeawayItems[mid]);
  });
  return total;
}
function takeawayDiscountAmount(){
  // Тахфиф танҳо барои ош (категорияи "Ош" — кило ё порсия), на барои нӯшокиҳо, нон, лаълӣ ва дигар чизҳо
  const pct = takeawayOshDiscountPct();
  if(pct<=0) return 0;
  let oshTotal = 0;
  Object.keys(state.takeawayItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item && isOshDiscountItem(item)){
      oshTotal += lineTotal(item, state.takeawayItems[mid]);
    }
  });
  return roundMoney(oshTotal * (pct/100));
}
function takeawayTotal(){
  return roundMoney(Math.max(0, takeawaySubtotal() - takeawayDiscountAmount()));
}
function openTakeaway(){
  state.takeawayOpen = true;
  state.takeawayItems = {};
  state.takeawayCat = (state.menu[0] && state.menu[0].category) || null;
  render();
}
function closeTakeaway(){
  state.takeawayOpen = false;
  state.takeawayItems = {};
  render();
}
function changeTakeawayQty(mid, delta){
  const cur = state.takeawayItems[mid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = next;
  render();
}
function addTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.takeawayItems[mid] || 0;
  state.takeawayItems[mid] = cur + g;
  render();
}
function setTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = g;
  render();
}
function removeTakeawayItem(mid){
  delete state.takeawayItems[mid];
  render();
}
async function submitTakeaway(cashAmount, noncashAmount){
  let droppedAny = false;
  const items = Object.keys(state.takeawayItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    if(!m){ droppedAny = true; return null; }
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.takeawayItems[mid]};
  }).filter(Boolean);
  if(droppedAny) showToast('Баъзе маҳсулот дигар дар меню нест — аз чек хориҷ шуд');
  if(!items.length) return;
  const total = takeawayTotal();
  const todayCount = state.orders.filter(o=>o.type==='takeaway' && isToday(o.createdAt)).length;
  const cash = Math.max(0, Number(cashAmount)||0);
  const noncash = Math.max(0, Number(noncashAmount)||0);
  const order = {
    id: uid('ord'), table: null, type: 'takeaway', status: 'paid', takeawayNumber: todayCount+1,
    items, total, subtotal: takeawaySubtotal(), discount: takeawayDiscountAmount(),
    discountPct: takeawayDiscountAmount()>0 ? takeawayOshDiscountPct() : 0,
    createdAt: Date.now(), updatedAt: Date.now(),
    createdBy: null, paidAt: Date.now(), paidBy: actingUsername(),
    cashAmount: cash, noncashAmount: noncash,
    paymentMethod: cash>0 && noncash>0 ? 'mixed' : (noncash>0 ? 'noncash' : 'cash'),
    receivedAt: Date.now(),
    oshShift: activeOshShift(),
    prepared: true,
    sentToKitchen: false
  };
  state.orders.push(order);
  state.__lastKnownOrderIds = state.__lastKnownOrderIds || new Set();
  state.__lastKnownOrderIds.add(order.id);
  await deductForOrderDelta(order, items);
  await saveOrderV2(order); // save only this one order, not the whole array
  showToast('Фармоиши собой пардохт ва қабул шуд');
  closeTakeaway();
}

async function payOrderById(id,cashAmount,noncashAmount){
  const order=state.orders.find(o=>o.id===id);
  if(!order) return;
  const cash=Math.max(0,Number(cashAmount)||0);
  const noncash=Math.max(0,Number(noncashAmount)||0);
  const expected=Number(order.total||0);
  if(Math.abs(cash+noncash-expected)>0.01){
    showToast('Маблағи нақд + ғайринақд бояд ба маблағи чек баробар бошад'); return;
  }

  const result=await commitPaidOrderAtomic(id,cash,noncash);
  if(!result.ok){
    if(result.alreadyTerminal && result.order){
      state.orders=state.orders.map(o=>o.id===id?result.order:o);
      showToast(result.status==='paid'?'Ин чек аллакай баста шудааст':'Ин фармоиш аллакай бекор шудааст');
    }else{
      showToast(result.message||'Пардохт сабт нашуд');
    }
    render();
    return;
  }

  state.orders=state.orders.map(o=>o.id===id?result.order:o);
  speakPaymentSuccess(result.order);
  if(state.seenPendingIds instanceof Set) state.seenPendingIds.delete(id);
  if(state.seenCashierOrderIds instanceof Set) state.seenCashierOrderIds.delete(id);
  showToast('Пардохт шуд');
  closeOrderView();
}
async function assignScheduledToTable(orderId, tableId){

  if(!order) return;
  if(activeOrderForTable(tableId)){ showToast('Ин миз аллакай банд аст'); return; }
  if(!Array.isArray(order.initialItems) || !order.initialItems.length){
    order.initialItems = (order.items||[]).map(it=>({menuId:baseMenuId(it.menuId), name:it.name, unit:it.unit||'dona', category:it.category, qty:Number(it.qty)||0}));
  }
  order.table = tableId;
  order.type = 'dine-in';
  order.fromScheduled = true;
  order.seatedAt = Date.now();
  order.createdBy = actingUsername();
  order.sentToKitchen = false;
  order.oshDelivered = false;
  order.updatedAt = Date.now();
  // Now dining in the cafeé — the service charge (if any) applies from this point on.
  const subtotal = (order.items||[]).reduce((s,it)=>{
    const m = state.menu.find(x=>x.id===it.menuId);
    return s + (m ? lineTotal(m, it.qty) : 0);
  }, 0);
  order.subtotal = subtotal;
  order.serviceCharge = serviceChargeAmount(serviceBaseFromItems(order.items));

  await saveOrderV2(order); // save only this order
  showToast('🍽 Ба миз гузошта шуд — ош аз оши пухташуда кам шуд');
}

function captureScheduledFields(){
  const n = document.getElementById('schedNameInput'); if(n) state.scheduledName = n.value;
  const p = document.getElementById('schedPhoneInput'); if(p) state.scheduledPhone = p.value;
  const t = document.getElementById('schedTimeInput'); if(t) state.scheduledTime = t.value;
}
function attachScheduledEvents(){
  const overlay = document.getElementById('scheduledOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeScheduled(); });
  document.getElementById('closeScheduled').addEventListener('click', closeScheduled);
  const nameInp = document.getElementById('schedNameInput');
  if(nameInp){
    nameInp.addEventListener('input', ()=>{ state.scheduledName = nameInp.value; });
    nameInp.addEventListener('change', ()=>{ state.scheduledName = nameInp.value; });
  }
  const phoneInp = document.getElementById('schedPhoneInput');
  if(phoneInp){
    phoneInp.addEventListener('input', ()=>{ state.scheduledPhone = phoneInp.value; });
    phoneInp.addEventListener('change', ()=>{ state.scheduledPhone = phoneInp.value; });
  }
  const timeInp = document.getElementById('schedTimeInput');
  if(timeInp){
    timeInp.addEventListener('input', ()=>{ state.scheduledTime = timeInp.value; });
    timeInp.addEventListener('change', ()=>{ state.scheduledTime = timeInp.value; });
  }
  document.querySelectorAll('[data-scat]').forEach(el=>{
    el.addEventListener('click', ()=>{ captureScheduledFields(); state.scheduledCat = el.dataset.scat; render(); });
  });
  document.querySelectorAll('[data-sadd]').forEach(el=>{
    el.addEventListener('click', ()=>{ captureScheduledFields(); changeScheduledQty(el.dataset.sadd, 1); });
  });
  document.querySelectorAll('[data-sinc]').forEach(el=>{
    el.addEventListener('click', ()=>{ captureScheduledFields(); changeScheduledQty(el.dataset.sinc, 1); });
  });
  document.querySelectorAll('[data-sdec]').forEach(el=>{
    el.addEventListener('click', ()=>{ captureScheduledFields(); changeScheduledQty(el.dataset.sdec, -1); });
  });
  document.querySelectorAll('[data-saddgrams]').forEach(el=>{
    el.addEventListener('click', ()=>{
      captureScheduledFields();
      const input = document.getElementById('skgin-'+el.dataset.saddgrams);
      addScheduledGrams(el.dataset.saddgrams, input ? input.value : 0);
    });
  });
  document.querySelectorAll('[data-seditgrams]').forEach(el=>{
    el.addEventListener('change', ()=>{ captureScheduledFields(); setScheduledGrams(el.dataset.seditgrams, el.value); });
  });
  document.querySelectorAll('[data-sremoveitem]').forEach(el=>{
    el.addEventListener('click', ()=>{ captureScheduledFields(); removeScheduledItem(el.dataset.sremoveitem); });
  });
  document.querySelectorAll('[data-schedshift]').forEach(el=>{
    el.addEventListener('click', ()=>{
      captureScheduledFields();
      state.scheduledOshShift = Number(el.dataset.schedshift)||1;
      render();
    });
  });
  const submitBtn = document.getElementById('submitScheduledBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=>{
    const name = document.getElementById('schedNameInput').value.trim();
    const phone = document.getElementById('schedPhoneInput').value.trim();
    const timeEl = document.getElementById('schedTimeInput');
    const time = timeEl ? timeEl.value : '';
    submitScheduled(name, phone, time, state.scheduledDeliveryType, state.scheduledOshShift);
  });
}

  const cancelOrderBtn = document.getElementById('cancelOrderBtn');
  if(cancelOrderBtn) cancelOrderBtn.addEventListener('click', ()=>{
    state.confirmCancelOrderId = state.viewingOrderId; render();

/* ---------- Chef & Oshbar view ---------- */
function renderOrderKitchenCardBadge(order){
  if(!order || order.type==='takeaway' || order.type==='scheduled') return '';
  const hasOshItem = (order.items||[]).some(it=>isOshDiscountItem(it));
  if(!hasOshItem) return '';
  if(!order.sentToKitchen){
    return `<span class="reserve-detail" style="color:#b45309;font-weight:700;">⏸ Ба ошпаз равон нашудааст</span>`;
  }
  if(order.oshDelivered){
    return `<span class="reserve-detail" style="color:var(--olive);font-weight:700;">✅ Ош бурда шуд</span>`;
  }
  if(order.prepared){
    return `<span class="reserve-detail" style="color:var(--blue);font-weight:700;">🍲 Ош кашида шуд (Ошбар)</span>`;
  }
  return `<span class="reserve-detail" style="color:var(--brick);font-weight:700;">👨‍🍳 Дар навбати ошпаз</span>`;
}
async function toggleOrderPrepared(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.prepared = !order.prepared;
  order.preparedAt = order.prepared ? Date.now() : null;
  order.updatedAt = Date.now();
  await saveOrderV2(order);
  showToast(order.prepared ? '🍲 Ош кашида шуд (барои Ошбар омода аст)' : '↩ Бозгашт ба ҳолати ошпаз');
}
async function markOshDelivered(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.oshDelivered = true;
  order.oshDeliveredAt = Date.now();
  order.oshDeliveredBy = actingUsername() || (state.role==='oshbar'?'Ошбар':'Ошпаз');
  order.prepared = true;
  (order.items||[]).forEach(it=>{
    if(isOshDiscountItem(it)) it.servedQty = it.qty;
  });
  order.updatedAt = Date.now();
  await saveOrderV2(order);
  showToast('✅ Ош бурда шуд ва аз навбат гирифта шуд');
}
async function undoOshDelivered(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.oshDelivered = false;
  order.prepared = false;
  order.updatedAt = Date.now();
  await saveOrderV2(order);
  showToast('↩ Фармоиш дубора ба навбат баргардонида шуд');
}
async function markItemServed(orderId, menuId, amount){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  const amt = Math.max(0, Number(amount)||0);
  if(amt<=0) return;
  const served = Math.min(item.qty, (item.servedQty||0) + amt);
  item.servedQty = served;
  order.updatedAt = Date.now();
  await saveOrderV2(order); // save only this order
  showToast('Кашида шуд');
}
async function undoItemServed(orderId, menuId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  item.servedQty = 0;
  order.updatedAt = Date.now();
  await saveOrderV2(order); // save only this order
}
function renderChef(){
  const isOshbarView = state.role === 'oshbar';
  const todays = state.orders.filter(o=>isToday(o.createdAt));
  let porsiyaTotal = 0;
  todays.forEach(o=>{
    o.items.forEach(it=>{
      if(isOshDiscountItem(it) && it.unit!=='kg') porsiyaTotal += it.qty;
    });
  });
  const kgTotal = oshOrderedKgToday();
  const hasOsh = (o)=> (o.items||[]).some(it=>isOshDiscountItem(it));
  const chefClearedAt = Number(state.settings.chefQueueClearedAt) || 0;
  const queueTimestamp = (o)=> Number(o.sentToKitchenAt || o.seatedAt || o.createdAt) || 0;

  // Дар навбат танҳо фармоишҳое нишон дода мешаванд, ки тугмаи «🍚 Ба ошпаз фиристодан» пахш шудааст (o.sentToKitchen===true)
  // ва ҳанӯз тугмаи «✅ Ош бурда шуд» пахш нашудааст (!o.oshDelivered).
  const queueOrders = state.orders.filter(o=>{
    if((o.sentToKitchenAt || o.updatedAt || o.createdAt) <= chefClearedAt) return false;
    if(o.status!=='active') return false;
    if(o.type==='takeaway' || o.type==='scheduled') return false;
    if(!hasOsh(o)) return false;
    if(!o.sentToKitchen) return false;
    if(o.oshDelivered) return false;
    return true;
  }).sort((a,b)=> queueTimestamp(a) - queueTimestamp(b));

  const deliveredOrders = state.orders.filter(o=>{
    if((o.sentToKitchenAt || o.updatedAt || o.createdAt) <= chefClearedAt) return false;
    if(o.status!=='active') return false;
    if(o.type==='takeaway' || o.type==='scheduled') return false;
    if(!hasOsh(o)) return false;
    if(!o.sentToKitchen) return false;
    return !!o.oshDelivered;
  }).sort((a,b)=>(b.oshDeliveredAt||b.updatedAt||0)-(a.oshDeliveredAt||a.updatedAt||0));

  const hasStock = state.oshStock && state.oshStock.date === todayKey();
  const s1 = oshShiftStats(1), s2 = oshShiftStats(2);
  const cookedKg = hasStock ? (s1.cooked + s2.cooked) : null;
  const remainingKg = hasStock ? (s1.remaining + s2.remaining) : null;
  const remainingCard = hasStock
    ? `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="color:${remainingKg<0?'var(--brick)':'var(--olive)'};">${remainingKg.toFixed(2)} кг</div></div>`
    : `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="font-size:13px;color:#9c8f78;">админ ҳанӯз сабт накардааст</div></div>`;

  const readyForOshbarCount = queueOrders.filter(o=>o.prepared).length;

  const renderQueueCard = (o, idx) => {
    const queueNum = idx + 1;
    const title = orderLabel(o);
    const qTs = queueTimestamp(o);
    const waitMin = Math.max(0, Math.floor((Date.now() - qTs) / 60000));
    const waitText = waitMin === 0
      ? 'Ҳозир омад (< 1 дақ)'
      : (waitMin < 60 ? (waitMin + ' дақиқа дар навбат') : (Math.floor(waitMin/60)+' соат '+(waitMin%60)+' дақ дар навбат'));
    const isDelayed = waitMin >= (state.settings.delayWarnMinutes||15);
    const isPrepared = !!o.prepared;
    const oshItems = (o.items||[]).filter(it=>isOshDiscountItem(it));
    const itemsHtml = oshItems.length ? oshItems.map(it=>{
      const lineClass = 'chef-osh-line';
      const served = it.servedQty||0;
      const remaining = Math.max(0, it.qty - served);
      const servedLabel = it.unit==='kg'
        ? formatQtyLabel({name:'', unit:'kg', qty:served}).trim()
        : served+'×';
      const totalLabel = formatQtyLabel(it);
      const isExtraPart = isTaKey(it.menuId) || it.isExtra || it.takeawayOsh;
      const extraBadge = isExtraPart ? ` <span style="font-size:11px;color:var(--brick);font-weight:800;">(🥡 иловагӣ / собой)</span>` : '';
      const progressLine = (!isOshbarView) ? `<div style="font-size:10px;color:${remaining<=0?'var(--olive)':'#9c8f78'};margin:1px 0 4px;">${remaining<=0?'✅ пурра кашида шуд':`${servedLabel||'0'} аз ${totalLabel} кашида шуд · ${it.unit==='kg'?formatQtyLabel({name:'',unit:'kg',qty:remaining}).trim():remaining+'×'} боқӣ`}</div>` : '';
      const controlHtml = (!isOshbarView && !isPrepared && remaining>0) ? (
        it.unit==='kg' ? `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          <input type="number" class="kg-qty-input" id="serve-${o.id}-${it.menuId}" value="${Math.min(remaining,500)}" min="10" max="${remaining}" step="50" style="width:64px;padding:5px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:12px;">
          <span style="font-size:11px;color:#6b5f4d;">г</span>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveitem="${o.id}|${it.menuId}">Кашидан</button>
        </div>` : `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|1">+1 кашидан</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|${remaining}">Ҳама (${remaining}) кашидан</button>
        </div>`
      ) : '';
      return `<div class="${lineClass}" style="font-size:15px;">🍚 ${formatQtyLabel(it)}${extraBadge}</div>${progressLine}${controlHtml}`;
    }).join('') : `<div class="receipt-empty">холӣ</div>`;

    const preparedBanner = isPrepared
      ? `<div style="background:#ECFDF5;border:1.5px solid #10B981;color:#065F46;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:800;margin:8px 0;">🍲 Ошпаз ошро кашид — омода барои бурдан ба миз!</div>`

    return `

  const renderDeliveredCard = (o) => {
    const title = orderLabel(o);

    <div class="receipt-item-row" style="opacity:.75;flex-wrap:wrap;gap:8px;">
      <div>
        <div class="l1">✅ ${escapeHtml(title)} ${o.createdBy ? `· <span style="font-size:12px;color:#64748B;">👤 ${escapeHtml(o.createdBy)}</span>` : ''}</div>
        <div class="l2">${oshItems.map(i=>formatQtyLabel(i)).join(', ')} ${o.oshDeliveredAt ? `· 🕒 Бурда шуд: ${fmtTime(o.oshDeliveredAt)}` : ''} ${o.oshDeliveredBy ? `(${escapeHtml(o.oshDeliveredBy)})` : ''}</div>

    state.seenPendingIds = new Set(currentIds);
  } else {
    const newArrivals = queueOrders.filter(o=>!state.seenPendingIds.has(o.id));
    if(newArrivals.length){

    }
    state.seenPendingIds = new Set(currentIds);

  const adminClearControl = isRealAdmin() ? (

        <button class="btn-pay" style="padding:8px 16px;margin-right:8px;" id="confirmClearChefQueueBtn">Ҳа, пок кун</button>

      </div>
    </div>` : `<button class="btn-ghost" style="margin-bottom:14px;color:var(--brick);border-color:var(--brick);" id="clearChefQueueBtn">🧹 Пок кардани навбати ошпаз</button>`

    <div class="stat-row">

    <div class="section-title">🔢 Навбати ош кашидан ва бурдан (${queueOrders.length})</div>
    <p style="font-size:12px;color:#64748B;margin:-10px 0 14px;">Фармоишҳо аз рӯи вақти пахши тугмаи «🍚 Ба ошпаз фиристодан» бо тартиби навбат (№1, №2, ...) ҷойгир шудаанд. Вақте ош ба миз бурда шуд, тугмаи <b>«✅ Ош бурда шуд»</b>-ро пахш кунед, то аз навбат гирифта шавад.</p>
    ${queueOrders.length ? queueOrders.map((o,idx)=>renderQueueCard(o,idx)).join('') : '<div class="empty-state">Ҳоло дар навбат ягон фармоиши ош нест</div>'}
    ${deliveredOrders.length ? `<div class="section-title" style="margin-top:24px;">✅ Ошҳои бурдашуда (дар мизҳои фаъол: ${deliveredOrders.length})</div>${deliveredOrders.map(renderDeliveredCard).join('')}` : ''}
  </div>`;
}
function attachChefEvents(){
  const clearBtn = document.getElementById('clearChefQueueBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.confirmClearChefQueue=true; render(); });
  const cancelClearBtn = document.getElementById('cancelClearChefQueueBtn');
  if(cancelClearBtn) cancelClearBtn.addEventListener('click', ()=>{ state.confirmClearChefQueue=false; render(); });
  const confirmClearBtn = document.getElementById('confirmClearChefQueueBtn');
  if(confirmClearBtn) confirmClearBtn.addEventListener('click', async ()=>{
    state.confirmClearChefQueue=false;
    await clearChefQueue();
    render();
  });
  document.querySelectorAll('[data-toggleprep]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await toggleOrderPrepared(el.dataset.toggleprep);
      render();
    });
  });
  document.querySelectorAll('[data-deliverosh]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await markOshDelivered(el.dataset.deliverosh);
      render();
    });
  });
  document.querySelectorAll('[data-undodeliverosh]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      await undoOshDelivered(el.dataset.undodeliverosh);
      render();
    });
  });
  document.querySelectorAll('[data-serveitem]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [orderId, menuId] = el.dataset.serveitem.split('|');
      const input = document.getElementById('serve-'+orderId+'-'+menuId);
      await markItemServed(orderId, menuId, input ? input.value : 0);
      render();
    });
  });
  document.querySelectorAll('[data-serveqty]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const [orderId, menuId, amount] = el.dataset.serveqty.split('|');
      await markItemServed(orderId, menuId, amount);
      render();
    });
  });
}

/* ---------- Ticket overlay ---------- */
function renderTicketOverlay(){
  const mode = state.ticketMode || 'edit';

    const prevItem = currentOrder ? currentOrder.items.find(p=>p.menuId===mid) : null;

    const saveEditBtn = dirty && draftKeys.length ? `<div style="padding:0 20px 8px;"><button type="button" class="btn-ghost" style="width:100%;" id="cashierSaveEditsBtn">💾 Сабти тағйироти чек</button></div>` : '';

        const ackAt = Number(currentOrder.cashierCallAckAt)||0;

         <input id="arrivalPhone" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" value="${escapeHtml(state.customerPhone||'')}" placeholder="918765432" style="display:block;width:180px;margin-top:5px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--white);font-family:inherit;font-size:14px;letter-spacing:1px;">
       </div>` : ''}

        <div class="receipt-title">Чек — Миз: ${_activeTblName}</div>

      </div>

    </div>

}
function attachTicketEvents(){
  const mode = state.ticketMode || 'edit';
  const overlay = document.getElementById('ticketOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeTicket(); });
  document.getElementById('closeTicket').addEventListener('click', closeTicket);
  const callWaiterBtn = document.getElementById('callWaiterToCashierBtn');
  if(callWaiterBtn){
    callWaiterBtn.addEventListener('click', async ()=>{
      const o = activeOrderForTable(state.activeTable);
      if(o) await callWaiterToCashier(o.id);
    });
  }
  document.querySelectorAll('#ticketOverlay [data-ackcashiercall]').forEach(el=>{
    el.addEventListener('click', ()=> acknowledgeCashierCall(el.dataset.ackcashiercall));
  });
  const moveOrderTableSelect = document.getElementById('moveOrderTableSelect');
  const moveOrderWaiterSelect = document.getElementById('moveOrderWaiterSelect');
  if(moveOrderTableSelect && moveOrderWaiterSelect){
    moveOrderTableSelect.addEventListener('change', ()=>{
      const opt = moveOrderTableSelect.options[moveOrderTableSelect.selectedIndex];
      const assigned = opt ? opt.getAttribute('data-assigned') : '';
      if(assigned){
        moveOrderWaiterSelect.value = assigned;
      }
    });
  }
  const moveOrderTableBtn = document.getElementById('moveOrderTableBtn');
  if(moveOrderTableBtn){
    moveOrderTableBtn.addEventListener('click', async ()=>{
      const o = activeOrderForTable(state.activeTable);
      const sel = document.getElementById('moveOrderTableSelect');
      const wSel = document.getElementById('moveOrderWaiterSelect');
      if(o && sel && sel.value){
        await moveOrderToTable(o.id, Number(sel.value), wSel ? wSel.value : '');
      }
    });
  }
  const cancelOrderBtn = document.getElementById('cancelOrderBtn');
  if(cancelOrderBtn) cancelOrderBtn.addEventListener('click', ()=>{
    const o = activeOrderForTable(state.activeTable);
    state.confirmCancelOrderId = o ? o.id : null;
    render();
  });
  const confirmCancelOrderBtn = document.getElementById('confirmCancelOrderBtn');
  if(confirmCancelOrderBtn) confirmCancelOrderBtn.addEventListener('click', async ()=>{
    const id = state.confirmCancelOrderId;
    state.confirmCancelOrderId = null;
    await cancelOrder(id);
    closeTicket();
  });
  const cancelCancelOrderBtn = document.getElementById('cancelCancelOrderBtn');
  if(cancelCancelOrderBtn) cancelCancelOrderBtn.addEventListener('click', ()=>{
    state.confirmCancelOrderId = null; render();
  });
  const cashierEditing = mode==='pay' && state.role==='cashier';
  if(mode==='edit' || cashierEditing){
    const arrivalPhone = document.getElementById('arrivalPhone');
    if(arrivalPhone){
      arrivalPhone.addEventListener('input', e=>setCustomerPhone(e.target.value));
      arrivalPhone.addEventListener('keydown', e=>{
        if(e.ctrlKey || e.metaKey || e.altKey) return;
        if(['Backspace','Delete','ArrowLeft','ArrowRight','Tab','Home','End'].includes(e.key)) return;
        if(!/^[0-9]$/.test(e.key)) e.preventDefault();
      });
    }
    document.querySelectorAll('#ticketOverlay [data-ticketsec]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.ticketSection = el.dataset.ticketsec; render(); });
    });
    document.querySelectorAll('#ticketOverlay [data-cat]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.activeCat = el.dataset.cat; render(); });
    });
    document.querySelectorAll('[data-add]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.add, 1));
    });
    document.querySelectorAll('[data-inc]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.inc, 1));
    });
    document.querySelectorAll('[data-dec]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.dec, -1));
    });
    document.querySelectorAll('[data-addgrams]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const input = document.getElementById('kgin-'+el.dataset.addgrams);
        addGrams(el.dataset.addgrams, input ? input.value : 0);
      });
    });
    document.querySelectorAll('[data-editgrams]').forEach(el=>{
      el.addEventListener('change', ()=>{ setGrams(el.dataset.editgrams, el.value); });
    });
    document.querySelectorAll('[data-removeitem]').forEach(el=>{
      el.addEventListener('click', ()=> removeDraftItem(el.dataset.removeitem));
    });
    // Қисми иловагӣ (вақти баромадан / собой — бе ҳаққи хизматрасонӣ)
    document.querySelectorAll('[data-addta]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.addta+TA_SUFFIX, 1));
    });
    document.querySelectorAll('[data-addgramsta]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const input = document.getElementById('kgin-'+el.dataset.addgramsta);
        addGrams(el.dataset.addgramsta+TA_SUFFIX, input ? input.value : 0);
      });
    });
    document.querySelectorAll('[data-toextra]').forEach(el=>{
      el.addEventListener('click', ()=> moveDraftItemSection(el.dataset.toextra, true));
    });
    document.querySelectorAll('[data-tomain]').forEach(el=>{
      el.addEventListener('click', ()=> moveDraftItemSection(el.dataset.tomain, false));
    });
    const cashierSaveEditsBtn = document.getElementById('cashierSaveEditsBtn');
    if(cashierSaveEditsBtn) cashierSaveEditsBtn.addEventListener('click', async e=>{
      e.preventDefault();
      e.stopPropagation();
      const o = activeOrderForTable(state.activeTable);
      const ok = await saveTicket(!!(o && o.sentToKitchen), {keepOpen:true, cashierEdit:true});
      if(ok) render();
    });
    const saveBtn = document.getElementById('saveTicketBtn');
    if(saveBtn) saveBtn.addEventListener('click', async e=>{
      e.preventDefault();
      e.stopPropagation();
      const existingOrd = activeOrderForTable(state.activeTable);
      await saveTicket(false, (existingOrd && state.role!=='waiter') ? {cashierEdit:true} : {});
    });
    const sendToKitchenBtn = document.getElementById('sendToKitchenBtn');
    if(sendToKitchenBtn) sendToKitchenBtn.addEventListener('click', async e=>{
      e.preventDefault();
      e.stopPropagation();
      const existingOrd = activeOrderForTable(state.activeTable);
      await saveTicket(true, (existingOrd && state.role!=='waiter') ? {cashierEdit:true} : {});
    });
  }
  if(mode==='pay'){
    attachSplitPaymentEvents('paytk', draftTotalWithService(), (cash, noncash)=> payTicket(cash, noncash));
  }
}

function allKnownClients(){
  const list = [];
  state.orders.forEach(o=>{
    if(!o || o.status==='cancelled' || o.archived) return;
    const hasClientInfo = o.type==='scheduled' || o.fromScheduled || !!(o.customerPhone && String(o.customerPhone).trim()) || !!(o.customerName && String(o.customerName).trim());
    if(!hasClientInfo) return;
    const isSeated = o.table!==null && o.table!==undefined && o.type!=='scheduled';
    const tbl = isSeated ? state.tables.find(t=>t.id===o.table) : null;
    const tblName = tbl ? tbl.name : (isSeated ? ('Мизи №'+o.table) : '');
    const srcLabel = (o.type==='scheduled' || o.fromScheduled)
      ? ('Фармоиши вақтдор' + (tblName ? ' · 🪑 '+tblName : ''))
      : (tblName ? ('Дар миз · 🪑 '+tblName) : 'Фармоиш');
    const stLabel = o.status==='paid'
      ? ('✅ пардохт шуд' + (tblName ? ' ('+tblName+')' : ''))
      : (isSeated
          ? ('🍽 дар '+tblName+' нишастааст' + (o.createdBy ? ' · 👤 '+o.createdBy : ''))
          : '⏳ дар брон (интизор)');
    list.push({
      key: 'sched:'+o.id, delType: 'scheduled', delId: o.id,
      orderId: o.id, tableId: isSeated && o.status==='active' ? o.table : null,
      name: o.customerName||'', phone: o.customerPhone||'', ts: o.createdAt,
      source: srcLabel, when: o.readyTime||'', items: o.items, total: o.total,
      statusLabel: stLabel
    });
  });
  return list.sort((a,b)=>{
    if((!!a.tableId) !== (!!b.tableId)) return a.tableId ? -1 : 1;
    return (b.ts||0)-(a.ts||0);
  });
}
async function deleteClientRecord(delType, delId){
  if(delType==='scheduled'){
    const o = state.orders.find(x=>x.id===delId);
    if(o){
      if(o.status==='paid'){
        o.archived = true;
        o.archivedAt = Date.now();
        o.archivedBy = actingUsername()||'?';
      }else{
        o.status = 'cancelled';
        o.cancelledAt = Date.now();
        o.cancelledBy = actingUsername()||'?';
        o.cancelReason = 'Сабти мизоҷ аз рӯйхат пинҳон карда шуд';
      }
      o.updatedAt = Date.now();
      const saved = await saveOrderV2(o);
      if(!saved) return;
    }
    await logActivity('Сабти мизоҷро архив кард: '+(o?o.customerName:delId));
  }
  showToast('Сабт нест шуд');
}

function attachOshShiftsEvents(){
  const saveBtn = document.getElementById('saveOshSecStockBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    const lunchKg = Math.max(0, Number(document.getElementById('oshSecLunchInput')?.value) || 0);
    const eveningKg = Math.max(0, Number(document.getElementById('oshSecEveningInput')?.value) || 0);
    const actShift = activeOshShift();
    state.oshStock = {date: todayKey(), kg: lunchKg + eveningKg, lunchKg, eveningKg, activeShift: actShift};
    await saveOshStock(state.oshStock);
    showToast('✅ Миқдори оши Басти 1 ва Басти 2 сабт шуд');
    render();
  });
  const openSchedBtn = document.getElementById('openSchedFromOshBtn');
  if(openSchedBtn) openSchedBtn.addEventListener('click', openScheduled);
  document.querySelectorAll('[data-setactiveoshshift]').forEach(el=>{
    el.addEventListener('click', ()=>{
      setActiveOshShift(Number(el.dataset.setactiveoshshift));
    });
  });
  document.querySelectorAll('[data-orderoshshift]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [ordId, sh] = el.dataset.orderoshshift.split('|');
      setOrderOshShift(ordId, Number(sh));
    });
  });
}

async function clearAllReportHistory(){
  const now = Date.now();
  // Keep ONLY currently active table orders and active scheduled orders; delete all paid/takeaway/cancelled orders
  const ordersToDelete = (state.orders||[]).filter(o => o.status !== 'active' || o.type === 'takeaway');
  const localIdsToDelete = new Set(ordersToDelete.map(o => String(o.id)));

  // 1. Update local state and re-render IMMEDIATELY so the button responds in < 10ms!
  state.orders = (state.orders||[]).filter(o => !localIdsToDelete.has(String(o.id)));
  state.__lastKnownOrderIds = new Set(state.orders.map(o => o.id));
  state.settings = {...state.settings, reportClearedAt:now, reportClosedAt:now, salaryResetAt:now, oshTotalResetAt:now};
  state.bonuses = [];
  state.expenses = [];
  state.dailyClosures = (state.dailyClosures||[]).filter(x=>x.kind==='wagePayment');
  state.reportArchive = {days:[],months:{}};
  state.dailyReportRows = [];
  state.confirmClearReport = false;
  render();
  showToast('Ҳисобот ва собой пурра пок шуд');

  // 2. Delete all non-active / takeaway orders from Firestore in fast batches + save reset state in parallel
  const batchDeleteOrdersFromDb = async ()=>{
    if(!db) return;
    try{
      const snap = await ordersCollectionRef().get();
      const refsToDelete = [];
      snap.forEach(d=>{
        const data = d.data() || {};
        if(data.status !== 'active' || data.type === 'takeaway' || localIdsToDelete.has(String(d.id))){
          refsToDelete.push(d.ref);
        }
      });
      for(let i=0; i<refsToDelete.length; i+=400){
        const batch = db.batch();
        refsToDelete.slice(i, i+400).forEach(ref => batch.delete(ref));
        await batch.commit();
      }
    }catch(e){
      console.error('batchDeleteOrdersFromDb failed', e);
    }
  };

  await Promise.all([
    saveSettings(state.settings),
    batchDeleteOrdersFromDb(),
    saveBonuses([]),
    saveExpenses([]),
    saveDailyClosures(state.dailyClosures),
    saveReportArchive()
  ]);
  logActivity('Ҳисобот, собой ва чекҳои пардохтшуда аз база пурра пок карда шуд').catch(()=>{});
}

async function closeDailyReport(){
  await ensurePaidOrdersLoaded('report');
  // Refresh active orders from Firebase before closing so a stale browser state
  // cannot block the close operation or hide an actually active table.
  let active = state.orders.filter(o=>o.status==='active');
  try{
    const snap = await ordersCollectionRef().where('status','==','active').get();
    const remoteActive=[];
    snap.forEach(d=>{const x=d.data()||{}; remoteActive.push({...x,id:x.id||d.id});});
    mergeActiveOrdersIntoState(remoteActive);
    active = remoteActive;
  }catch(e){
    console.error('closeDailyReport active-order check failed',e);
    showToast('Хатогӣ: фармоишҳои фаъолро санҷидан натавонист');
    return;
  }

  const paidToday = state.orders.filter(o=>o.status==='paid' && o.paidAt && o.archived!==true && inCurrentReportPeriod(o.paidAt));

  const blocking = active.filter(o=>o.type!=='scheduled');
  if(blocking.length){
    showToast('Аввал ҳамаи мизҳои фаъолро пӯшед: '+blocking.length);
    return;
  }

  if(!paidToday.length){
    showToast('Барои пӯшидан чекҳои пардохтшудаи ҳисоботи ҷорӣ нест');
    return;
  }

  const revenue=paidToday.reduce((s,o)=>s+(Number(o.total)||0),0);
  const cashToday=paidToday.reduce((s,o)=>s+paymentSplit(o).cash,0);
  const noncashToday=paidToday.reduce((s,o)=>s+paymentSplit(o).noncash,0);

  const commissionAccounts=state.accounts.filter(a=>a.wageType==='commission'&&(a.role==='waiter'||a.role==='cashier'));
  const staffSummary=commissionAccounts.map(acc=>{
    const b=staffCommissionBreakdown(acc.username,acc.role,'today');
    return {username:acc.username,role:acc.role,total:b.total,checks:b.orderCount};
  }).filter(s=>s.checks>0);

  const lowStock=state.inventory.filter(i=>i.minThreshold>0&&i.qty<=i.minThreshold).map(i=>i.name);
  const closedAt=Date.now();

  const closure={
    id:uid('close'),
    date:todayKey(),
    closedAt,
    closedBy:actingUsername(),
    revenue,
    cashToday,
    noncashToday,
    checkCount:paidToday.length,
    activeCount:active.length,
    staffSummary,
    lowStock,
    orders:paidToday.map(o=>JSON.parse(JSON.stringify(o)))
  };

  // The historical archive is stored separately and is NOT loaded during normal startup.
  await ensureReportArchiveLoaded();
  state.reportArchive=state.reportArchive||{days:[],months:{}};
  const summary=makeDailySummary(todayKey(),paidToday,state.expenses||[],closedAt,actingUsername());
  const dayWages=wageReportForOrders(paidToday);
  summary.wages=dayWages.entries;
  summary.wageTotal=dayWages.total;
  summary.paidWages=wagePaymentsForDate(todayKey()).map(p=>({username:p.username,amount:p.amount,ts:p.ts}));
  summary.paidWageTotal=summary.paidWages.reduce((n,p)=>n+(Number(p.amount)||0),0);
  summary.products=shiftProductSummary(paidToday);
  state.reportArchive.days=(state.reportArchive.days||[]).filter(x=>x.date!==summary.date);
  state.reportArchive.days.unshift(summary);
  upsertMonthlySummary(state.reportArchive,summary);
  if(state.reportArchive.days.length>366) state.reportArchive.days=state.reportArchive.days.slice(0,366);
  if(!await saveReportArchive()){ showToast('Хатогӣ: архиви ҳисобот сабт нашуд'); return; }

  // Keep the daily-closure record in Firebase as well. This is the separate
  // dailyClosures store used by the reports/history screen.
  const nextDailyClosures=[summary,...(state.dailyClosures||[])];
  if(!await saveDailyClosures(nextDailyClosures)){
    showToast('Хатогӣ: сабти пӯшидани рӯз дар Firebase нашуд');
    return;
  }
  state.dailyClosures=nextDailyClosures;

  // Mark the exact paid orders as archived instead of deleting them.
  // This survives realtime sync because the accounting record itself carries the flag.
  const ids=new Set(paidToday.map(o=>o.id));
  state.orders=state.orders.map(o=>ids.has(o.id)
    ? {...o, archived:true, archivedAt:closedAt, archivedBy:actingUsername(), updatedAt:closedAt}
    : o);
  // Save each archived order individually to avoid rewriting the entire orders collection
  const toArchive=state.orders.filter(o=>ids.has(o.id));
  let allSaved=true;
  for(const o of toArchive){ if(!await saveOrderV2(o)) allSaved=false; }
  const saved=allSaved;
  if(!saved) return;

  // Keep a simple settings marker for informational purposes, but the report itself
  // relies on order.archived so stale settings cannot make archived orders reappear.
  state.settings={...state.settings, reportClosedAt:closedAt};
  await saveSettings(state.settings);

  await logActivity('Рӯзро пӯшид — '+paidToday.length+' чек ба архив гузашт');
  state.showCloseDayConfirm=false;
  state.confirmClearReport=false;
  showToast('Рӯз пӯшида шуд — ҳисобот архив шуд');
}

function technicalDailyWageTotal(){
  return (state.technicalStaff||[]).filter(x=>x.active!==false).reduce((s,x)=>s+(Number(x.dailyWage)||0),0);

function wageReportForOrders(orders, shift){
  const mReset=salaryMonthResetAt();
  const shReset=shift?salaryShiftResetAt(shift):0;
  const effReset=Math.max(mReset, shReset);
  const list=(orders||[]).filter(o=>{
    const ts=Number(o.paidAt||o.updatedAt||o.createdAt)||0;
    return !effReset || ts>effReset;
  });
  const resetToday = effReset && isToday(effReset);
  const entries=(state.accounts||[]).filter(acc=>acc.role==='waiter'||acc.role==='cashier').map(acc=>{
    const mine=list.filter(o=>o.status==='paid' && (acc.role==='waiter'?o.createdBy===acc.username:o.paidBy===acc.username));
    const useComm = isCommissionAccount(acc);
    const rate = accountCommissionPct(acc);
    const commission=useComm?mine.reduce((v,o)=>v+orderCommission(o, rate),0):0;
    const days=Math.max(1,Number(state.settings.workDaysPerMonth)||30);
    const fixedBase=useComm?0:acc.wageType==='monthly'?(Number(acc.wageAmount)||0)/days:(Number(acc.wageAmount)||0);
    const fixed=resetToday?0:(shift?fixedBase/2:fixedBase);
    return {username:acc.username,role:acc.role,commissionRate:rate,amount:commission+fixed};
  });
  const techBase=technicalDailyWageTotal();
  const tech=resetToday?0:(shift?techBase/2:techBase);
  return {entries,total:entries.reduce((n,x)=>n+x.amount,0)+tech, technical:tech};
}
function dailySalaryTotalFromAllPaid(){
  const mReset=salaryMonthResetAt();
  const paidToday=(state.orders||[]).filter(o=>o.status==='paid'&&o.paidAt&&isToday(o.paidAt)&&(!mReset||Number(o.paidAt)>mReset));
  return wageReportForOrders(paidToday).total;
}

async function ensureDailySalarySnapshot(){
  const date=todayKey();
  const total=dailySalaryTotalFromAllPaid();
  const waiterCashier=wageReportForOrders((state.orders||[]).filter(o=>o.status==='paid'&&o.paidAt&&isToday(o.paidAt))).total-technicalDailyWageTotal();
  const technical=technicalDailyWageTotal();
  const old=(state.dailySalaryLedger||[]).find(x=>x.date===date);
  if(old && Number(old.total)===Number(total) && Number(old.waiterCashier)===Number(waiterCashier) && Number(old.technical)===Number(technical)) return total;
  const next=[...(state.dailySalaryLedger||[])].filter(x=>x.date!==date);
  next.unshift({date,total,waiterCashier,technical,updatedAt:Date.now()});
  next.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(next.length>366) next.length=366;
  state.dailySalaryLedger=next;
  await saveDailySalaryLedger(next);
  return total;
}

function shiftProductSummary(orders){
  const rows={};
  (orders||[]).forEach(o=>(o.items||[]).forEach(it=>{
    const dispName=reportItemDisplayName(o, it);
    const key=dispName+'|'+String(it.unit||'dona');
    if(!rows[key])rows[key]={name:dispName,unit:it.unit||'dona',qty:0,revenue:0,osh:isOshDiscountItem(it)};
    rows[key].qty+=Number(it.qty)||0;
    rows[key].revenue+=lineTotal({unit:it.unit,price:it.price},it.qty);
  }));
  return Object.values(rows).sort((a,b)=>b.revenue-a.revenue);
}

async function closeWorkShift(shift){
  if(state.role!=='admin')return;
  const date=todayKey();
  if((state.dailyClosures||[]).some(x=>x.kind==='shift'&&x.date===date&&x.shift===shift)){
    showToast('Ин смена аллакай баста шудааст');return;
  }
  const now=Date.now(), end=shiftTimeMinutes(shiftConfig(shift).end),current=new Date(),currentMinutes=current.getHours()*60+current.getMinutes();
  // A shift may only be closed after its configured end, unless the admin explicitly confirms early closure.
  const unfinished=(state.orders||[]).some(o=>o.status==='active'&&shiftForTimestamp(o.createdAt)===shift&&isToday(o.createdAt));
  if(unfinished){showToast('Аввал чекҳои фаъоли ин сменаро пӯшед');return;}
  const orders=(state.orders||[]).filter(o=>o.status==='paid'&&!o.archived&&o.paidAt&&isToday(o.paidAt)&&shiftForTimestamp(o.paidAt)===shift);
  if(!orders.length){showToast('Дар ин смена чекҳои пардохтшуда нест');return;}
  if(!confirm('Ҳисоботи сменаи '+shift+'-ро маҳкам мекунед? Пас аз ин ҳисобот тағйир намеёбад.'))return;
  const expenses=(state.expenses||[]).filter(e=>isToday(e.ts||e.createdAt)&&shiftForTimestamp(e.ts||e.createdAt)===shift);
  const wages=wageReportForOrders(orders,shift),products=shiftProductSummary(orders);
    const closure={id:uid('shift'),kind:'shift',date,shift,shiftLabel:shiftLabel(shift),closedAt:now,closedBy:actingUsername(),
    revenue:orders.reduce((n,o)=>n+(Number(o.total)||0),0),cash:orders.reduce((n,o)=>n+paymentSplit(o).cash,0),
    noncash:orders.reduce((n,o)=>n+paymentSplit(o).noncash,0),checks:orders.length,orderIds:orders.map(o=>o.id),
    expenses:sumExpenses(expenses),products,oshKg:orders.reduce((n,o)=>n+oshWeightFromItems(o.items),0),wages:wages.entries,wageTotal:wages.total};
  const next=[closure,...(state.dailyClosures||[])];
  if(!await saveDailyClosures(next)){showToast('Сабти смена ноком шуд');return;}
  state.dailyClosures=next;
  await logActivity('Сменаи '+shift+' баста шуд');
  showToast('Смена '+shift+' маҳкам шуд ва ҳисобот нигоҳ дошта шуд');render();
}
