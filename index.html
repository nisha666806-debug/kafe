<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Идораи Кафе</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0806">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Оши Форам">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#1E293B;
    --paper:#F8FAFC;
    --paper-dim:#EEF2F7;
    --card:#FFFFFF;
    --brick:#DC2626;
    --brick-dim:#B91C1C;
    --olive:#16A34A;
    --gold:#C9A227;
    --line:#E3E8EF;
    --green:#16A34A;
    --amber:#D97706;
    --white:#FFFFFF;
    --blue:#2563EB;
    --blue-dim:#1D4ED8;
    --blue-tint:#EFF4FF;
    --text-dim:#64748B;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 16px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;touch-action:pan-x pan-y;}
  input, select, textarea, button{touch-action:manipulation;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .display{font-family:'Inter',sans-serif;}

  #app{max-width:1100px;margin:0 auto;padding:0 0 60px;}

  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--blue);outline-offset:1px;
  }
  /* iOS Safari auto-zooms the whole page when a focused field's text is under 16px —
     force 16px on every field (overriding any other size, inline included) so focusing
     anything never triggers that zoom. */
  input, select, textarea{ font-size:16px !important; }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:14px 16px;border-bottom:1px solid var(--line);
    background:var(--white);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:1;}
  .brand::before{
    content:'';width:28px;height:28px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,#171310,#3A2E1F 60%,var(--gold));
    box-shadow:inset 0 0 0 1px rgba(201,162,39,.5);
  }
  .brand .name{font-family:'Inter',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
  .brand .tag{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-dim);font-weight:700;display:none;}
  @media(min-width:480px){.brand .name{max-width:none;} .brand .tag{display:inline;}}
  .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .clock{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);display:none;}
  @media(min-width:560px){.clock{display:block;}}
  .role-pill{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;
    background:var(--blue-tint);color:var(--blue-dim);letter-spacing:.2px;
  }
  .btn-ghost{
    background:var(--white);border:1px solid var(--line);color:var(--ink);
    padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:background .15s ease,border-color .15s ease;
  }
  .btn-ghost:hover{background:var(--paper-dim);border-color:#CBD5E1;}

  /* ---------- Generic ---------- */
  .container{padding:24px 20px;}
  .section-title{
    font-family:'Inter',sans-serif;font-size:19px;font-weight:700;margin:0 0 16px;letter-spacing:-.2px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--blue);font-size:14px;font-weight:700;}

  button{cursor:pointer;}

  /* ---------- Role select ---------- */
  .role-select{
    min-height:calc(100vh - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;gap:26px;
  }
  .role-select h1{font-family:'Inter',sans-serif;font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px;}
  .role-select p{color:var(--text-dim);margin:0;font-size:15px;}
  .role-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .login-box{display:flex;flex-direction:column;gap:14px;width:280px;margin-top:10px;text-align:left;}
  .login-box .field label{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:4px;display:block;}
  .login-box .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--white);}
  .login-error{color:var(--brick);font-size:13px;font-weight:600;}
  .role-card{
    width:190px;padding:26px 18px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .role-card .icon{font-size:30px;}
  .role-card .label{font-weight:700;font-size:16px;font-family:'Inter',sans-serif;}
  .role-card .desc{font-size:12px;color:var(--text-dim);}

  /* ---------- Table grid (waiter) ---------- */
  .table-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
  }
  .table-card{
    border:1px solid var(--line);border-radius:14px;padding:16px 14px;background:var(--card);
    display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit;
    box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;
  }
  .table-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .table-card .row1{display:flex;justify-content:space-between;align-items:center;}
  .table-card .tnum{font-family:'Inter',sans-serif;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px;letter-spacing:-.2px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.free{background:var(--green);}
  .dot.occupied{background:var(--amber);}
  .dot.reserved{background:var(--gold);}
  .table-card.reserved-table{border-style:dashed;border-color:var(--gold);}
  .table-card.locked-table{opacity:.55;}
  .reserve-note{font-size:10px;color:#9C7A12;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .reserve-detail{font-size:10px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-variant-numeric:tabular-nums;}
  .table-card .status{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600;}
  .table-card .total{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--ink);}

  /* ---------- Ticket / order builder ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:760px){.overlay{align-items:center;}}
  .ticket-wrap{
    background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;border:1px solid var(--line);box-shadow:0 -8px 30px rgba(15,23,42,.15);
  }
  @media(min-width:760px){.ticket-wrap{border-radius:18px;max-height:88vh;box-shadow:0 20px 60px rgba(15,23,42,.2);}}
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;
  }
  .ticket-head h2{font-family:'Inter',sans-serif;margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--text-dim);line-height:1;}

  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;}
  .cat-tab{
    flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--white);
    font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;color:var(--ink);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .cat-tab.active{background:var(--blue);color:var(--white);border-color:var(--blue);}

  .menu-list{padding:8px 20px 4px;display:flex;flex-direction:column;gap:8px;}
  .menu-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
  }
  .menu-row .mname{font-weight:600;font-size:14px;}
  .menu-row .mprice{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);margin-top:2px;}
  .add-btn{
    background:var(--blue);color:var(--white);border:none;width:32px;height:32px;border-radius:50%;
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
  }

  .receipt{
    margin:18px 20px 20px;background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 20px;
    box-shadow:var(--shadow-sm);
  }
  .receipt-title{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);text-align:center;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:10px;font-weight:700;}
  .receipt-line{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;padding:5px 0;}
  .receipt-line .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:22px;height:22px;border:1px solid var(--line);background:var(--white);border-radius:6px;font-size:12px;line-height:1;font-family:inherit;}
  .receipt-empty{text-align:center;color:#94A3B8;font-size:13px;padding:14px 0;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;}

  .ticket-actions{display:flex;gap:10px;padding:0 20px 24px;}
  .btn-primary{
    flex:1;background:var(--blue);color:var(--white);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;transition:background .15s ease;
  }
  .btn-primary:hover:not(:disabled){background:var(--blue-dim);}
  .btn-primary:disabled{opacity:.4;}
  .btn-pay{
    flex:1;background:var(--ink);color:var(--white);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;transition:background .15s ease;
  }
  .btn-pay:hover:not(:disabled){background:#0B1220;}
  .btn-pay:disabled{opacity:.4;}

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--white);}
  .admin-tab{
    padding:14px 10px;background:none;border:none;font-family:'Inter',sans-serif;font-size:14px;
    font-weight:600;color:var(--text-dim);position:relative;top:1px;white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .admin-tab.active{color:var(--blue);border-bottom:2px solid var(--blue);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-card{
    flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow-sm);
  }
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:700;}
  .stat-card .value{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:25px;font-weight:800;color:var(--ink);margin-top:4px;letter-spacing:-.5px;}

  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  }
  .item-row .info .nm{font-weight:600;font-size:14px;}
  .item-row .info .cat{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px;}
  .item-row .price{font-variant-numeric:tabular-nums;font-weight:700;}
  .icon-btn{background:var(--white);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;font-size:13px;}
  .icon-btn.danger{border-color:#FECACA;color:var(--brick);background:#FEF2F2;}

  .cat-group{margin-bottom:20px;}
  .cat-group h3{font-family:'Inter',sans-serif;font-size:14px;margin:0 0 10px;color:var(--blue);font-weight:700;}

  .form-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:var(--shadow-sm);
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;}
  .field input, .field select{
    font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--white);
  }
  .field input{width:150px;}
  .field.small input{width:90px;}

  .receipt-item-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;
  }
  .receipt-item-row .l1{font-weight:600;font-family:'Inter',sans-serif;}
  .receipt-item-row .l2{color:var(--text-dim);font-size:12px;margin-top:3px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:#94A3B8;
  }
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);
    padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:50;
    opacity:0;transition:opacity .25s ease;pointer-events:none;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;}

  .chef-osh-line{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0;color:var(--ink);}
  .chef-other-line{font-size:12px;color:var(--text-dim);padding:3px 0;}
  .osh-banner{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;
    background:var(--paper-dim);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim);
  }
  .settings-form{display:flex;flex-direction:column;gap:16px;max-width:340px;}
  .salary-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  }
  .salary-row .salary-name{min-width:110px;}
  .salary-row .salary-name .nm{font-weight:600;font-size:14px;}
  .salary-row .salary-name .cat{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .salary-select{padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:12px;background:var(--white);}
  .salary-input{width:100px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;}
  .salary-computed{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-dim);margin-left:auto;}
  .xls-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums;}
  .xls-table th, .xls-table td{border:1px solid var(--line);padding:9px 10px;text-align:right;}
  .xls-table th{background:var(--paper-dim);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-dim);font-weight:700;}
  .xls-table td:first-child, .xls-table th:first-child{text-align:left;font-weight:600;}
  .xls-table tr:nth-child(even) td{background:var(--paper-dim);}
  .xls-table td.total-cell{font-weight:700;color:var(--blue);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ FIREBASE SETUP ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCVgddT7ycblQxi1DWjJ6zQ92ArRIP8PgM",
  authDomain: "oshi-foram.firebaseapp.com",
  projectId: "oshi-foram",
  storageBucket: "oshi-foram.firebasestorage.app",
  messagingSenderId: "564752367082",
  appId: "1:564752367082:web:6fd330f414cd7afef48693"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){ console.error('Firebase init failed', e); }

/* Multi-tenant: ?cafe=<slug> in the URL isolates a new café's data completely.
   No param (default) keeps using the ORIGINAL flat 'cafeData' collection so the
   already-running café is never touched by this change. */
function getCafeId(){
  try{
    return (new URLSearchParams(window.location.search).get('cafe') || '').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');
  }catch(e){ return ''; }
}
const CAFE_ID = getCafeId();
function docRef(key){
  return CAFE_ID
    ? db.collection('cafes').doc(CAFE_ID).collection('data').doc(key)
    : db.collection('cafeData').doc(key);
}

/* ============ SESSION PERSISTENCE ============
   Keeps the logged-in user through accidental reloads (pull-to-refresh, phone killing the
   tab in the background, etc.) so people aren't forced to retype their password constantly. */
const SESSION_KEY = 'cafeSession_' + (CAFE_ID || 'default');
function saveSession(user){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(user)); }catch(e){}
}
function loadSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

// Returns {ok, value}. ok=true means the read genuinely succeeded — value is either the
// stored data or null if the document truly does not exist yet. ok=false means the read
// FAILED (network blip, etc.) — callers must NOT treat this as "empty" or they will
// overwrite real data with defaults. This distinction is critical: a transient failure
// must never be allowed to look like "this is a brand new café".
async function fsGet(key){
  try{
    const snap = await docRef(key).get();
    return {ok:true, value: snap.exists ? snap.data().value : null};
  }catch(e){ console.error('fsGet failed', key, e); return {ok:false, value:null}; }
}
async function fsSet(key, value){
  try{
    await docRef(key).set({value, updatedAt: Date.now()});
    return true;
  }catch(e){ console.error('fsSet failed', key, e); return false; }
}

/* ============ STORAGE HELPERS ============ */
async function loadAll(){
  const out = {menu:null, orders:null, settings:null, reservations:null, tables:null, oshStock:null, accounts:null, inventory:null, activityLog:null, bonuses:null, failed:{}};
  const parseField = async (key, outKey)=>{
    const r = await fsGet(key);
    if(!r.ok){ out.failed[outKey] = true; return; }
    try{ out[outKey] = r.value ? JSON.parse(r.value) : null; }
    catch(e){ out.failed[outKey] = true; }
  };
  await parseField('menu', 'menu');
  await parseField('orders', 'orders');
  await parseField('settings', 'settings');
  await parseField('reservations', 'reservations');
  await parseField('tables', 'tables');
  await parseField('oshStock', 'oshStock');
  await parseField('accounts', 'accounts');
  await parseField('inventory', 'inventory');
  await parseField('activityLog', 'activityLog');
  await parseField('bonuses', 'bonuses');
  return out;
}
async function saveMenu(menu){
  const ok = await fsSet('menu', JSON.stringify(menu));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveOrders(orders){
  const ok = await fsSet('orders', JSON.stringify(orders));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveSettings(settings){
  const ok = await fsSet('settings', JSON.stringify(settings));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveReservations(reservations){
  const ok = await fsSet('reservations', JSON.stringify(reservations));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveTables(tables){
  const ok = await fsSet('tables', JSON.stringify(tables));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveOshStock(data){
  const ok = await fsSet('oshStock', JSON.stringify(data));
  if(!ok) showToast('Хатогӣ дар нигоҳдорӣ');
}
async function saveAccounts(accounts){

async function init(){
  render(); // loading state
  const {menu, orders, settings, reservations, tables, oshStock, accounts, inventory, activityLog, bonuses, failed} = await loadAll();

  // EVERY field must load successfully before we touch anything. A failed read must NEVER be
  // treated as "this data doesn't exist yet" — that is exactly what caused real staff/order/
  // inventory data to be silently wiped in the past. If ANY field failed to load (network
  // blip etc.), show a retry screen and write nothing at all until a full, successful load.
  const anyFailed = Object.keys(failed).some(k=>failed[k]);
  if(anyFailed){
    state.loadError = true;
    state.loaded = true;
    render();
    return;
  }

  if(CAFE_ID && (!accounts || !accounts.length)){
    // confirmed genuinely empty (not a failed read) — brand-new café on this link
    state.needsSetup = true;
    state.loaded = true;
    render();
    return;
  }

  state.menu = (menu && menu.length) ? menu : DEFAULT_MENU;
  if(!(menu && menu.length)) await saveMenu(state.menu);

  state.orders = orders || [];
  state.settings = settings || {...DEFAULT_SETTINGS};
  state.reservations = reservations || {};
  state.oshStock = oshStock || {date:'', kg:0};
  state.inventory = inventory || [];
  state.activityLog = activityLog || [];
  state.bonuses = bonuses || [];

  if(tables && tables.length){
    state.tables = tables;
  } else {
    const tc = (settings && settings.tableCount) || 8;
    state.tables = Array.from({length:tc}, (_,i)=>({id:i+1, name:'Мизи '+(i+1), seats:4}));
    await saveTables(state.tables);
  }

  if(accounts && accounts.length){
    state.accounts = accounts;
  } else {
    // accounts read succeeded (anyFailed already excluded that) and is genuinely empty
    state.accounts = [{id:'acc_admin', username:'admin', password:'admin123', role:'admin'}];
    await saveAccounts(state.accounts);
  }

  const session = loadSession();
  if(session){
    const acc = state.accounts.find(a=>a.username.toLowerCase()===(session.username||'').toLowerCase() && a.password===session.password);
    if(acc){
      state.currentUser = {username:acc.username, role:acc.role};
      state.role = acc.role;
    } else {
      clearSession(); // account was deleted or password changed elsewhere — fall back to login
    }
  }

  state.loaded = true;
  render();
  setupRealtimeSync();
}

/* ============ REAL-TIME SYNC ============
   Uses Firestore's onSnapshot listeners instead of polling — changes on one device now
   reach every other device almost instantly, not after up to 6 seconds. */
let __realtimeUnsubs = [];
function teardownRealtimeSync(){
  __realtimeUnsubs.forEach(unsub=>{ try{ unsub(); }catch(e){} });
  __realtimeUnsubs = [];
}
// Only defer a redraw while the person's cursor is literally inside a text field / select
// right now — far more precise than a blanket "form is open" timer, and it means every OTHER
// screen (or the same screen once you click away) stays truly real-time.
function isActivelyEditingFormField(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = (el.tagName||'').toUpperCase();
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}
function setupRealtimeSync(){
  teardownRealtimeSync();
  const fields = [
    ['menu','menu'], ['orders','orders'], ['settings','settings'], ['reservations','reservations'],
    ['tables','tables'], ['oshStock','oshStock'], ['accounts','accounts'], ['inventory','inventory'],
    ['activityLog','activityLog'], ['bonuses','bonuses']
  ];
  fields.forEach(([key, stateKey])=>{
    try{
      const unsub = docRef(key).onSnapshot((snap)=>{
        if(!state.role) return; // don't disturb the login screen while typing
        if(!snap.exists) return;
        try{
          const parsed = JSON.parse(snap.data().value);
          // Always keep the in-memory data fresh so it's instantly correct the moment any
          // open form closes. Only the actual screen REDRAW is held back while someone's
          // cursor is inside a field right now — never delays what other devices see.
          state[stateKey] = parsed;
          if(!isActivelyEditingFormField()) render();
        }catch(e){}
      }, (err)=>{ console.error('Realtime listener error for', key, err); });
      __realtimeUnsubs.push(unsub);
    }catch(e){ console.error('Failed to attach realtime listener for', key, e); }
  });
}
async function pollRefresh(){
  if(!state.role) return; // don't wipe the login form while the person is typing
  if(state.formOpen && state.formOpenAt && (Date.now()-state.formOpenAt) < 120000) return;
  if(state.formOpen) state.formOpen = false; // safety: don't let a stuck form block sync forever
  const {menu, orders, settings, reservations, tables, oshStock, accounts, inventory, activityLog, bonuses} = await loadAll();
  if(menu) state.menu = menu;
  if(orders) state.orders = orders;
  if(settings) state.settings = settings;
  if(reservations) state.reservations = reservations;
  if(tables) state.tables = tables;
  if(oshStock) state.oshStock = oshStock;
  if(accounts) state.accounts = accounts;
  if(inventory) state.inventory = inventory;
  if(activityLog) state.activityLog = activityLog;
  if(bonuses) state.bonuses = bonuses;
  render();
}

function activeOrderForTable(t){
  return state.orders.find(o=>o.table===t && o.status==='active');
}
// Active dine-in orders whose table id no longer exists in state.tables (e.g. the table was
// renamed/removed while somehow still holding an order) — these must never be silently counted
// as "occupied" without showing up as any actual card, which is confusing and looks like a bug.
function orphanedActiveOrders(){
  const tableIds = new Set(state.tables.map(t=>t.id));
  return state.orders.filter(o=>o.status==='active' && o.table!==null && o.table!==undefined && !tableIds.has(o.table));
}
function occupiedTableCount(){
  const tableIds = new Set(state.tables.map(t=>t.id));
  return state.orders.filter(o=>o.status==='active' && o.table!==null && o.table!==undefined && tableIds.has(o.table)).length;
}
function openTable(t){
  const existing = activeOrderForTable(t);
  const tbl = state.tables.find(x=>x.id===t);
  const isRealAdmin = state.currentUser && state.currentUser.role==='admin';
  const actingName = actingUsername();
  if(state.role==='waiter' && tbl && tbl.assignedTo && actingName && tbl.assignedTo!==actingName){
    if(isRealAdmin && !state.previewUsername){
      // admin viewing the generic waiter screen (no specific waiter chosen) — full access
    } else {
      showToast('Ин миз ба официанти дигар тахсис дода шудааст');
      return;
    }
  }
  if(state.role==='cashier' && !existing){ showToast('Ин миз озод аст — фармоише нест'); return; }
  if(state.role==='admin' && !existing){ showToast('Ин миз озод аст'); return; }
  state.ticketMode = state.role==='waiter' ? 'edit' : (state.role==='cashier' ? 'pay' : 'view');
  state.activeTable = t;
  state.draftItems = {};
  if(existing){
    existing.items.forEach(it=>{ state.draftItems[it.menuId] = it.qty; });
  } else if(state.role==='waiter' && state.reservations && state.reservations[t] && state.reservations[t].preOrder && state.reservations[t].preOrder.length){
    state.reservations[t].preOrder.forEach(it=>{
      state.draftItems[it.menuId] = (state.draftItems[it.menuId]||0) + it.qty;
    });
    showToast('Пешфармоиши брон худкор илова шуд');
  }
  state.activeCat = (state.menu[0] && state.menu[0].category) || null;
  render();
}
function closeTicket(){
  state.activeTable = null;
  state.draftItems = {};
  render();
}
function draftTotal(){
  let total = 0;
  Object.keys(state.draftItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item) total += lineTotal(item, state.draftItems[mid]);
  });
  return total;
}
function lineTotal(menuItem, amount){
  return menuItem.unit==='kg' ? menuItem.price * (amount/1000) : menuItem.price * amount;
}
function changeQty(mid, delta){
  const cur = state.draftItems[mid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.draftItems[mid];
  else state.draftItems[mid] = next;
  render();
}
function addGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.draftItems[mid] || 0;
  state.draftItems[mid] = cur + g;
  render();
}
function setGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) delete state.draftItems[mid];
  else state.draftItems[mid] = g;
  render();
}
function removeDraftItem(mid){
  delete state.draftItems[mid];
  render();
}
async function saveTicket(sendFlag){
  let order = activeOrderForTable(state.activeTable);
  const prevItems = order ? order.items : [];
  let droppedAny = false;
  const items = Object.keys(state.draftItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    if(!m){ droppedAny = true; return null; }
    const prev = prevItems.find(p=>p.menuId===mid);
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.draftItems[mid], servedQty: prev?(prev.servedQty||0):0};
  }).filter(Boolean);
  if(droppedAny) showToast('Баъзе маҳсулот дигар дар меню нест — аз чек хориҷ шуд');
  const total = draftTotal();
  let isNew = false;
  if(!order){
    isNew = true;
    order = {id:uid('ord'), table:state.activeTable, status:'active', items:[], total:0, createdAt:Date.now(),
      createdBy: actingUsername(), sentToKitchen:false};
    state.orders.push(order);
  }
  order.items = items;
  order.total = total;
  order.updatedAt = Date.now();
  if(sendFlag){
    order.sentToKitchen = true;
    await deductForOrderDelta(order, items);
  }
  await saveOrders(state.orders);
  if(isNew && state.reservations && state.reservations[state.activeTable]){
    delete state.reservations[state.activeTable];
    await saveReservations(state.reservations);
  }
  showToast(sendFlag ? '🍚 Ба ошпаз фиристода шуд' : 'Фармоиш захира шуд');
  closeTicket();
}

function attachSplitPaymentEvents(idPrefix, total, onConfirm){
  const cashInput = document.getElementById(idPrefix+'-cash');
  const noncashInput = document.getElementById(idPrefix+'-noncash');
  if(!cashInput || !noncashInput) return;
  const clamp = (v)=> Math.max(0, Math.min(total, Number(v)||0));
  const fmt = (v)=> (Math.round(v*100)/100).toString();
  cashInput.addEventListener('input', ()=>{
    const c = clamp(cashInput.value);
    noncashInput.value = fmt(total - c);
  });
  noncashInput.addEventListener('input', ()=>{
    const n = clamp(noncashInput.value);
    cashInput.value = fmt(total - n);
  });
  document.querySelectorAll(`[data-splitquick^="${idPrefix}|"]`).forEach(el=>{
    el.addEventListener('click', ()=>{
      const mode = el.dataset.splitquick.split('|')[1];
      if(mode==='allcash'){ cashInput.value = fmt(total); noncashInput.value = '0'; }
      else if(mode==='allnoncash'){ cashInput.value = '0'; noncashInput.value = fmt(total); }
      else if(mode==='half'){ cashInput.value = fmt(total/2); noncashInput.value = fmt(total/2); }
    });
  });
  const confirmBtn = document.getElementById(idPrefix+'-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>{
    const c = Math.max(0, Number(cashInput.value)||0);
    const n = Math.max(0, Number(noncashInput.value)||0);
    onConfirm(c, n);
  });
}
function paymentSplit(o){
  if(o.cashAmount!=null || o.noncashAmount!=null){
    return {cash:o.cashAmount||0, noncash:o.noncashAmount||0, unknown:0};
  }
  if(o.paymentMethod==='cash') return {cash:o.total||0, noncash:0, unknown:0};
  if(o.paymentMethod==='noncash') return {cash:0, noncash:o.total||0, unknown:0};
  return {cash:0, noncash:0, unknown:o.total||0};
}
function paymentMethodLabel(o){
  const s = paymentSplit(o);
  if(s.unknown>0) return '—';
  if(s.cash>0 && s.noncash>0) return `💵 ${fmtMoney(s.cash)} + 💳 ${fmtMoney(s.noncash)}`;
  if(s.cash>0) return '💵 нақд';
  if(s.noncash>0) return '💳 ғайринақд';
  return '—';
}

function playChefAlertSound(){
  try{
    __alertAudioCtx = __alertAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = __alertAudioCtx;
    if(ctx.state==='suspended') ctx.resume().catch(()=>{});
    const now = ctx.currentTime;
    [0, 0.18].forEach(offset=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, now+offset);
      gain.gain.exponentialRampToValueAtTime(0.25, now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+offset+0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+offset);
      osc.stop(now+offset+0.18);
    });
  }catch(e){}
}

/* ---------- Recipe-based automatic inventory deduction ---------- */
function computeInventoryDeduction(orderItems){
  const deduction = {};
  orderItems.forEach(it=>{
    const menuItem = state.menu.find(m=>m.id===it.menuId);
    if(!menuItem || !menuItem.recipe || !menuItem.recipe.length) return;
    const soldAmount = menuItem.unit==='kg' ? (it.qty/1000) : it.qty; // recipe is "per 1kg" or "per 1 dona"
    menuItem.recipe.forEach(r=>{
      deduction[r.invId] = (deduction[r.invId]||0) + (Number(r.qty)||0) * soldAmount;
    });
  });
  return deduction;
}
async function applyInventoryDeduction(deduction){
  let changed = false;
  Object.keys(deduction).forEach(invId=>{
    const item = state.inventory.find(i=>i.id===invId);
    if(!item) return;
    item.qty = Math.max(0, (Number(item.qty)||0) - deduction[invId]);
    item.updatedAt = Date.now();
    changed = true;
  });
  if(changed) await saveInventory(state.inventory);
}
// Deducts only the DELTA vs what was already deducted for this order before (so re-sending
// an order after adding more items doesn't double-subtract the items already accounted for).
async function deductForOrderDelta(order, currentItems){
  const prevMap = order.inventoryDeductedFor || {};
  const deltaItems = [];
  currentItems.forEach(it=>{
    const prevQty = prevMap[it.menuId] || 0;
    const delta = it.qty - prevQty;
    if(delta > 0) deltaItems.push({menuId:it.menuId, qty:delta, unit:it.unit});
  });
  const deduction = computeInventoryDeduction(deltaItems);
  await applyInventoryDeduction(deduction);
  const newMap = {};
  currentItems.forEach(it=>{ newMap[it.menuId] = it.qty; });
  order.inventoryDeductedFor = newMap;
}

function isThisMonth(ts){
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth();
}
function orderCommission(order){
  let oshGrams = 0, oshValue = 0;
  order.items.forEach(it=>{
    if(getItemCategory(it)==='Ош' && it.unit==='kg'){
      oshGrams += it.qty;
      oshValue += lineTotal({unit:'kg', price:it.price}, it.qty);
    }
  });
  const oshCommission = oshGrams >= 500 ? 12 : oshValue*0.05;
  const otherValue = Math.max(0, (order.total||0) - oshValue);
  const otherCommission = otherValue*0.05;
  return oshCommission + otherCommission;
}
function staffCommissionBreakdown(username, role, scope){
  const orders = state.orders.filter(o=>{
    if(o.status!=='paid') return false;
    const ts = o.paidAt || o.updatedAt || o.createdAt;
    if(scope==='today' && !isToday(ts)) return false;
    if(scope==='month' && !isThisMonth(ts)) return false;
    return (role==='waiter' && o.createdBy===username) || (role==='cashier' && o.paidBy===username);
  });
  let countHigh=0, countLow=0, countNoOsh=0, oshSum=0, otherSum=0;
  orders.forEach(o=>{
    let oshGrams=0, oshValue=0;
    o.items.forEach(it=>{
      if(getItemCategory(it)==='Ош' && it.unit==='kg'){ oshGrams+=it.qty; oshValue+=lineTotal({unit:'kg',price:it.price}, it.qty); }
    });
    if(oshGrams>=500){ countHigh++; oshSum+=12; }
    else if(oshGrams>0){ countLow++; oshSum+=oshValue*0.05; }
    else { countNoOsh++; }
    const otherValue = Math.max(0, (o.total||0)-oshValue);
    otherSum += otherValue*0.05;
  });
  return {orderCount:orders.length, countHigh, countLow, countNoOsh, oshSum, otherSum, total: oshSum+otherSum};
}
function staffCommission(username, role, scope){
  return staffCommissionBreakdown(username, role, scope).total;
}
function manualBonusSum(username, scope){
  return (state.bonuses||[]).filter(b=>b.username===username && (scope==='today' ? isToday(b.ts) : isThisMonth(b.ts)))
    .reduce((s,b)=>s+(Number(b.amount)||0), 0);
}
// Automatic bonuses are evaluated live against TODAY's performance only (we don't retroactively
// re-earn past days), for waiters and cashiers.
function autoBonusToday(username, role){
  const empty = {checkCountBonus:0, revenueBonus:0, total:0, orderCount:0, commissionTotal:0};
  if(role!=='waiter' && role!=='cashier') return empty;
  const breakdown = staffCommissionBreakdown(username, role, 'today');
  let checkCountBonus = 0, revenueBonus = 0;
  const cThresh = Number(state.settings.checkCountBonusThreshold)||0;
  const cAmt = Number(state.settings.checkCountBonusAmount)||0;
  if(cThresh>0 && cAmt>0 && breakdown.orderCount > cThresh) checkCountBonus = cAmt;
  const rThresh = Number(state.settings.revenueBonusThreshold)||0;
  const rAmt = Number(state.settings.revenueBonusAmount)||0;
  if(rThresh>0 && rAmt>0 && breakdown.total > rThresh) revenueBonus = rAmt;
  return {checkCountBonus, revenueBonus, total: checkCountBonus+revenueBonus, orderCount: breakdown.orderCount, commissionTotal: breakdown.total};
}
function computeWages(acc){
  if(acc.wageType==='commission'){
    const auto = autoBonusToday(acc.username, acc.role);
    const manualToday = manualBonusSum(acc.username, 'today');
    const manualMonth = manualBonusSum(acc.username, 'month');
    return {
      daily: staffCommission(acc.username, acc.role, 'today') + auto.total + manualToday,
      monthly: staffCommission(acc.username, acc.role, 'month') + manualMonth,
      bonusToday: auto.total + manualToday
    };
  }
  const days = Math.max(1, Number(state.settings.workDaysPerMonth) || 30);
  const amount = Number(acc.wageAmount) || 0;
  const manualToday = manualBonusSum(acc.username, 'today');
  const manualMonth = manualBonusSum(acc.username, 'month');
  if(acc.wageType==='monthly'){
    return {daily: amount/days + manualToday, monthly: amount + manualMonth, bonusToday: manualToday};
  }
  return {daily: amount + manualToday, monthly: amount*days + manualMonth, bonusToday: manualToday};
}
function formatQtyLabel(it){
  const safeName = escapeHtml(it.name||'');
  if(it.unit==='kg'){
    const g = it.qty;
    const label = g>=1000 ? (Math.round((g/1000)*100)/100)+' кг' : Math.round(g)+' г';
    return label+' '+safeName;
  }
  return it.qty+'× '+safeName;
}
function getItemCategory(it){
  if(it.category) return it.category;
  const m = state.menu.find(x=>x.id===it.menuId);
  return m ? m.category : '';
}

/* ============ RENDER ============ */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){
    app.innerHTML = `<div class="empty-state"><div class="big">☕</div><div class="mono">Бор карда истодааст…</div></div>`;
    return;
  }
  if(state.loadError){
    app.innerHTML = `
    <div class="role-select">
      <h1>⚠️ Пайваст ноком шуд</h1>
      <p>Интернет ё Firebase дастрас нест. Барои эҳтиёти маълумот, барнома ҳеҷ чиз наменависад.</p>
      <button class="btn-primary" style="padding:12px 24px;" id="retryLoadBtn">Кӯшиши дубора</button>
    </div>`;
    const btn = document.getElementById('retryLoadBtn');
    if(btn) btn.addEventListener('click', ()=>{ state.loadError=false; state.loaded=false; init(); });
    return;
  }
  if(state.needsSetup){
    app.innerHTML = renderCafeSetup();
    attachCafeSetupEvents();
    return;
  }
  if(!state.role){
    app.innerHTML = renderLogin();
    attachLoginEvents();
    return;
  }
  let html = renderTopbar();
  if(state.role==='waiter'){
    html += renderWaiter();
  } else if(state.role==='cashier'){
    html += renderCashier();
  } else if(state.role==='chef'){
    html += renderChef();
  } else {
    html += renderAdmin();
  }
  app.innerHTML = html;
  attachCommonEvents();
  if(state.role==='waiter') attachWaiterEvents();
  if(state.role==='cashier'){
    attachTableGridEvents();
    const openBtn = document.getElementById('openTakeawayBtn');
    if(openBtn) openBtn.addEventListener('click', openTakeaway);
    const openSchedBtn = document.getElementById('openScheduledBtn');
    if(openSchedBtn) openSchedBtn.addEventListener('click', openScheduled);
    document.querySelectorAll('[data-vieworder]').forEach(el=>{
      el.addEventListener('click', ()=> openOrderView(el.dataset.vieworder, el.dataset.viewmode||'pay'));
    });
    document.querySelectorAll('[data-sendschedtakeaway]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        await sendScheduledTakeawayToKitchen(el.dataset.sendschedtakeaway);
        render();
      });
    });
  }
  if(state.role==='chef') attachChefEvents();
  if(state.role==='admin') attachAdminEvents();

  if(state.activeTable !== null){
    const overlayHtml = renderTicketOverlay();
    const div = document.createElement('div');
    div.innerHTML = overlayHtml;
    app.appendChild(div.firstElementChild);
    attachTicketEvents();
  }
  if(state.takeawayOpen){
    const twHtml = renderTakeawayOverlay();
    const div2 = document.createElement('div');
    div2.innerHTML = twHtml;
    app.appendChild(div2.firstElementChild);
    attachTakeawayEvents();
  }
  if(state.scheduledOpen){
    const swHtml = renderScheduledOverlay();
    const div3 = document.createElement('div');
    div3.innerHTML = swHtml;
    app.appendChild(div3.firstElementChild);
    attachScheduledEvents();
  }
  if(state.viewingOrderId){
    const vwHtml = renderOrderViewOverlay();
    if(vwHtml){
      const div4 = document.createElement('div');
      div4.innerHTML = vwHtml;
      app.appendChild(div4.firstElementChild);
      attachOrderViewEvents();
    }
  }
}

/* ---------- Shared table grid ---------- */
function buildTableCards(){
  let cards = '';
  state.tables.forEach(tbl=>{
    const t = tbl.id;
    const order = activeOrderForTable(t);
    const occ = !!order;
    const reservation = !occ && state.reservations ? state.reservations[t] : null;
    const isRealAdmin = state.currentUser && state.currentUser.role==='admin';
    const actingName = actingUsername();
    const lockedForMe = state.role==='waiter' && tbl.assignedTo && actingName && tbl.assignedTo!==actingName && !(isRealAdmin && !state.previewUsername);
    let dotClass = 'free', statusText = 'Озод', extra = '';
    if(occ){
      dotClass = 'occupied'; statusText = 'Банд';
      extra = `<span class="total mono">${fmtMoney(order.total)}</span>`;
      const mins = Math.floor((Date.now()-order.createdAt)/60000);
      const elapsedLabel = mins < 60 ? mins+' дақ' : Math.floor(mins/60)+' соат '+(mins%60)+' дақ';
      extra += `<span class="reserve-detail" style="color:${mins>=60?'var(--brick)':'#8a7c64'};">⏱ ${elapsedLabel}</span>`;
      if(order.customerPhone){
        extra += `<span class="reserve-detail">📞 ${escapeHtml(order.customerPhone)}</span>`;
      }
      if(order.type!=='takeaway' && order.type!=='scheduled' && !order.sentToKitchen){
        extra += `<span class="reserve-detail" style="color:var(--brick);">⏳ ба ошпаз нафиристода шуд</span>`;
      }
    } else if(reservation){
      dotClass = 'reserved'; statusText = 'Брон';
      const nm = reservation.name || reservation.note || '';
      const detailParts = [];
      if(reservation.phone) detailParts.push(reservation.phone);
      if(reservation.bookedAt) detailParts.push(fmtTime(reservation.bookedAt));
      const preSum = preOrderSummary(reservation);
      extra = (nm ? `<span class="reserve-note">${escapeHtml(nm)}</span>` : '') +
              (detailParts.length ? `<span class="reserve-detail">${escapeHtml(detailParts.join(' · '))}</span>` : '') +
              (preSum ? `<span class="reserve-detail">🍽 ${escapeHtml(preSum)}</span>` : '');
    }
    const assignBadge = tbl.assignedTo ? `<span class="reserve-detail">👤 ${escapeHtml(tbl.assignedTo)}</span>` : '';
    cards += `
    <button class="table-card ${reservation?'reserved-table':''} ${lockedForMe?'locked-table':''}" data-table="${t}">
      <div class="row1">
        <span class="tnum">${escapeHtml(tbl.name)}</span>
        <span class="dot ${dotClass}"></span>
      </div>
      <span class="status">${statusText} · ${tbl.seats} ҷой</span>
      ${extra}
      ${assignBadge}
      ${lockedForMe ? `<span class="reserve-detail" style="color:var(--brick);">🔒 танҳо ${escapeHtml(tbl.assignedTo)}</span>` : ''}
    </button>`;
  });
  return cards;
}
function attachTableGridEvents(){
  document.querySelectorAll('.table-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      openTable(Number(el.dataset.table));
    });
  });
}

/* ---------- Takeaway (cashier -> chef, no waiter, no table) ---------- */
function takeawaySubtotal(){
  let total = 0;
  Object.keys(state.takeawayItems).forEach(mid=>{
    const item = state.menu.find(m=>m.id===mid);
    if(item) total += lineTotal(item, state.takeawayItems[mid]);
  });
  return total;
}
function takeawayDiscountAmount(){
  const pct = Math.max(0, Math.min(100, Number(state.settings.takeawayDiscountPct)||0));
  return takeawaySubtotal() * (pct/100);
}
function takeawayTotal(){
  return Math.max(0, takeawaySubtotal() - takeawayDiscountAmount());
}
function openTakeaway(){
  state.takeawayOpen = true;
  state.takeawayItems = {};
  state.takeawayCat = (state.menu[0] && state.menu[0].category) || null;
  render();
}
function closeTakeaway(){
  state.takeawayOpen = false;
  state.takeawayItems = {};
  render();
}
function changeTakeawayQty(mid, delta){
  const cur = state.takeawayItems[mid] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = next;
  render();
}
function addTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) return;
  const cur = state.takeawayItems[mid] || 0;
  state.takeawayItems[mid] = cur + g;
  render();
}
function setTakeawayGrams(mid, grams){
  const g = Math.max(0, Number(grams)||0);
  if(g<=0) delete state.takeawayItems[mid];
  else state.takeawayItems[mid] = g;
  render();
}
function removeTakeawayItem(mid){
  delete state.takeawayItems[mid];
  render();
}
async function submitTakeaway(cashAmount, noncashAmount){
  let droppedAny = false;
  const items = Object.keys(state.takeawayItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    if(!m){ droppedAny = true; return null; }
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.takeawayItems[mid]};
  }).filter(Boolean);
  if(droppedAny) showToast('Баъзе маҳсулот дигар дар меню нест — аз чек хориҷ шуд');
  if(!items.length) return;
  const total = takeawayTotal();
  const todayCount = state.orders.filter(o=>o.type==='takeaway' && isToday(o.createdAt)).length;
  const cash = Math.max(0, Number(cashAmount)||0);
  const noncash = Math.max(0, Number(noncashAmount)||0);
  const order = {
    id: uid('ord'), table: null, type: 'takeaway', status: 'paid', takeawayNumber: todayCount+1,
    items, total, createdAt: Date.now(), updatedAt: Date.now(),
    createdBy: null, paidAt: Date.now(), paidBy: actingUsername(),
    cashAmount: cash, noncashAmount: noncash,
    paymentMethod: cash>0 && noncash>0 ? 'mixed' : (noncash>0 ? 'noncash' : 'cash'),
    prepared: false
  };
  state.orders.push(order);
  await deductForOrderDelta(order, items);
  await saveOrders(state.orders);
  showToast('Фармоиш пардохт шуд ва ба ошпаз фиристода шуд');
  closeTakeaway();
}

function addScheduledGrams(mid, grams){

  state.scheduledItems[mid] = cur + g;

function setScheduledGrams(mid, grams){

}
function removeScheduledItem(mid){

}
async function submitScheduled(name, phone, time, deliveryType){
  let droppedAny = false;
  const items = Object.keys(state.scheduledItems).map(mid=>{
    const m = state.menu.find(x=>x.id===mid);
    if(!m){ droppedAny = true; return null; }
    return {menuId:mid, name:m.name, price:m.price, unit:m.unit||'dona', category:m.category, qty:state.scheduledItems[mid]};
  }).filter(Boolean);
  if(droppedAny) showToast('Баъзе маҳсулот дигар дар меню нест — аз чек хориҷ шуд');
  if(!items.length){ showToast('Аввал маҳсулот илова кунед'); return; }
  if(!time){ showToast('Соатро таъин кунед'); return; }
  const total = scheduledTotal();
  const order = {
    id: uid('ord'), table: null, type: 'scheduled', status: 'active',
    items, total, createdAt: Date.now(), updatedAt: Date.now(),
    createdBy: null, readyTime: time, customerName: name||'', customerPhone: phone||'',
    deliveryType: deliveryType==='takeaway' ? 'takeaway' : 'dinein',
    prepared: false
  };
  state.orders.push(order);
  await deductForOrderDelta(order, items);

  showToast('Фармоиши вақтдор сабт шуд');

  order.paidAt = Date.now();

  order.noncashAmount = Math.max(0, Number(noncashAmount)||0);

/* ---------- Chef view ---------- */
async function toggleOrderPrepared(orderId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  order.prepared = !order.prepared;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
}
async function markItemServed(orderId, menuId, amount){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  const amt = Math.max(0, Number(amount)||0);
  if(amt<=0) return;
  const served = Math.min(item.qty, (item.servedQty||0) + amt);
  item.servedQty = served;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
  showToast('Кашида шуд');
}
async function undoItemServed(orderId, menuId){
  const order = state.orders.find(o=>o.id===orderId);
  if(!order) return;
  const item = order.items.find(it=>it.menuId===menuId);
  if(!item) return;
  item.servedQty = 0;
  order.updatedAt = Date.now();
  await saveOrders(state.orders);
}
function renderChef(){
  const todays = state.orders.filter(o=>isToday(o.createdAt));
  let porsiyaTotal = 0;
  todays.forEach(o=>{
    o.items.forEach(it=>{
      if(getItemCategory(it)==='Ош' && it.unit!=='kg') porsiyaTotal += it.qty;
    });
  });
  const kgTotal = oshOrderedKgToday();
  const hasOsh = (o)=> o.items.some(it=>getItemCategory(it)==='Ош');
  const chefClearedAt = Number(state.settings.chefQueueClearedAt) || 0;
  const pending = state.orders.filter(o=>{
    if((o.updatedAt||o.createdAt) <= chefClearedAt) return false;
    if(o.prepared) return false;
    if(!hasOsh(o)) return false;
    if(o.type==='takeaway') return o.status==='paid' || o.sentToKitchen===true;
    if(o.type==='scheduled') return false; // hidden until sent to kitchen (assigned to a table, or sent as takeaway)
    return o.status==='active' && o.sentToKitchen===true;
  }).sort((a,b)=>a.createdAt-b.createdAt);
  const done = state.orders.filter(o=>{
    if((o.updatedAt||o.createdAt) <= chefClearedAt) return false;
    if(!o.prepared) return false;
    if(!hasOsh(o)) return false;
    if(o.type==='takeaway') return isToday(o.createdAt);
    if(o.type==='scheduled') return false;
    return o.status==='active' && o.sentToKitchen===true;
  }).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  const hasStock = state.oshStock && state.oshStock.date === todayKey();
  const cookedKg = hasStock ? (Number(state.oshStock.kg)||0) : null;
  const remainingKg = hasStock ? (cookedKg - kgTotal) : null;
  const remainingCard = hasStock
    ? `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="color:${remainingKg<0?'var(--brick)':'var(--olive)'};">${remainingKg.toFixed(2)} кг</div></div>`
    : `<div class="stat-card"><div class="label">Оши боқимонда</div><div class="value" style="font-size:13px;color:#9c8f78;">админ ҳанӯз сабт накардааст</div></div>`;

  const renderOrderCard = (o, isDone) => {
    const isTakeaway = o.type==='takeaway' || o.table===null;
    const tbl = isTakeaway ? null : state.tables.find(t=>t.id===o.table);
    const title = orderLabel(o);
    const ageMin = Math.floor((Date.now()-o.createdAt)/60000);
    const isDelayed = !isDone && ageMin >= (state.settings.delayWarnMinutes||15);
    const oshItems = o.items.filter(it=>getItemCategory(it)==='Ош');
    const itemsHtml = oshItems.length ? oshItems.map(it=>{
      const cat = 'Ош';
      const lineClass = 'chef-osh-line';
      const served = it.servedQty||0;
      const remaining = Math.max(0, it.qty - served);
      const servedLabel = it.unit==='kg'
        ? formatQtyLabel({name:'', unit:'kg', qty:served}).trim()
        : served+'×';
      const totalLabel = formatQtyLabel(it);
      const progressLine = `<div style="font-size:10px;color:${remaining<=0?'var(--olive)':'#9c8f78'};margin:1px 0 4px;">${remaining<=0?'✅ пурра кашида шуд':`${servedLabel||'0'} аз ${totalLabel} кашида шуд · ${it.unit==='kg'?formatQtyLabel({name:'',unit:'kg',qty:remaining}).trim():remaining+'×'} боқӣ`}</div>`;
      const controlHtml = (!isDone && remaining>0) ? (
        it.unit==='kg' ? `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <input type="number" class="kg-qty-input" id="serve-${o.id}-${it.menuId}" value="${Math.min(remaining,500)}" min="10" max="${remaining}" step="50" style="width:64px;padding:5px;border:1.5px solid var(--ink);border-radius:8px;font-family:inherit;font-size:12px;">
          <span style="font-size:11px;color:#6b5f4d;">г</span>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveitem="${o.id}|${it.menuId}">Кашидан</button>
        </div>` : `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|1">+1 кашидан</button>
          <button class="btn-ghost" style="padding:5px 10px;font-size:11px;" data-serveqty="${o.id}|${it.menuId}|${remaining}">Ҳама (${remaining}) кашидан</button>
        </div>`
      ) : '';
      return `<div class="${lineClass}">${formatQtyLabel(it)}</div>${progressLine}${controlHtml}`;
    }).join('') : `<div class="receipt-empty">холӣ</div>`;
    return `
    <div class="receipt" style="margin:0 0 14px;${isDone?'opacity:.55;':''}${isDelayed?'border-color:var(--brick);box-shadow:0 0 0 2px var(--brick);':''}">
      <div class="receipt-title" style="${isDelayed?'color:var(--brick);':''}">${escapeHtml(title)}${isDelayed?` · ⏰ ${ageMin} дақ дер`:''}</div>
      ${itemsHtml}
      <div style="margin-top:10px;">
        <button class="${isDone?'btn-ghost':'btn-primary'}" style="padding:8px 16px;font-size:12px;" data-toggleprep="${o.id}">${isDone?'Бозгашт ба навбат':'Тайёр шуд'}</button>
      </div>
    </div>`;
  };

  // Play a short alert sound when a genuinely new order enters the pending queue.
  const currentIds = pending.map(o=>o.id);
  if(state.seenPendingIds === null){
    state.seenPendingIds = new Set(currentIds); // first render: don't beep for pre-existing orders
  } else {
    const isNewArrival = currentIds.some(id=>!state.seenPendingIds.has(id));
    if(isNewArrival) playChefAlertSound();
    state.seenPendingIds = new Set(currentIds);
  }

  const adminClearControl = isRealAdmin() ? (
    state.confirmClearChefQueue ? `
    <div class="form-box" style="border-color:var(--brick);margin-bottom:14px;">
      <div style="width:100%;">
        <p style="font-size:13px;color:var(--brick);font-weight:700;margin:0 0 4px;">⚠️ Мутмаин ҳастед?</p>
        <p style="font-size:12px;color:#6b5f4d;margin:0 0 10px;">Ҳамаи чекҳои ҳозира (аз ҷумла ҳанӯз тайёрнашуда!) аз навбати ошпаз пурра нест мешаванд ва «Оши фармоишшуда» ба сифр бармегардад. Танҳо чекҳое, ки БАЪД аз ин фиристода/тағйир дода шаванд, дар навбат намоён мешаванд.</p>
        <button class="btn-pay" style="padding:8px 16px;margin-right:8px;" id="confirmClearChefQueueBtn">Ҳа, пок кун</button>
        <button class="btn-ghost" id="cancelClearChefQueueBtn">Бекор</button>
      </div>
    </div>` : `<button class="btn-ghost" style="margin-bottom:14px;color:var(--brick);border-color:var(--brick);" id="clearChefQueueBtn">🧹 Пок кардани навбати ошпаз</button>`
  ) : '';

  return `
  <div class="container">
    ${adminClearControl}
    <div class="section-title">Захираи ош — фақат шумо мебинед</div>
    <div class="stat-row">
      <div class="stat-card"><div class="label">Ош фармоишшуда (кило)</div><div class="value">${kgTotal.toFixed(2)} кг</div></div>
      ${remainingCard}
      <div class="stat-card"><div class="label">Дар навбат</div><div class="value">${pending.length}</div></div>
    </div>
    <p style="font-size:12px;color:#9c8f78;margin:-10px 0 24px;">${porsiyaTotal} порсияи оши имрӯза (ҳар як ${state.settings.porsiyaGrams||120} г — аллакай дар ҳисоби боло ҳамроҳ шудааст)</p>
    <div class="section-title">Дар навбати тайёркунӣ</div>
    ${pending.length ? pending.map(o=>renderOrderCard(o,false)).join('') : '<div class="empty-state">Ҳоло фармоише нест</div>'}
    ${done.length ? `<div class="section-title" style="margin-top:24px;">Тайёр шудаанд</div>${done.map(o=>renderOrderCard(o,true)).join('')}` : ''}
  </div>`;
}

  const clearBtn = document.getElementById('clearChefQueueBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.confirmClearChefQueue=true; render(); });
  const cancelClearBtn = document.getElementById('cancelClearChefQueueBtn');

  const mode = state.ticketMode || 'edit';
  const editable = mode === 'edit';
  const currentOrder = activeOrderForTable(state.activeTable);
  const servedInfo = (mid, qty)=>{
    const prevItem = currentOrder ? currentOrder.items.find(p=>p.menuId===mid) : null;
    const served = prevItem ? (prevItem.servedQty||0) : 0;
    if(served<=0) return '';
    const m = state.menu.find(x=>x.id===mid) || {unit:'dona'};
    const remaining = Math.max(0, qty - served);
    const servedLabel = m.unit==='kg' ? formatQtyLabel({name:'',unit:'kg',qty:served}).trim() : served+'×';

      </div>
      ${actions}
    </div>
  </div>`;
}
function attachTicketEvents(){
  const mode = state.ticketMode || 'edit';
  const overlay = document.getElementById('ticketOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeTicket(); });
  document.getElementById('closeTicket').addEventListener('click', closeTicket);
  if(mode==='edit'){
    document.querySelectorAll('.cat-tab').forEach(el=>{
      el.addEventListener('click', ()=>{ state.activeCat = el.dataset.cat; render(); });
    });
    document.querySelectorAll('[data-add]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.add, 1));
    });
    document.querySelectorAll('[data-inc]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.inc, 1));
    });
    document.querySelectorAll('[data-dec]').forEach(el=>{
      el.addEventListener('click', ()=> changeQty(el.dataset.dec, -1));
    });
    document.querySelectorAll('[data-addgrams]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const input = document.getElementById('kgin-'+el.dataset.addgrams);
        addGrams(el.dataset.addgrams, input ? input.value : 0);
      });
    });
    document.querySelectorAll('[data-editgrams]').forEach(el=>{
      el.addEventListener('change', ()=>{ setGrams(el.dataset.editgrams, el.value); });
    });
    document.querySelectorAll('[data-removeitem]').forEach(el=>{
      el.addEventListener('click', ()=> removeDraftItem(el.dataset.removeitem));
    });
    const saveBtn = document.getElementById('saveTicketBtn');
    if(saveBtn) saveBtn.addEventListener('click', ()=> saveTicket(false));
    const sendKitchenBtn = document.getElementById('sendKitchenBtn');
    if(sendKitchenBtn) sendKitchenBtn.addEventListener('click', ()=> saveTicket(true));
  } else if(mode==='pay'){
    attachSplitPaymentEvents('paytk', draftTotal(), (cash, noncash)=> payTicket(cash, noncash));
  }
}

function allKnownClients(){
  const list = [];
  state.orders.forEach(o=>{
    if(o.type==='scheduled' && (o.customerName || o.customerPhone)){
      list.push({
        key: 'sched:'+o.id, delType: 'scheduled', delId: o.id,
        name: o.customerName||'', phone: o.customerPhone||'', ts: o.createdAt,
        source: 'Фармоиши вақтдор', when: o.readyTime||'', items: o.items, total: o.total,
        statusLabel: o.status==='paid' ? '✅ гирифта шуд' : (o.table ? '🍽 ба миз гузошта шуд' : '⏳ интизор')
      });
    }
  });
  Object.keys(state.reservations||{}).forEach(tableId=>{
    const r = state.reservations[tableId];
    if(!r) return;
    const tbl = state.tables.find(t=>t.id===Number(tableId));
    list.push({
      key: 'resv:'+tableId, delType: 'reservation', delId: tableId,
      name: r.name||'', phone: r.phone||'', ts: r.bookedAt||0,
      source: 'Брони миз', when: tbl?tbl.name:('Мизи '+tableId), items: r.preOrder||[], total: (r.preOrder||[]).reduce((s,it)=>s+lineTotal(it,it.qty),0),
      statusLabel: '📅 брон фаъол'
    });
  });
  return list.sort((a,b)=>(b.ts||0)-(a.ts||0));
}
async function deleteClientRecord(delType, delId){
  if(delType==='scheduled'){
    const o = state.orders.find(x=>x.id===delId);
    state.orders = state.orders.filter(x=>x.id!==delId);
    await saveOrders(state.orders);
    await logActivity('Сабти мизоҷро нест кард: '+(o?o.customerName:delId));
  } else if(delType==='reservation'){
    const r = state.reservations[delId];
    delete state.reservations[delId];
    await saveReservations(state.reservations);
    await logActivity('Брони мизро нест кард: '+(r?r.name:delId));
  }
  showToast('Сабт нест шуд');
}

function renderSalaryXlsTable(){
  const roleLabel = {waiter:'Официант', cashier:'Кассир'};
  const commissionAccounts = state.accounts.filter(a=>a.wageType==='commission' && (a.role==='waiter'||a.role==='cashier'));
  if(!commissionAccounts.length){
    return `<p style="font-size:13px;color:#9c8f78;">Ҳанӯз ҳеҷ корманде ба навъи «Комиссия аз чек» гузошта нашудааст.</p>`;
  }
  let grandTotal = 0, grandBonus = 0;
  const rows = commissionAccounts.map(acc=>{
    const b = staffCommissionBreakdown(acc.username, acc.role, 'today');
    const auto = autoBonusToday(acc.username, acc.role);
    const manualToday = manualBonusSum(acc.username, 'today');
    const bonusTotal = auto.total + manualToday;
    grandTotal += b.total;
    grandBonus += bonusTotal;
    const bonusCell = bonusTotal>0
      ? `<span style="color:var(--olive);font-weight:700;">+${bonusTotal.toFixed(1)} ✅</span>`
      : `<span style="color:#9c8f78;">— не</span>`;
    return `
    <tr>
      <td>${escapeHtml(acc.username)} <span style="color:#9c8f78;font-weight:400;">(${roleLabel[acc.role]})</span></td>
      <td>${b.orderCount}</td>
      <td>${b.countHigh}</td>
      <td>${b.countLow}</td>
      <td>${b.countNoOsh}</td>
      <td>${b.oshSum.toFixed(1)}</td>
      <td>${b.otherSum.toFixed(1)}</td>
      <td class="total-cell">${b.total.toFixed(1)}</td>
      <td>${bonusCell}</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead>
      <tr>
        <th>Корманд</th>
        <th>Чекҳо</th>
        <th>≥500г</th>
        <th>&lt;500г</th>
        <th>Бе ош</th>
        <th>Аз ош (смн)</th>
        <th>Аз дигар (смн)</th>
        <th>Ҳамагӣ (смн)</th>
        <th>Бонуси имрӯза</th>
      </tr>
    </thead>
    <tbody>
      ${rows}
      <tr>
        <td style="font-weight:700;">Ҳамагӣ</td>
        <td></td><td></td><td></td><td></td><td></td><td></td>
        <td class="total-cell">${grandTotal.toFixed(1)}</td>
        <td class="total-cell">${grandBonus.toFixed(1)}</td>
      </tr>
    </tbody>
  </table>`;
}

function renderDailyPaymentTable(){
  const paid = state.orders.filter(o=>o.status==='paid' && o.paidAt);
  if(!paid.length) return `<p style="font-size:13px;color:#9c8f78;">Ҳанӯз ҳеҷ чек пардохт нашудааст</p>`;
  const map = {};
  paid.forEach(o=>{
    const d = new Date(o.paidAt);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(!map[key]) map[key] = {cash:0, noncash:0, unknown:0, count:0, label: d.toLocaleDateString('tg-TJ',{day:'2-digit',month:'2-digit',year:'numeric'})};
    const s = paymentSplit(o);
    map[key].cash += s.cash;
    map[key].noncash += s.noncash;
    map[key].unknown += s.unknown;
    map[key].count++;
  });
  const days = Object.keys(map).sort().reverse().slice(0,30);
  const rows = days.map(key=>{
    const d = map[key];
    const total = d.cash + d.noncash + d.unknown;
    return `
    <tr>
      <td>${d.label}</td>
      <td>${d.cash.toFixed(1)}</td>
      <td>${d.noncash.toFixed(1)}</td>
      <td>${d.unknown>0?d.unknown.toFixed(1):'—'}</td>
      <td>${d.count}</td>
      <td class="total-cell">${total.toFixed(1)}</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Сана</th><th>💵 Нақд</th><th>💳 Ғайринақд</th><th>Номаълум</th><th>Чекҳо</th><th>Ҳамагӣ</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderProductBreakdownTable(orders){
  if(!orders.length) return `<p style="font-size:13px;color:#9c8f78;">Имрӯз ҳанӯз фурӯше нашудааст</p>`;
  const map = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      if(!map[it.name]) map[it.name] = {qty:0, unit:it.unit, revenue:0};
      map[it.name].qty += it.qty;
      map[it.name].revenue += lineTotal({unit:it.unit, price:it.price}, it.qty);
    });
  });
  const list = Object.entries(map).map(([name,v])=>({name, ...v})).sort((a,b)=>b.revenue-a.revenue);
  const totalRevenue = list.reduce((s,p)=>s+p.revenue,0);
  const rows = list.map(p=>{
    const qtyLabel = p.unit==='kg'
      ? (p.qty>=1000 ? (Math.round((p.qty/1000)*100)/100)+' кг' : Math.round(p.qty)+' г')
      : p.qty+' дона';
    return `
    <tr>
      <td>${escapeHtml(p.name)}</td>
      <td>${qtyLabel}</td>
      <td class="total-cell">${p.revenue.toFixed(1)} смн</td>
    </tr>`;
  }).join('');
  return `
  <table class="xls-table">
    <thead><tr><th>Маҳсулот</th><th>Миқдор</th><th>Даромад</th></tr></thead>
    <tbody>
      ${rows}
      <tr><td style="font-weight:700;">Ҳамагӣ</td><td></td><td class="total-cell">${totalRevenue.toFixed(1)} смн</td></tr>
    </tbody>
  </table>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// Catch up on any real-time data that arrived while a field had focus: the moment focus
// leaves an input/select/textarea (and doesn't immediately land on another one), redraw once
// so the screen reflects whatever came in while it was deferred.
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(state.role && !isActivelyEditingFormField()) render();
  }, 50);
}, true);

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});

}
