<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Идораи Кафе</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0806">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Оши Форам">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --ink:#1E293B;
    --paper:#F8FAFC;
    --paper-dim:#EEF2F7;
    --card:#FFFFFF;
    --brick:#DC2626;
    --brick-dim:#B91C1C;
    --olive:#16A34A;
    --gold:#C9A227;
    --line:#E3E8EF;
    --green:#16A34A;
    --amber:#D97706;
    --white:#FFFFFF;
    --blue:#2563EB;
    --blue-dim:#1D4ED8;
    --blue-tint:#EFF4FF;
    --text-dim:#64748B;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 16px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;touch-action:pan-x pan-y;}
  input, select, textarea, button{touch-action:manipulation;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:clip;
  }
  .mono{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .display{font-family:'Inter',sans-serif;}

  #app{width:100%;max-width:1100px;margin:0 auto;padding:0 0 60px;overflow-x:clip;}

  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--blue);outline-offset:1px;
  }
  /* iOS Safari auto-zooms the whole page when a focused field's text is under 16px —
     force 16px on every field (overriding any other size, inline included) so focusing
     anything never triggers that zoom. */
  input, select, textarea{ font-size:16px !important; }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:14px 16px;border-bottom:1px solid var(--line);
    background:var(--white);position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0;flex-shrink:1;}
  .brand::before{
    content:'';width:28px;height:28px;border-radius:8px;flex:none;
    background:linear-gradient(135deg,#171310,#3A2E1F 60%,var(--gold));
    box-shadow:inset 0 0 0 1px rgba(201,162,39,.5);
  }
  .brand .name{font-family:'Inter',sans-serif;font-weight:800;font-size:16px;letter-spacing:-.2px;color:var(--ink);white-space:nowrap;overflow:visible;text-overflow:clip;max-width:150px;}
  .brand .tag{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-dim);font-weight:700;display:none;}
  @media(min-width:480px){.brand .name{max-width:none;} .brand .tag{display:inline;}}
  .top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  @media(max-width:479px){
    .user-name-label:not(.preview-label){display:none;}
    .preview-label .preview-word{display:none;}
    .top-right{gap:6px;}
    .role-pill{padding:5px 9px;font-size:11px;}
    #logoutBtn, #backToAdminBtn{padding:6px 10px;font-size:12px;}
  }
  .clock{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);display:none;}
  @media(min-width:560px){.clock{display:block;}}
  .role-pill{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;
    background:var(--blue-tint);color:var(--blue-dim);letter-spacing:.2px;
  }
  .btn-ghost{
    background:var(--white);border:1px solid var(--line);color:var(--ink);
    padding:7px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:background .15s ease,border-color .15s ease;
  }
  .btn-ghost:hover{background:var(--paper-dim);border-color:#CBD5E1;}

  /* ---------- Generic ---------- */
  .container{padding:24px 20px;}
  .section-title{
    font-family:'Inter',sans-serif;font-size:19px;font-weight:700;margin:0 0 16px;letter-spacing:-.2px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--blue);font-size:14px;font-weight:700;}

  button{cursor:pointer;}

  /* ---------- Role select ---------- */
  .role-select{
    min-height:calc(100vh - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;text-align:center;gap:26px;
  }
  .role-select h1{font-family:'Inter',sans-serif;font-size:30px;margin:0;font-weight:800;letter-spacing:-.5px;}
  .role-select p{color:var(--text-dim);margin:0;font-size:15px;}
  .role-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  .login-box{display:flex;flex-direction:column;gap:14px;width:280px;margin-top:10px;text-align:left;}
  .login-box .field label{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:4px;display:block;}
  .login-box .field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--white);}
  .login-error{color:var(--brick);font-size:13px;font-weight:600;}
  .role-card{
    width:190px;padding:26px 18px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .role-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .role-card .icon{font-size:30px;}
  .role-card .label{font-weight:700;font-size:16px;font-family:'Inter',sans-serif;}
  .role-card .desc{font-size:12px;color:var(--text-dim);}

  /* ---------- Table grid (waiter) ---------- */
  .table-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
  }
  .table-card{
    border:1px solid var(--line);border-radius:14px;padding:16px 14px;background:var(--card);
    display:flex;flex-direction:column;gap:8px;text-align:left;font-family:inherit;
    box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;
  }
  .table-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .table-card .row1{display:flex;justify-content:space-between;align-items:center;}
  .table-card .tnum{font-family:'Inter',sans-serif;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px;letter-spacing:-.2px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .dot.free{background:var(--green);}
  .dot.occupied{background:var(--amber);}
  .dot.reserved{background:var(--gold);}
  .table-card.reserved-table{border-style:dashed;border-color:var(--gold);}
  .table-card.locked-table{opacity:.55;}
  .table-card.waiter-own{border:2px solid var(--brick);background:#FEF2F2;box-shadow:0 0 0 1px rgba(220,38,38,.18),var(--shadow-sm);}
  .table-card.from-scheduled{border:2px solid var(--olive);background:#F0FDF4;}
  .order-src-badge{display:block;width:max-content;max-width:100%;margin:0 0 4px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .order-src-badge.own{background:var(--brick);color:#fff;}
  .order-src-badge.sched{background:var(--olive);color:#fff;}
  .add-btn.ta-btn{background:var(--brick);width:auto;min-width:32px;padding:0 10px;border-radius:16px;font-size:12px;white-space:nowrap;}
  .reserve-note{font-size:10px;color:#9C7A12;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
  .reserve-detail{font-size:10px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-variant-numeric:tabular-nums;}
  .table-card .status{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600;}
  .table-card .total{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:var(--ink);}

  /* ---------- Ticket / order builder ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:760px){.overlay{align-items:center;}}
  .ticket-wrap{
    background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;border:1px solid var(--line);box-shadow:0 -8px 30px rgba(15,23,42,.15);
  }
  @media(min-width:760px){.ticket-wrap{border-radius:18px;max-height:88vh;box-shadow:0 20px 60px rgba(15,23,42,.2);}}
  .ticket-head{
    display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2;
  }
  .ticket-head h2{font-family:'Inter',sans-serif;margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--text-dim);line-height:1;}

  .cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;}
  .cat-tab{
    flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--white);
    font-size:12px;font-weight:600;font-family:inherit;white-space:nowrap;color:var(--ink);
    transition:background .15s ease,color .15s ease,border-color .15s ease;
  }
  .cat-tab.active{background:var(--blue);color:var(--white);border-color:var(--blue);}

  .menu-list{padding:8px 20px 4px;display:flex;flex-direction:column;gap:8px;}
  .menu-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
  }
  .menu-row .mname{font-weight:600;font-size:14px;}
  .menu-row .mprice{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-dim);margin-top:2px;}
  .add-btn{
    background:var(--blue);color:var(--white);border:none;width:32px;height:32px;border-radius:50%;
    font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;
  }

  .receipt{
    margin:18px 20px 20px;background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 20px;
    box-shadow:var(--shadow-sm);
  }
  .receipt-title{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);text-align:center;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:10px;font-weight:700;}
  .receipt-line{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;padding:5px 0;}
  .receipt-line .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-btn{width:22px;height:22px;border:1px solid var(--line);background:var(--white);border-radius:6px;font-size:12px;line-height:1;font-family:inherit;}
  .receipt-empty{text-align:center;color:#94A3B8;font-size:13px;padding:14px 0;}
  .receipt-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;}

  .ticket-actions{display:flex;gap:10px;padding:0 20px 24px;}
  .btn-primary{
    flex:1;background:var(--blue);color:var(--white);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;transition:background .15s ease;
  }
  .btn-primary:hover:not(:disabled){background:var(--blue-dim);}
  .btn-primary:disabled{opacity:.4;}
  .btn-pay{
    flex:1;background:var(--ink);color:var(--white);border:none;border-radius:10px;padding:13px;
    font-weight:700;font-size:14px;font-family:inherit;transition:background .15s ease;
  }
  .btn-pay:hover:not(:disabled){background:#0B1220;}
  .btn-pay:disabled{opacity:.4;}

  /* ---------- Admin ---------- */
  .admin-tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--white);}
  .admin-tab{
    padding:14px 10px;background:none;border:none;font-family:'Inter',sans-serif;font-size:14px;
    font-weight:600;color:var(--text-dim);position:relative;top:1px;white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  .admin-tab.active{color:var(--blue);border-bottom:2px solid var(--blue);}

  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
  .stat-card{
    flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:var(--shadow-sm);
  }
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:700;}
  .stat-card .value{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;font-size:25px;font-weight:800;color:var(--ink);margin-top:4px;letter-spacing:-.5px;}

  .item-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  }
  .item-row .info .nm{font-weight:600;font-size:14px;}
  .item-row .info .cat{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:2px;}
  .item-row .price{font-variant-numeric:tabular-nums;font-weight:700;}
  .icon-btn{background:var(--white);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;font-size:13px;}
  .icon-btn.danger{border-color:#FECACA;color:var(--brick);background:#FEF2F2;}

  .cat-group{margin-bottom:20px;}
  .cat-group h3{font-family:'Inter',sans-serif;font-size:14px;margin:0 0 10px;color:var(--blue);font-weight:700;}

  .form-box{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;box-shadow:var(--shadow-sm);
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:700;}
  .field input, .field select{
    font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--white);
  }
  .field input{width:150px;}
  .field.small input{width:90px;}

  .receipt-item-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13px;
  }
  .receipt-item-row .l1{font-weight:600;font-family:'Inter',sans-serif;}
  .receipt-item-row .l2{color:var(--text-dim);font-size:12px;margin-top:3px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:#94A3B8;
  }
  .empty-state .big{font-size:34px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--white);
    padding:11px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:50;
    opacity:0;transition:opacity .25s ease;pointer-events:none;box-shadow:var(--shadow-md);
  }
  .toast.show{opacity:1;}

  .chef-osh-line{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding:3px 0;color:var(--ink);}
  .chef-other-line{font-size:12px;color:var(--text-dim);padding:3px 0;}
  .osh-banner{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;
    background:var(--paper-dim);border-bottom:1px solid var(--line);font-size:12px;color:var(--text-dim);
  }
  .settings-form{display:flex;flex-direction:column;gap:16px;max-width:340px;}
  .salary-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
  }
  .salary-row .salary-name{min-width:110px;}
  .salary-row .salary-name .nm{font-weight:600;font-size:14px;}
  .salary-row .salary-name .cat{font-size:11px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .salary-select{padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:12px;background:var(--white);}
  .salary-input{width:100px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13px;}
  .salary-computed{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-dim);margin-left:auto;}
  .xls-table{width:100%;max-width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums;}
  .xls-table th, .xls-table td{border:1px solid var(--line);padding:9px 10px;text-align:right;word-break:break-word;}
  .ticket-wrap{overflow-x:hidden;}
  .container, .receipt, .form-box, .stat-card, .item-row, .receipt-item-row, .menu-row{max-width:100%;overflow-x:clip;}
  .menu-row{gap:8px;}
  .menu-row > div:first-child{min-width:0;flex:1;overflow-wrap:break-word;word-break:break-word;}
  .receipt-line{flex-wrap:wrap;gap:4px 8px;max-width:100%;}
  .receipt-line > span:first-child{min-width:0;flex:1 1 120px;overflow-wrap:break-word;word-break:break-word;}
  .receipt-line .qty-ctrl{flex-wrap:wrap;max-width:100%;justify-content:flex-end;}
  .receipt-item-row > div, .item-row > div{min-width:0;max-width:100%;overflow-wrap:break-word;word-break:break-word;}
  select, input, button{max-width:100%;box-sizing:border-box;}
  @media(max-width:640px){
    .container{padding:12px 10px;}
    .topbar{padding:10px 10px;gap:6px;}
    .admin-tabs{padding:0 8px;}
    .admin-tab{padding:12px 8px;font-size:13px;}
    .table-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .table-card{min-width:0;padding:12px 10px;}
    .table-card .tnum{max-width:100%;}
    .stat-row{gap:8px;}
    .stat-card{min-width:calc(50% - 6px);padding:12px;max-width:100%;}
    .stat-card .value{font-size:19px;word-break:break-word;}
    .receipt{margin:10px 10px 14px;padding:12px;}
    .ticket-head{padding:12px 14px;}
    .ticket-actions{padding:0 10px 16px;flex-wrap:wrap;}
    .menu-list{padding:8px 10px 4px;}
    .cat-tabs{padding:10px 10px 4px;}
    .cat-tab[data-cashiertab]{flex:1 1 calc(33.33% - 6px);text-align:center;padding:8px 6px;font-size:12px;overflow:hidden;text-overflow:ellipsis;}
    .receipt-item-row, .item-row{flex-wrap:wrap;gap:8px;padding:10px 12px;}
    .salary-row{padding:10px 12px;gap:8px;}
    .salary-row .salary-computed{margin-left:0;width:100%;}
    .xls-table{display:table;width:100%;table-layout:fixed;}
    .xls-table th, .xls-table td{padding:6px 4px;font-size:11px;white-space:normal;word-break:break-word;overflow-wrap:anywhere;}
    .form-box{padding:12px;gap:8px;}
    .field{flex:1 1 130px;min-width:0;max-width:100%;}
    .field.small{flex:1 1 95px;min-width:0;}
    .field input, .field select{width:100%;max-width:100%;min-width:0;}
  }
  .xls-table th{background:var(--paper-dim);font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-dim);font-weight:700;}
  .xls-table td:first-child, .xls-table th:first-child{text-align:left;font-weight:600;}
  .xls-table tr:nth-child(even) td{background:var(--paper-dim);}
  .xls-table td.total-cell{font-weight:700;color:var(--blue);}

  .arrival-badge{display:block;width:max-content;max-width:100%;margin:0 0 7px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .arrival-badge.with-order{background:#eef5ff;color:#1f5fbf;border:1px solid #cfe0ff;}
  .arrival-badge.without-order{background:#f4f1eb;color:#6b5f4d;border:1px solid #ded7ca;}
  #oshiForamSplash{
    position:fixed;inset:0;z-index:9999;background:#000000;
    width:100vw;height:100vh;height:100dvh;overflow:hidden;

        tint: tints[Math.floor(rnd() * tints.length)],
        tw: rnd() * TAU,
        twS: 2 + rnd() * 4,
        tA: orbit ? (i / CFG.orbitDots) * TAU : 0,
        rj: rnd() * TAU
      });
    }
    return list;
  }

  function makeLayer(px) {
    const c = document.createElement('canvas');
    c.width = c.height = px;
    return c;
  }

  function buildLayers() {
    const px = Math.max(2, Math.round(2 * V.R * V.dpr));
    V.px = px;
    layers.orn = makeLayer(px);
    layers.band = makeLayer(px);
    layers.tmp = makeLayer(px);
    if (!imgOk) return;

    const k = px / CFG.emblemPx;
    const y0 = Math.round(CFG.bandTop * k);
    const y1 = Math.round(CFG.bandBottom * k);

    const o = layers.orn.getContext('2d');
    o.imageSmoothingQuality = 'high';
    o.drawImage(img, 0, 0, px, px);
    o.clearRect(0, y0, px, y1 - y0);

    const b = layers.band.getContext('2d');
    b.imageSmoothingQuality = 'high';
    b.drawImage(img, 0, 0, px, px);
    b.clearRect(0, 0, px, y0);
    b.clearRect(0, y1, px, px - y1);
  }

  function layout() {
    V.dpr = Math.min(window.devicePixelRatio || 1, CFG.maxDpr);
    V.w = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
    V.h = Math.max(1, Math.round(canvas.clientHeight || window.innerHeight));
    canvas.width = Math.round(V.w * V.dpr);
    canvas.height = Math.round(V.h * V.dpr);

    const sa = readSafeArea();
    const aw = V.w - sa.l - sa.r;
    const ah = V.h - sa.t - sa.b;
    V.R = Math.max(40, Math.min(aw * 0.40, ah * 0.32, 240));
    V.cx = sa.l + aw / 2;
    V.cy = sa.t + ah / 2;
    V.k = clamp(V.R / 190, 0.8, 1.35);
    buildLayers();
  }

  function drawAura(T) {
    let amt = 0.18 * easeOut(phase(T, 2.3, 3.2)) + 0.82 * easeInOut(phase(T, 5, 6));
    amt *= 0.93 + 0.07 * Math.sin(T * 2.2);
    if (amt < 0.003) return;
    const { cx, cy, R } = V;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    const g = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 1.95);
    g.addColorStop(0, `rgba(226,177,73,${0.30 * amt})`);
    g.addColorStop(0.35, `rgba(200,147,48,${0.13 * amt})`);
    g.addColorStop(0.7, `rgba(158,110,30,${0.04 * amt})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.95, 0, TAU);
    ctx.fill();
  }

  function drawSpark(T) {
    const a = easeOut(phase(T, 0, 0.4)) * (1 - easeInOut(phase(T, 1.9, 2.6)));
    if (a <= 0.002) return;
    const { cx, cy, R } = V;
    const r = R * (0.15 + 0.025 * Math.sin(T * 8)) * (1 + 0.6 * easeOut(phase(T, 0, 1)));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.2);
    g.addColorStop(0, 'rgba(255,246,220,1)');
    g.addColorStop(0.12, 'rgba(255,230,153,0.95)');
    g.addColorStop(0.35, 'rgba(226,177,73,0.45)');
    g.addColorStop(1, 'rgba(158,110,30,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.2, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(T * 0.5);
    const len = R * 0.34 * (0.5 + 0.5 * easeOut(phase(T, 0, 0.9)));
    const rg = ctx.createLinearGradient(0, 0, len, 0);
    rg.addColorStop(0, 'rgba(255,230,153,0.6)');
    rg.addColorStop(1, 'rgba(255,230,153,0)');
    ctx.fillStyle = rg;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.fillRect(0, -0.75, len, 1.5);
    }
    ctx.restore();
  }

  const RIBBON_RGB = ['226,177,73', '246,216,126', '200,147,48'];
  function drawRibbons(T) {
    const vis = easeOut(phase(T, 0.9, 1.5)) * (1 - easeInOut(phase(T, 2.3, 3.1)));
    if (vis <= 0.002) return;
    const { cx, cy, R } = V;
    const grow = Math.max(0.03, easeInOut(phase(T, 0.9, 2.0)));
    const contract = easeInOut(phase(T, 2, 3));
    const scale = lerp(1.25, 0.99, contract);
    const spin = T * (0.9 + 1.6 * contract);
    const M = 64;

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    for (let k = 0; k < 3; k++) {
      const base = (k * TAU) / 3;
      const dir = k === 1 ? -1 : 1;
      const outer = [];
      const inner = [];
      for (let i = 0; i <= M; i++) {
        const u = i / M;
        const rho = R * scale * (0.05 + 0.95 * u * grow);
        const th = base + dir * (1.35 * TAU * u * grow) + dir * spin;
        const wd = 0.2 * Math.pow(Math.sin(Math.PI * u), 0.7);
        outer.push([cx + Math.cos(th) * rho, cy + Math.sin(th) * rho]);
        inner.push([cx + Math.cos(th + wd) * rho, cy + Math.sin(th + wd) * rho]);
      }
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.moveTo(outer[0][0], outer[0][1]);
      for (let i = 1; i <= M; i++) ctx.lineTo(outer[i][0], outer[i][1]);
      for (let i = M; i >= 0; i--) ctx.lineTo(inner[i][0], inner[i][1]);
      ctx.closePath();
      ctx.fillStyle = `rgba(${RIBBON_RGB[k]},${0.15 * vis})`;
      ctx.fill();

      ctx.lineWidth = 1.2;
      ctx.strokeStyle = `rgba(246,216,126,${0.7 * vis})`;
      ctx.beginPath();
      ctx.moveTo(outer[0][0], outer[0][1]);
      for (let i = 1; i <= M; i++) ctx.lineTo(outer[i][0], outer[i][1]);
      ctx.stroke();

      ctx.lineWidth = 0.8;
      ctx.strokeStyle = `rgba(200,147,48,${0.4 * vis})`;
      ctx.beginPath();
      ctx.moveTo(inner[0][0], inner[0][1]);
      for (let i = 1; i <= M; i++) ctx.lineTo(inner[i][0], inner[i][1]);
      ctx.stroke();
    }
  }

  const RINGS = [
    { f: 0.50, n: 10, fill: 0.62, w:  1.0, lw: 3.2, rgb: '246,216,126' },
    { f: 0.74, n: 16, fill: 0.55, w: -0.8, lw: 2.2, rgb: '226,177,73' },
    { f: 0.95, n: 28, fill: 0.50, w:  0.6, lw: 1.6, rgb: '200,147,48' }
  ];
  function drawArcs(T) {
    const vis = easeOut(phase(T, 1, 1.55)) * (1 - easeInOut(phase(T, 2.5, 3.2)));
    if (vis <= 0.002) return;
    const { cx, cy, R, k } = V;
    const conv = easeInOut(phase(T, 2, 2.9));
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    RINGS.forEach((ring, i) => {
      const r = lerp(ring.f * R, R * 1.012, conv);
      const rot = T * ring.w * (1 + conv * 0.6);
      const seg = TAU / ring.n;
      const len = seg * ring.fill * easeOut(phase(T, 1 + i * 0.12, 1.7 + i * 0.12)) * (1 - 0.35 * conv);
      ctx.lineWidth = ring.lw * k * (1 - 0.5 * conv);
      ctx.strokeStyle = `rgba(${ring.rgb},${0.85 * vis})`;
      ctx.beginPath();
      for (let j = 0; j < ring.n; j++) {
        const a = rot + j * seg;
        ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        ctx.arc(cx, cy, r, a, a + len);
      }
      ctx.stroke();
    });
    ctx.lineCap = 'butt';
  }

  function drawParticles(T) {
    const { cx, cy, R, k } = V;
    const c = easeInOut(phase(T, 2, 3));
    const dustFade = 1 - easeOut(phase(T, 2.55, 3.25));
    const settleDim = lerp(1, 0.62, phase(T, 3, 6));
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const age = T - p.birth;
      if (age <= 0) continue;
      if (!p.orbit && dustFade <= 0.002) continue;

      const q = easeOut(clamp(age / 1.7));
      const rFree = lerp(0.02, p.rf, q) * R;
      const aFree = p.a0 + p.w * T * (0.6 + 0.8 * q);

      let rT, a;
      if (p.orbit) {
        rT = R * 1.09;
        const aT = p.tA + CFG.orbitSpeed * T;
        a = aT + (1 - c) * wrapPi(aFree - aT);
      } else {
        rT = R * (0.98 + 0.04 * Math.sin(p.rj));
        a = aFree + c * p.w * 0.6;
      }
      const r = lerp(rFree, rT, c);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;

      let alpha = clamp(age / 0.5) * (0.72 + 0.28 * Math.sin(T * p.twS + p.tw));
      alpha *= p.orbit ? settleDim : dustFade;
      if (alpha <= 0.004) continue;

      const sz = p.size * 2.6 * k;
      ctx.globalAlpha = clamp(alpha * 0.95);
      ctx.drawImage(sprites[p.tint], x - sz, y - sz, sz * 2, sz * 2);
    }
  }

  function drawDisc(T) {
    const a = easeInOut(phase(T, 2.15, 3));
    if (a <= 0.002) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(V.cx, V.cy, V.R * 1.002, 0, TAU);
    ctx.fill();
  }

  function drawOrnaments(T) {
    const p = phase(T, 3, 4);
    if (p <= 0 || !imgOk) return;
    const { cx, cy, R, px } = V;
    const alpha = easeOut(phase(T, 3, 3.4));
    let source = layers.orn;

    if (p < 1) {
      const e = easeInOut(p);
      const t = layers.tmp.getContext('2d');
      t.setTransform(1, 0, 0, 1, 0, 0);
      t.globalCompositeOperation = 'source-over';
      t.globalAlpha = 1;
      t.clearRect(0, 0, px, px);
      t.drawImage(layers.orn, 0, 0);

      const rc = px / 2;
      const rv = e * 1.14 * rc;
      const rf = 0.3 * rc;
      const g = t.createRadialGradient(rc, rc, Math.max(0, rv - rf), rc, rc, rv + 0.001);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      t.globalCompositeOperation = 'destination-in';
      t.fillStyle = g;
      t.fillRect(0, 0, px, px);
      t.globalCompositeOperation = 'source-over';
      source = layers.tmp;

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.clip();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 * Math.sin(Math.PI * e);
      ctx.lineWidth = 2 * V.k;
      ctx.strokeStyle = 'rgba(255,230,153,1)';
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(1, rv / V.dpr * 0.96), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    ctx.drawImage(source, cx - R, cy - R, 2 * R, 2 * R);
  }

  function drawBand(T) {
    const p = phase(T, 4, 4.85);
    if (p <= 0 || !imgOk) return;
    const { cx, cy, R, px } = V;
    const alpha = easeOut(phase(T, 4, 4.35));
    let source = layers.band;

    if (p < 1) {
      const e = easeInOut(p);
      const t = layers.tmp.getContext('2d');
      t.setTransform(1, 0, 0, 1, 0, 0);
      t.globalCompositeOperation = 'source-over';
      t.globalAlpha = 1;
      t.clearRect(0, 0, px, px);
      t.drawImage(layers.band, 0, 0);

      const rc = px / 2;
      const half = e * 1.06 * rc;
      const f = 0.22 * rc;
      const x0 = rc - half - f;
      const x1 = rc + half + f;
      const s = f / (x1 - x0);
      const g = t.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(s, 'rgba(0,0,0,1)');
      g.addColorStop(1 - s, 'rgba(0,0,0,1)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      t.globalCompositeOperation = 'destination-in';
      t.fillStyle = g;
      t.fillRect(0, 0, px, px);
      t.globalCompositeOperation = 'source-over';
      source = layers.tmp;
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha;
    ctx.drawImage(source, cx - R, cy - R, 2 * R, 2 * R);
  }

  function drawBandSweep(T) {
    const u = phase(T, 4.3, 5.25);
    if (u <= 0 || u >= 1) return;
    const { cx, cy, R } = V;
    const e = easeInOut(u);
    const top = cy - R + (CFG.bandTop / CFG.emblemPx) * 2 * R;
    const bot = cy - R + (CFG.bandBottom / CFG.emblemPx) * 2 * R;
    const x = lerp(cx - R * 1.15, cx + R * 1.15, e);
    const w = R * 0.42;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.clip();
    ctx.beginPath();
    ctx.rect(cx - R, top, 2 * R, bot - top);
    ctx.clip();
    ctx.globalCompositeOperation = 'color-dodge';
    ctx.globalAlpha = Math.sin(Math.PI * e) * 0.75;
    ctx.translate(x, cy);
    ctx.transform(1, 0, -0.45, 1, 0, 0);
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, 'rgba(255,214,120,0)');
    g.addColorStop(0.45, 'rgba(255,214,120,0.55)');
    g.addColorStop(0.5, 'rgba(255,236,170,0.95)');
    g.addColorStop(0.55, 'rgba(255,214,120,0.55)');
    g.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-w, -R, 2 * w, 2 * R);
    ctx.restore();
  }

  function drawRim(T) {
    const prog = easeInOut(phase(T, 2, 3));
    if (prog <= 0.001) return;
    const { cx, cy, R, dpr } = V;
    const lw = Math.max(2, R * 0.016);
    const rr = R + lw * 0.5;

    let stroke;
    if (ctx.createConicGradient) {
      stroke = ctx.createConicGradient(-Math.PI / 2 + T * 0.35, cx, cy);
      [[0, '#9e6e1e'], [0.12, '#e2b149'], [0.24, '#ffe699'], [0.38, '#c89330'],
       [0.52, '#9e6e1e'], [0.68, '#e2b149'], [0.8, '#f6d87e'], [1, '#9e6e1e']]
        .forEach(([o, c]) => stroke.addColorStop(o, c));
    } else {
      stroke = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
      [[0, '#9e6e1e'], [0.3, '#ffe699'], [0.55, '#c89330'], [0.8, '#f6d87e'], [1, '#9e6e1e']]
        .forEach(([o, c]) => stroke.addColorStop(o, c));
    }

    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.lineWidth = lw;
    ctx.strokeStyle = stroke;
    ctx.shadowColor = 'rgba(226,177,73,0.55)';
    ctx.shadowBlur = 10 * dpr;
    ctx.beginPath();
    ctx.arc(cx, cy, rr, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
    ctx.stroke();
    ctx.restore();

    const hair = easeOut(phase(T, 2.4, 3.2));
    if (hair > 0.002) {
      ctx.globalAlpha = 0.5 * hair;
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(226,177,73,1)';
      ctx.beginPath();
      ctx.arc(cx, cy, R + lw * 2.1, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function drawReflection(T) {
    const sweep = phase(T, 5, 6);
    const stat = easeOut(phase(T, 5.5, 6)) * 0.22;
    if (sweep <= 0) return;
    const { cx, cy, R } = V;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.clip();
    ctx.globalCompositeOperation = 'color-dodge';
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI / 5.2);

    const strip = (x, w, alpha) => {
      if (alpha <= 0.002) return;
      const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
      g.addColorStop(0, 'rgba(255,214,120,0)');
      g.addColorStop(0.5, 'rgba(255,230,153,1)');
      g.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.globalAlpha = alpha;
      ctx.fillStyle = g;
      ctx.fillRect(x - w, -2 * R, 2 * w, 4 * R);
    };

    if (sweep < 1) {
      const e = easeInOut(sweep);
      strip(lerp(-1.3 * R, 1.3 * R, e), R * 0.5, Math.sin(Math.PI * e) * 0.6);
    }
    strip(-0.42 * R, R * 0.55, stat);
    ctx.restore();
  }

  function renderFrame(T) {
    const { w, h, dpr, cx, cy } = V;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';

    drawAura(T);
    drawSpark(T);
    drawRibbons(T);
    drawArcs(T);
    drawParticles(T);

    const s = 1 + 0.02 * (1 - easeOut(phase(T, 3, 6)));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.translate(-cx, -cy);
    drawDisc(T);
    if (T >= 4.85 && imgOk) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(img, cx - V.R, cy - V.R, 2 * V.R, 2 * V.R);
    } else {
      drawOrnaments(T);
      drawBand(T);
    }
    drawBandSweep(T);
    drawRim(T);
    drawReflection(T);
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  let lastExitKey = '';
  function applyExit(T, fadeIn) {
    const e = easeInOut(phase(T, 6, 6.5));
    const key = e.toFixed(4) + '|' + fadeIn.toFixed(3);
    if (key === lastExitKey) return;
    lastExitKey = key;
    canvas.style.opacity = String(Math.min(1 - e, fadeIn));
    canvas.style.transform = e > 0 ? `scale(${(1 - 0.035 * e).toFixed(4)})` : 'none';
  }

  let completed = false;
  function finishSplash() {
    if (completed) return;
    completed = true;
    window.removeEventListener('resize', onResize);
    window.removeEventListener('orientationchange', onResize);
    if (splashWrap && splashWrap.parentNode) {
      splashWrap.style.opacity = '0';
      splashWrap.style.pointerEvents = 'none';
      setTimeout(() => {
        try { if (splashWrap.parentNode) splashWrap.parentNode.removeChild(splashWrap); } catch (e) {}
        try { if (probe.parentNode) probe.parentNode.removeChild(probe); } catch (e) {}
      }, 360);
    }
  }

  let raf = 0;
  let t = 0;
  let last = 0;
  let reduced = false;

  const total = () => (reduced ? CFG.reducedDuration : CFG.duration);
  const sceneTime = (time) => {
    if (!reduced) return time;
    return time < CFG.reducedHold ? 5.999 : 6 + (time - CFG.reducedHold);
  };
  const fadeInAt = (time) => (reduced ? clamp(time / 0.5) : 1);

  function draw(time) {
    const T = sceneTime(time);
    renderFrame(T);
    applyExit(T, fadeInAt(time));
  }

  function loop(now) {
    if (!last) last = now;
    const dt = Math.min(Math.max((now - last) / 1000, 0), CFG.maxDt);
    last = now;
    const holdPoint = reduced ? CFG.reducedHold : 5.98;
    // Hold at the completed emblem if Firebase data is still loading
    if (!window.__appDataLoaded && t + dt >= holdPoint) {
      t = holdPoint;
    } else {
      t = Math.min(t + dt, total());
    }
    draw(t);
    if (t >= total() && window.__appDataLoaded) {
      raf = 0;
      finishSplash();
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  function start() {
    cancelAnimationFrame(raf);
    reduced = !!(motionQuery && motionQuery.matches);
    particles = makeParticles();
    t = 0;
    last = 0;
    completed = false;
    lastExitKey = '';
    canvas.style.opacity = reduced ? '0' : '1';
    canvas.style.transform = 'none';
    draw(0);
    raf = requestAnimationFrame(loop);
  }

  let resizeRaf = 0;
  function onResize() {
    if (completed) return;
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      layout();
      lastExitKey = '';
      draw(t);
    });
  }

  sprites = CFG.rgb.map(makeSprite);
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);

  loadEmblem().then(() => {
    layout();
    start();
  });
})();
</script>

function docRef(key){
  return CAFE_ID
    ? db.collection('cafes').doc(CAFE_ID).collection('data').doc(key)
    : db.collection('cafeData').doc(key);
}
function ordersCollectionRef(){
  return CAFE_ID
    ? db.collection('cafes').doc(CAFE_ID).collection('orders')
    : db.collection('cafeData').doc('orderItems').collection('items');
}
function orderDocRef(orderId){ return ordersCollectionRef().doc(String(orderId)); }
const ORDER_MIGRATION_KEY='orders_v2_'+(CAFE_ID||'default');
async function migrateOrdersToV2(){
  if(!db) return false;
  try{
    // Migration state is local to this browser. We intentionally do not use
    // a separate Firestore marker collection, so opening the app does not
    // require any extra Firestore permission just for migration bookkeeping.
    const localMarker = 'orders_v2_migrated_' + (CAFE_ID || 'default');
    try{
      if(localStorage.getItem(localMarker)==='1') return true;
    }catch(e){}
    const legacy=await fsGet('orders');
    if(!legacy.ok){
      // If V2 already contains orders, do not block the application because
      // the legacy backup is unavailable (for example after security rules
      // were tightened). Mark migration complete without deleting V2.
      try{
        const existing = await ordersCollectionRef().limit(1).get();
        if(!existing.empty){
          try{localStorage.setItem(localMarker,'1');}catch(e){}
          return true;
        }
      }catch(e){}
      return false;
    }
    let orders=[]; try{orders=legacy.value?JSON.parse(legacy.value):[];}catch(e){}
    if(!Array.isArray(orders)) orders=[];
    for(let i=0;i<orders.length;i+=400){
      const batch=db.batch(), chunk=orders.slice(i,i+400);
      chunk.forEach(o=>{if(o&&o.id) batch.set(orderDocRef(o.id),{...o,_migratedAt:Date.now()},{merge:true});});
      if(chunk.length) await batch.commit();
    }
    try{localStorage.setItem(localMarker,'1');}catch(e){}
    return true;
  }catch(e){console.error('Orders V2 migration failed',e);return false;}
}

    snap.forEach(d=>{const x=d.data()||{};delete x._migratedAt;if(x.status==='paid')orders.push({...x,id:x.id||d.id});});

function mergeActiveOrdersIntoState(activeOrders){
  const nonActive=(state.orders||[]).filter(o=>o.status!=='active');
  const byId=new Map(nonActive.map(o=>[String(o.id),o]));
  (activeOrders||[]).forEach(o=>byId.set(String(o.id),o));
  state.orders=Array.from(byId.values()).sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));
  state.__lastKnownOrderIds=new Set(state.orders.map(o=>o.id));
  if(state.role==='waiter'){
    checkAndTriggerWaiterCallAlerts();
  }
}
function mergePaidOrdersIntoState(paidOrders, sinceTs){
  const cutoff = Math.max(0, Number(sinceTs)||0);
  const keep=(state.orders||[]).filter(o=>o.status==='active' || (o.status==='paid' && cutoff>0 && Number(o.paidAt||o.createdAt||0)<cutoff));
  const byId=new Map(keep.map(o=>[String(o.id),o]));
  (paidOrders||[]).forEach(o=>byId.set(String(o.id),o));
  state.orders=Array.from(byId.values()).sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));
  state.__lastKnownOrderIds=new Set(state.orders.map(o=>o.id));
}
async function ensurePaidOrdersLoaded(scope){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayMs = todayStart.getTime();
  const repStart = reportPeriodStart();
  let start = todayMs;
  if(scope==='month'){
    const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime();
    const salReset = salaryMonthResetAt();
    start = salReset > 0 ? Math.max(monthStart, salReset) : monthStart;
  } else if(scope==='report'){
    start = repStart > 0 ? repStart : todayMs;
  } else {
    // 'today' scope: only today's paid orders (never accumulates past days!)
    start = repStart > todayMs ? repStart : todayMs;
  }
  const startNum = Math.max(todayMs - 31*24*3600*1000, Number(start)||todayMs);
  const key = String(startNum);
  if(state.__paidOrdersLoadedSince!==null && state.__paidOrdersLoadedSince!==undefined && Number(state.__paidOrdersLoadedSince)<=startNum) return true;
  if(state.__dataLoadPromises.paid) return await state.__dataLoadPromises.paid;
  state.__dataLoadPromises.paid = new Promise((resolve)=>{
    if(state.__paidOrdersUnsub){try{state.__paidOrdersUnsub();}catch(e){}}
    let firstResolved = false;
    try{
      state.__paidOrdersUnsub = ordersCollectionRef().where('paidAt','>=',startNum).onSnapshot(snap=>{
        const paid=[];
        snap.forEach(d=>{const x=d.data()||{};delete x._migratedAt;if(x.status==='paid')paid.push({...x,id:x.id||d.id});});
        mergePaidOrdersIntoState(paid, startNum);
        state.__paidOrdersLoadedSince = key;
        if(!firstResolved){ firstResolved = true; resolve(true); }
        if(state.role && state.activeTable===null && !state.scheduledOpen && !state.takeawayOpen && !state.viewingOrderId && !isActivelyEditingFormField()) render();
      },err=>{
        console.error('Paid orders realtime error',err);
        if(!firstResolved){ firstResolved = true; resolve(false); }
      });
    }catch(e){
      console.error('Paid orders listener attach failed',e);
      if(!firstResolved){ firstResolved = true; resolve(false); }
    }
  });
  try{return await state.__dataLoadPromises.paid;}finally{delete state.__dataLoadPromises.paid;}
}
async function ensureScheduledOrdersLoaded(){

}

function stripUndefinedDeep(v){
  if(Array.isArray(v)) return v.map(stripUndefinedDeep);
  if(v && typeof v==='object' && Object.getPrototypeOf(v)===Object.prototype){
    const out={};
    Object.keys(v).forEach(k=>{ if(v[k]!==undefined) out[k]=stripUndefinedDeep(v[k]); });
    return out;
  }
  return v;
}
async function saveOrderV2(order){
  if(!db || !order || !order.id) return false;
  const ref=orderDocRef(order.id);
  const clean=stripUndefinedDeep({...order});
  delete clean._migratedAt;
  clean.updatedAt=Date.now();

  // Write directly. Do not require a preliminary server read: a temporary
  // read failure must never make the Save button appear to do nothing.
  // Payment itself remains protected by commitPaidOrderAtomic().
  for(let attempt=0;attempt<3;attempt++){
    try{
      await ref.set(clean,{merge:true});
      return true;
    }catch(e){
      const code=e && e.code ? String(e.code) : '';
      if(code==='failed-precondition' || code==='aborted' || code==='unavailable' || code==='deadline-exceeded' || code==='resource-exhausted'){
        await new Promise(r=>setTimeout(r,300*(attempt+1)));
        continue;
      }
      console.error('saveOrderV2 failed',e);
      return false;
    }
  }
  console.error('saveOrderV2 failed after retries');
  return false;
}

async function deleteOldOrders(){
  if(!db) return {ok:false, deleted:0};
  try{
    const snap = await ordersCollectionRef().get();
    const todayStart = new Date(); todayStart.setHours(0,0,0,0);
    const cutoff = todayStart.getTime();
    const toDeleteRefs = [];
    const deletedIds = [];
    snap.forEach(d=>{
      const data = d.data()||{};
      const createdAt = Number(data.createdAt)||0;
      // Имрӯзаро ва фармоишҳои ҳанӯз фаъол (пардохтнашуда)-ро ҳеҷ гоҳ нест намекунем — танҳо
      // чекҳои рӯзҳои гузашта, ки аллакай пӯшида шудаанд.
      if(createdAt < cutoff && data.status !== 'active'){
        toDeleteRefs.push(d.ref);
        deletedIds.push(d.id);
      }
    });
    for(let i=0;i<toDeleteRefs.length;i+=400){
      const batch = db.batch();
      toDeleteRefs.slice(i,i+400).forEach(ref=>batch.delete(ref));
      await batch.commit();
    }
    if(deletedIds.length){
      const removed=new Set(deletedIds.map(String));
      state.orders=(state.orders||[]).filter(o=>!removed.has(String(o.id)));
      state.__lastKnownOrderIds=new Set((state.orders||[]).map(o=>o.id));
    }
    return {ok:true, deleted:deletedIds.length};
  }catch(e){
    console.error('deleteOldOrders failed', e);
    return {ok:false, deleted:0};
  }
}
async function reconcileOrdersV2(orders){
  if(!db || !Array.isArray(orders)) return false;
  try{
    const keep = new Set(orders.filter(o=>o&&o.id).map(o=>String(o.id)));
    const snap = await ordersCollectionRef().get();
    const batch = db.batch();
    let deletes = 0;
    snap.forEach(d=>{
      if(!keep.has(String(d.id))){
        batch.delete(d.ref);
        deletes++;
      }
    });
    if(deletes) await batch.commit();
    return true;
  }catch(e){
    console.error('reconcileOrdersV2 failed',e);
    return false;
  }
}
async function saveOrdersV2(orders){
  if(!Array.isArray(orders))return false;
  for(const o of orders){
    if(o&&o.id&&!await saveOrderV2(o))return false;
  }
  return true;
}

// Returns {ok, value}. ok=true means the read genuinely succeeded — value is either the
// stored data or null if the document truly does not exist yet. ok=false means the read
// FAILED (network blip, etc.) — callers must NOT treat this as "empty" or they will
// overwrite real data with defaults. This distinction is critical: a transient failure
// must never be allowed to look like "this is a brand new café".
async function fsGet(key){
  try{
    const snap = await docRef(key).get();
    return {ok:true, value: snap.exists ? snap.data().value : null};
  }catch(e){ console.error('fsGet failed', key, e); return {ok:false, value:null}; }
}
async function fsSet(key, value){
  try{
    await docRef(key).set({value, updatedAt: Date.now()});
    return true;
  }catch(e){ console.error('fsSet failed', key, e); return false; }
}

async function loadAll(){
  // Orders are intentionally excluded here. They live in the V2 subcollection
  // cafes/{cafeId}/orders/{orderId} and are loaded by loadOrdersV2().
  const out = {menu:null, settings:null, reservations:null, tables:null, oshStock:null, accounts:null, inventory:null, activityLog:null, bonuses:null, expenses:null, technicalStaff:null, dailySalaryLedger:null, failed:{}};
  const parseField = async (key, outKey)=>{
    const r = await fsGet(key);
    if(!r.ok){ out.failed[outKey] = true; return; }
    try{ out[outKey] = r.value ? JSON.parse(r.value) : null; }
    catch(e){ out.failed[outKey] = true; }
  };
  await Promise.all([
    parseField('menu', 'menu'),
    parseField('settings', 'settings'),
    parseField('reservations', 'reservations'),
    parseField('tables', 'tables'),
    parseField('oshStock', 'oshStock'),
    parseField('accounts', 'accounts'),
    parseField('inventory', 'inventory'),
    parseField('activityLog', 'activityLog'),
    parseField('bonuses', 'bonuses'),
    parseField('expenses', 'expenses'),
    parseField('technicalStaff', 'technicalStaff'),
    parseField('dailySalaryLedger', 'dailySalaryLedger')
  ]);
  return out;
}

// Orders are the field most likely to be touched by two different staff at nearly the same
// instant (a waiter sending a new table while a cashier pays another one). A plain "read once,
// write the whole array back" — which is what every other saveX function still does — has a
// real window where the second write can silently erase whatever the first one just added,
// since neither device's copy of the array knows about the other's change yet. A transaction
// re-reads the live array at the moment of writing and unions in any order (by id) that exists
// remotely but that this device has never seen before — e.g. one another device just created
// — so a concurrent save can never make it vanish. state.__lastKnownOrderIds tracks which
// order ids this device already knew about, so a remote order that WAS known and is simply
// missing from our new array (because we intentionally deleted/cancelled it) is correctly
// left deleted rather than resurrected. This does not fully resolve two devices editing the
// very same order at once (that still keeps whichever write lands last for that one record),
// but it protects the far more common case: an entirely different order disappearing.
async function saveOrders(orders){
  if(!db){showToast('Хатогӣ дар нигоҳдорӣ');return false;}
  const list = Array.isArray(orders) ? orders : [];
  const previous = state.__lastKnownOrderIds || new Set();
  const current = new Set(list.filter(o=>o&&o.id).map(o=>String(o.id)));

  // Save/update every current order first.
  const ok = await saveOrdersV2(list);
  if(!ok){showToast('Хатогӣ дар нигоҳдорӣ');return false;}

  // Only delete documents that THIS device previously knew about and that the
  // user intentionally removed from its local state. Never sweep unknown remote
  // orders here, because another device may have just created them.
  for(const id of previous){
    if(!current.has(String(id))){
      const deleted = await deleteOrderV2(id);
      if(!deleted){
        console.warn('Could not delete order document',id);
      }
    }
  }
  state.__lastKnownOrderIds = new Set(list.map(o=>o.id));
  state.__lastKnownOrderSnapshots = new Map(list.map(o=>[o.id, JSON.parse(JSON.stringify(o))]));
  return true;
}

async function saveTables(tables){
  if(!db){showToast('Хатогӣ дар нигоҳдорӣ');return false;}
  try{
    const ref=docRef('tables');
    await db.runTransaction(async tx=>{
      const snap=await tx.get(ref);
      let remote=[];
      if(snap.exists){
        try{remote=JSON.parse(snap.data().value)||[];}catch(e){remote=[];}
      }
      const local=Array.isArray(tables)?tables:[];
      const byId=new Map(remote.filter(x=>x&&x.id!=null).map(x=>[String(x.id),x]));
      local.forEach(x=>{if(x&&x.id!=null) byId.set(String(x.id),x);});
      const merged=Array.from(byId.values());
      tx.set(ref,{value:JSON.stringify(merged),updatedAt:Date.now()});
      state.tables=merged;
    });
    return true;
  }catch(e){
    console.error('saveTables transaction failed',e);
    showToast('Мизҳо нигоҳ дошта нашуданд');
    return false;
  }
}

// Inventory quantities are touched by nearly every order (auto-deducted on send, restored on
// cancel) plus manual admin adjustments — the single most frequent source of two staff writing
// at nearly the same instant. Unlike orders (whole records appearing/disappearing), inventory
// changes are almost always DELTAS (subtract this recipe's usage, add this much stock back).
// Applying deltas inside a transaction — read the live quantity, adjust it, write it back — is
// safe no matter how many devices do this to the same or different items at once, since each
// transaction always starts from the freshest remote value rather than a snapshot that might
// already be stale by the time the write lands.
async function applyInventoryDeltas(deltaMap){
  const invIds = Object.keys(deltaMap).filter(id=>deltaMap[id]);
  if(!invIds.length) return true;
  if(!db){ showToast('Хатогӣ дар нигоҳдорӣ'); return false; }
  try{
    await db.runTransaction(async (tx)=>{
      const ref = docRef('inventory');
      const snap = await tx.get(ref);
      let remote = [];
      if(snap.exists){
        try{ remote = JSON.parse(snap.data().value) || []; }catch(e){ remote = []; }
      }
      invIds.forEach(invId=>{
        const item = remote.find(i=>i.id===invId);
        if(item){
          item.qty = Math.max(0, (Number(item.qty)||0) + deltaMap[invId]);
          item.updatedAt = Date.now();
        }
      });
      tx.set(ref, { value: JSON.stringify(remote) });
      state.inventory = remote;
    });
    return true;
  }catch(e){
    console.error('applyInventoryDeltas transaction failed', e);
    showToast('Хатогӣ дар нигоҳдории анбор');
    return false;
  }
}

let __logFlushTimer = null;
async function logActivity(actionText){
  state.activityLog = state.activityLog || [];
  state.activityLog.unshift({ts: Date.now(), user: actingUsername()||'?', action: actionText});
  if(state.activityLog.length > 200) state.activityLog = state.activityLog.slice(0, 200);
  // Debounce: flush at most once every 5 seconds to avoid a write per action.
  clearTimeout(__logFlushTimer);
  __logFlushTimer = setTimeout(()=> saveActivityLog(state.activityLog), 20000);
}

function shiftTimeMinutes(value){
  const m=/^(\d{2}):(\d{2})$/.exec(String(value||''));
  return m ? Number(m[1])*60+Number(m[2]) : 0;
}
function shiftConfig(shift){
  const x=state.settings||{};
  return shift===1
    ? {start:x.shift1Start||'09:00',end:x.shift1End||'17:30'}
    : {start:x.shift2Start||'17:30',end:x.shift2End||'00:00'};
}
function shiftLabel(shift){const c=shiftConfig(shift);return c.start+'–'+c.end;}
function shiftForTimestamp(ts){
  const d=new Date(ts), mins=d.getHours()*60+d.getMinutes();
  for(let i=1;i<=2;i++){
    const c=shiftConfig(i),a=shiftTimeMinutes(c.start),b=shiftTimeMinutes(c.end);
    if(a===b) continue;
    if((a<b && mins>=a && mins<b) || (a>b && (mins>=a || mins<b))) return i;
  }
  const s1End = shiftTimeMinutes(shiftConfig(1).end) || (17*60+30);
  return mins < s1End ? 1 : 2;
}
function currentShift(){return shiftForTimestamp(Date.now());}
function isShift1(ts){return shiftForTimestamp(ts)===1;}
function isShift2(ts){return shiftForTimestamp(ts)===2;}
function itemOshKg(it){
  if(!it || !isOshDiscountItem(it)) return 0;
  const porsiyaKg=(Number(state.settings.porsiyaGrams)||120)/1000;
  const q=Math.max(0, Number(it.qty)||0);
  return it.unit==='kg' ? (q/1000) : (q*porsiyaKg);
}
function isTakeawayOrderItem(order, it){
  if(!order || !it) return false;
  if(order.type==='takeaway') return true;
  if(order.type==='scheduled' && order.deliveryType==='takeaway') return true;
  if(isTaKey(it.menuId) || it.isExtra || it.takeawayOsh) return true;
  return false;
}
function oshKgFromOrders(filterFn){
  let kg=0;
  state.orders.filter(o=>isToday(o.createdAt)&&o.status!=='cancelled'&&filterFn(o)).forEach(o=>{
    (o.items||[]).forEach(it=>{ kg += itemOshKg(it); });
  });

}
function shiftForTimeStr(timeStr){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(timeStr||'').trim());
  if(!m) return null;
  const mins = Number(m[1])*60 + Number(m[2]);
  for(let i=1;i<=2;i++){
    const c=shiftConfig(i),a=shiftTimeMinutes(c.start),b=shiftTimeMinutes(c.end);
    if(a===b) continue;
    if((a<b && mins>=a && mins<b) || (a>b && (mins>=a || mins<b))) return i;
  }
  const s1End = shiftTimeMinutes(shiftConfig(1).end) || (17*60+30);
  return mins < s1End ? 1 : 2;
}
function activeOshShift(){
  if(state.oshStock && state.oshStock.date===todayKey()){

function orderOshShift(o){
  if(!o) return 1;
  if(o.type==='scheduled' || o.fromScheduled){
    return Number(o.oshShiftManual)===1 ? 1 : 2;
  }
  const explicit = Number(o.oshShift);
  if(explicit===1 || explicit===2) return explicit;
  return shiftForTimestamp(o.createdAt || Date.now());
}
function isOrderInTodayOshScope(o){
  if(!o || o.status==='cancelled' || o.archived) return false;
  const repStart = Math.max(reportPeriodStart(), Number(state.settings && state.settings.oshTotalResetAt)||0);
  if(repStart && Number(o.createdAt)<=repStart && o.status!=='active') return false;
  if(o.status==='active') return true;
  return isToday(o.createdAt) || (o.paidAt && isToday(o.paidAt));
}
function oshShiftStats(shift){
  let takeaway=0, scheduledWaiting=0, seatedScheduled=0, waiters=0;
  let takeawayCount=0, scheduledCount=0, seatedScheduledCount=0, waiterCount=0;
  (state.orders||[]).filter(o=>isOrderInTodayOshScope(o) && orderOshShift(o)===shift).forEach(o=>{
    const isUnseatedScheduled = o.type==='scheduled' && (o.table===null || o.table===undefined);
    if(isUnseatedScheduled){
      let hasWaitSched=false;
      (o.items||[]).forEach(it=>{
        const kg = itemOshKg(it);
        if(kg<=0) return;
        scheduledWaiting += kg;
        hasWaitSched = true;
      });
      if(hasWaitSched) scheduledCount++;
      return;
    }
    let hasTa=false, hasSeatedSched=false, hasWaiter=false;
    (o.items||[]).forEach(it=>{
      const kg = itemOshKg(it);
      if(kg<=0) return;
      if(isTakeawayOrderItem(o, it)){ takeaway += kg; hasTa=true; }
      else if(o.fromScheduled || o.type==='dine-in'){ seatedScheduled += kg; hasSeatedSched=true; }
      else { waiters += kg; hasWaiter=true; }
    });
    if(hasTa) takeawayCount++;
    if(hasSeatedSched) seatedScheduledCount++;
    if(hasWaiter) waiterCount++;
  });
  const scheduledOnly = scheduledWaiting;
  const seatedTables = seatedScheduled + waiters;
  const scheduled = takeaway + scheduledWaiting;
  // Оши пухташуда танҳо баъд аз ба миз гузоштани фармоиш (брон ё бе фармоиш) ва собой кам мешавад!
  const total = takeaway + seatedScheduled + waiters;
  const hasStock = state.oshStock && state.oshStock.date===todayKey();
  const stock = hasStock ? normalizeOshStock(state.oshStock) : {lunchKg:0, eveningKg:0};
  const cooked = shift===1 ? (Number(stock.lunchKg)||0) : (Number(stock.eveningKg)||0);
  const remaining = cooked - total;
  return {cooked, takeaway, scheduledWaiting, scheduledOnly, seatedScheduled, seatedTables, scheduled, waiters, total, remaining, takeawayCount, scheduledCount, seatedScheduledCount, waiterCount};
}

function oshTotalOrderedToday(){
  // Вазни умумии ошест, ки имрӯз фармоиш дода шудааст — ин рақам ҳеҷ гоҳ кам намешавад
  // (на ҳангоми ба миз гузоштани фармоиши вактдор, на ҳангоми пӯшидани чек) — танҳо бекоршавии
  // фармоиш метавонад онро кам кунад. Барои ин мақсад қасдан ҳамаи намуди фармоиш ҳисоб мешавад.
  // Тугмаи «Пок кардан» вақти пок карданро (oshTotalResetAt) пеш мебарад — фармоишҳои пеш аз он
  // дигар ба ҳисоб дохил намешаванд, аммо худи фармоишҳо (ва ҳисоботи молиявӣ) тағйир намеёбанд.
  const resetAt = Number(state.settings.oshTotalResetAt) || 0;
  const porsiyaKg = (Number(state.settings.porsiyaGrams)||120)/1000;
  let kgOrdered = 0;
  state.orders.filter(o=>isToday(o.createdAt) && o.status!=='cancelled' && o.createdAt>=resetAt).forEach(o=>{
    o.items.forEach(it=>{
      if(getItemCategory(it)==='Ош'){
        if(it.unit==='kg') kgOrdered += it.qty/1000;
        else kgOrdered += it.qty * porsiyaKg;
      }
    });
  });
  return kgOrdered;
}
function normalizeOshStock(stock){
  const x = stock && typeof stock==='object' ? stock : {};
  const legacyKg = Number(x.kg)||0;
  const lunchKg = Number(x.lunchKg);
  const eveningKg = Number(x.eveningKg);
  const hasShiftFields = Object.prototype.hasOwnProperty.call(x,'lunchKg') || Object.prototype.hasOwnProperty.call(x,'eveningKg');
  const actShift = Number(x.activeShift);
  return {
    date: x.date || '',
    kg: hasShiftFields ? Math.max(0, (Number.isFinite(lunchKg)?lunchKg:0) + (Number.isFinite(eveningKg)?eveningKg:0)) : legacyKg,
    lunchKg: hasShiftFields ? Math.max(0, Number.isFinite(lunchKg)?lunchKg:0) : legacyKg,
    eveningKg: hasShiftFields ? Math.max(0, Number.isFinite(eveningKg)?eveningKg:0) : 0,
    activeShift: (actShift===1 || actShift===2) ? actShift : currentShift()
  };
}
function oshShiftForTimestamp(ts){return shiftForTimestamp(ts)===1?'lunch':'evening';}

}
function takeawayOshStatsForOrders(orders){

    const key = cleanName + '|' + String(it.unit||'dona');
    if(!prodMap[key]){
      prodMap[key] = {name: cleanName, unit: it.unit||'dona', qty: 0, revenue: 0, isOsh: isOshDiscountItem(it), directQty: 0, extraQty: 0};
    }
    const q = Math.max(0, Number(it.qty)||0);
    prodMap[key].qty += q;
    prodMap[key].revenue += itemRev;
    if(sourceTag==='direct') prodMap[key].directQty += q;

  (orders||[]).filter(o=>o && o.status!=='cancelled' && !o.archived).forEach(o=>{
    const pctUsed = Number(o.discountPct)!==undefined && Number(o.discountPct)>0 ? Number(o.discountPct) : (Number(o.discount)>0 ? taPct : 0);
    if(o.type==='takeaway'){
      directCount++;
      (o.items||[]).forEach(it=>{
        directKg += itemOshKg(it);
        const sub = lineTotal({unit:it.unit, price:it.price}, it.qty);
        const disc = isOshDiscountItem(it) && pctUsed>0 ? roundMoney(sub * (pctUsed/100)) : 0;
        const rev = Math.max(0, sub - disc);
        recordProduct(it, rev, 'direct');
      });
      if(o.status==='paid'){
        directRev += Number(o.total)||0;
        discTotal += Number(o.discount)||0;
      }
    } else if(o.type==='scheduled' && o.deliveryType==='takeaway'){
      (o.items||[]).forEach(it=>{
        directKg += itemOshKg(it);
        const sub = lineTotal({unit:it.unit, price:it.price}, it.qty);
        recordProduct(it, sub, 'direct');
      });
    } else {
      const extraItems = (o.items||[]).filter(it=>isTaKey(it.menuId) || it.isExtra || it.takeawayOsh);
      if(extraItems.length){
        tableExtraCount++;
        extraItems.forEach(it=>{
          tableExtraKg += itemOshKg(it);
          const sub = lineTotal({unit:it.unit, price:it.price}, it.qty);
          const disc = isOshDiscountItem(it) && pctUsed>0 ? roundMoney(sub * (pctUsed/100)) : 0;
          const rev = Math.max(0, sub - disc);
          recordProduct(it, rev, 'extra');
          if(o.status==='paid'){
            tableExtraRev += rev;
          }
        });
        if(o.status==='paid') discTotal += Number(o.discount)||0;
      }
    }
  });
  const soldProducts = Object.values(prodMap).sort((a,b)=>b.revenue - a.revenue);
  return {
    directKg,
    tableExtraKg,
    totalKg: directKg + tableExtraKg,
    directCount,
    tableExtraCount,
    totalRevenue: directRev + tableExtraRev,
    directRevenue: directRev,
    tableExtraRevenue: tableExtraRev,
    totalDiscount: discTotal,
    soldProducts
  };
}

function reportShiftForTimestamp(ts){
  const sh=shiftForTimestamp(ts);

}
function splitReportOrders(orders){
  const out={day:[],night:[]};
  (orders||[]).forEach(o=>{ const sh=reportShiftForTimestamp(o.paidAt||o.updatedAt||o.createdAt); if(sh) out[sh].push(o); });

function splitExpenses(expenses){
  const out={day:[],night:[]};
  (expenses||[]).forEach(e=>{ const sh=reportShiftForTimestamp(e.ts||e.createdAt); if(sh) out[sh].push(e); });
  return out;

function sumExpenses(list){ return (list||[]).reduce((s,e)=>s+(Number(e.amount)||0),0); }
function makeDailySummary(date, paidOrders, expenses, closedAt, closedBy){
  const shifts=splitReportOrders(paidOrders), ex=splitExpenses(expenses);
  const make=(orders,exps)=>{
    const cash=orders.reduce((s,o)=>s+paymentSplit(o).cash,0);
    const noncash=orders.reduce((s,o)=>s+paymentSplit(o).noncash,0);
    const revenue=orders.reduce((s,o)=>s+(Number(o.total)||0),0);
    const expense=sumExpenses(exps);
    return {revenue,cash,noncash,expenses:expense,net:revenue-expense,checks:orders.length};
  };
  return {id:uid('day'),date,closedAt,closedBy,day:make(shifts.day,ex.day),night:make(shifts.night,ex.night),total:make([...shifts.day,...shifts.night],[...ex.day,...ex.night])};
}
function upsertMonthlySummary(archive, summary){
  const month=summary.date.slice(0,7);
  const base=archive.months[month]||{month,days:0,revenue:0,expenses:0,net:0,checks:0,day:{revenue:0,expenses:0,net:0,checks:0},night:{revenue:0,expenses:0,net:0,checks:0}};
  const prev=archive.days.find(x=>x.date===summary.date);
  if(prev){
    base.days=Math.max(0,base.days-1);
    ['revenue','expenses','net','checks'].forEach(k=>{base[k]-=Number(prev.total[k])||0; base.day[k]-=Number(prev.day[k])||0; base.night[k]-=Number(prev.night[k])||0;});
  }
  base.days+=1;
  ['revenue','expenses','net','checks'].forEach(k=>{base[k]+=Number(summary.total[k])||0; base.day[k]+=Number(summary.day[k])||0; base.night[k]+=Number(summary.night[k])||0;});
  archive.months[month]=base;
}

/* ============ INIT ============ */
async function init(){
  render(); // loading state
  const all = await loadAll();
  const {menu, settings, reservations, tables, oshStock, accounts, inventory, activityLog, bonuses, expenses, technicalStaff, dailySalaryLedger, failed} = all;
  // Complete the one-time, non-destructive migration before the first V2 read.
  // This prevents a fresh device from briefly/incorrectly starting with an empty order list.
  try{
    await migrateOrdersToV2();
  }catch(e){
    console.error('Initial orders migration failed',e);
  }
  // Load active orders once at startup; paid orders are loaded without duplication by setupRealtimeSync() only for roles that need them.
  const ordersResult = await loadActiveOrdersV2();
  const orders = (ordersResult.ok && Array.isArray(ordersResult.value)) ? ordersResult.value : [];

  // EVERY field must load successfully before we touch anything. A failed read must NEVER be
  // treated as "this data doesn't exist yet" — that is exactly what caused real staff/order/
  // inventory data to be silently wiped in the past. If ANY field failed to load (network
  // blip etc.), show a retry screen and write nothing at all until a full, successful load.
  const anyFailed = Object.keys(failed).some(k=>failed[k]);
  if(anyFailed){
    state.loadError = true;
    state.loaded = true; window.__appDataLoaded = true;
    render();
    return;
  }

  if(CAFE_ID && (!accounts || !accounts.length)){
    // confirmed genuinely empty (not a failed read) — brand-new café on this link
    state.needsSetup = true;
    state.loaded = true; window.__appDataLoaded = true;
    render();
    return;
  }

  state.menu = (menu && menu.length) ? menu : DEFAULT_MENU;
  if(!(menu && menu.length)) await saveMenu(state.menu);

  state.orders = orders || [];
  state.__lastKnownOrderIds = new Set(state.orders.map(o=>o.id));
  state.__lastKnownOrderSnapshots = new Map(state.orders.map(o=>[o.id, JSON.parse(JSON.stringify(o))]));
  state.settings = settings || {...DEFAULT_SETTINGS};
  state.reservations = reservations || {};
  state.oshStock = normalizeOshStock(oshStock || {date:'', kg:0});
  state.inventory = inventory || [];
  state.activityLog = activityLog || [];
  state.bonuses = bonuses || [];
  state.dailyClosures = [];
  state.reportArchive = null;
  state.expenses = expenses || [];
  state.technicalStaff = Array.isArray(technicalStaff) ? technicalStaff : [];
  state.dailySalaryLedger = Array.isArray(dailySalaryLedger) ? dailySalaryLedger : [];

  if(tables && tables.length){
    state.tables = tables;
  } else {
    const tc = (settings && settings.tableCount) || 8;
    state.tables = Array.from({length:tc}, (_,i)=>({id:i+1, name:'Мизи '+(i+1), seats:4, x:((i%5)*19)+2, y:(Math.floor(i/5)*25)+3}));
    await saveTables(state.tables);
  }

  if(accounts && accounts.length){
    state.accounts = accounts;
  } else {
    // accounts read succeeded (anyFailed already excluded that) and is genuinely empty
    const defaultPassword = 'admin123';
    state.accounts = [{id:'acc_admin', username:'admin', password:defaultPassword, role:'admin'}];
    await saveAccounts(state.accounts);
  }

  const session = loadSession();
  if(session){
    // Session бо username санҷида мешавад — парол дар localStorage нест
    const acc = state.accounts.find(a=>a.username.toLowerCase()===(session.username||'').toLowerCase());
    if(acc){
      state.currentUser = {username:acc.username, role:acc.role};
      state.role = acc.role;
    } else {
      clearSession(); // account was deleted — fall back to login
    }
  }

  state.loaded = true; window.__appDataLoaded = true;
  render();
  setupRealtimeSync();
}

/* ============ REAL-TIME SYNC ============
   Uses Firestore's onSnapshot listeners instead of polling — changes on one device now
   reach every other device almost instantly, not after up to 6 seconds. */
let __realtimeUnsubs = [];
let __watchdogInterval = null;
let __resubscribeTimer = null;
function teardownRealtimeSync(){
  __realtimeUnsubs.forEach(unsub=>{ try{ unsub(); }catch(e){} });
  __realtimeUnsubs = [];
  if(state.__paidOrdersUnsub){ try{state.__paidOrdersUnsub();}catch(e){} state.__paidOrdersUnsub=null; }
  if(state.__scheduledOrdersUnsub){ try{state.__scheduledOrdersUnsub();}catch(e){} state.__scheduledOrdersUnsub=null; }
  state.__paidOrdersLoadedSince=null;
  state.__scheduledOrdersLoaded=false;
}
// Only defer a redraw while the person's cursor is literally inside a text field / select
// right now — far more precise than a blanket "form is open" timer, and it means every OTHER
// screen (or the same screen once you click away) stays truly real-time.
function isActivelyEditingFormField(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = (el.tagName||'').toUpperCase();
  return tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
}
function setupRealtimeSync(){
  teardownRealtimeSync();
  if(!state.role) return;
  try{
    const unsub=ordersCollectionRef().where('status','==','active').onSnapshot(snap=>{
      if(!state.role)return;
      const parsed=[];
      snap.forEach(d=>{const x=d.data()||{};delete x._migratedAt;parsed.push({...x,id:x.id||d.id});});
      mergeActiveOrdersIntoState(parsed);
      if(state.activeTable===null && !state.scheduledOpen && !state.takeawayOpen && !state.viewingOrderId && !isActivelyEditingFormField())render();
    },err=>{
      console.error('Orders realtime error',err);
    });
    __realtimeUnsubs.push(unsub);
  }catch(e){console.error('orders listener attach failed',e);}
  // Waiters do not need paid orders at all; Cashier/Admin/Chef only load TODAY's paid orders at startup (not old days)
  if(state.role==='cashier' || state.role==='admin' || state.role==='chef'){
    ensurePaidOrdersLoaded('today').catch(console.error);
  }
  const isWaiterOrChef = (state.role==='waiter' || state.role==='chef' || state.role==='oshbar') && !(state.currentUser && state.currentUser.role==='admin');
  const fields = isWaiterOrChef
    ? [['menu','menu'],['settings','settings'],['tables','tables'],['oshStock','oshStock'],['accounts','accounts'],['inventory','inventory']]
    : [['menu','menu'],['settings','settings'],['tables','tables'],['oshStock','oshStock'],['accounts','accounts'],['inventory','inventory'],['bonuses','bonuses'],['dailyClosures','dailyClosures'],['technicalStaff','technicalStaff'],['dailySalaryLedger','dailySalaryLedger']];
  fields.forEach(([key,stateKey])=>{
    try{
      const unsub=docRef(key).onSnapshot(snap=>{
        if(!state.role||!snap.exists)return;
        try{state[stateKey]=stateKey==='oshStock' ? normalizeOshStock(JSON.parse(snap.data().value)) : JSON.parse(snap.data().value);if(state.activeTable===null && !state.scheduledOpen && !state.takeawayOpen && !state.viewingOrderId && !isActivelyEditingFormField())render();}catch(e){}
      },err=>{
        console.error('Realtime listener error for',key,err);
      });
      __realtimeUnsubs.push(unsub);
    }catch(e){console.error('listener attach failed',key,e);}
  });
  startSyncWatchdog();
}
function startSyncWatchdog(){
  if(__watchdogInterval) clearInterval(__watchdogInterval);
  // Local-only UI clock refresh every 30s (0 Firestore reads) so queue wait minutes stay accurate
  __watchdogInterval = setInterval(()=>{
    if(state.role && state.activeTable===null && !state.scheduledOpen && !state.takeawayOpen && !state.viewingOrderId && !isActivelyEditingFormField()){
      render();
    }
  }, 30000);
}

// Full fallback is intentionally less frequent because it reads many documents. It is still
// useful for settings/tables/inventory if a listener silently goes stale.
let __fullWatchdogInterval = null;
function startFullSyncWatchdog(){
  // onSnapshot listeners cover all fields — full polling every 30s is redundant
  // and causes ~1200 extra reads/hour. Removed.
  if(__fullWatchdogInterval) clearInterval(__fullWatchdogInterval);
}

// Калиди махсус барои оши собой дар чеки миз: menuId + '__ta' (масалан 'm2__ta').
const TA_SUFFIX = '__ta';
function isTaKey(k){ return typeof k==='string' && k.endsWith(TA_SUFFIX); }
function baseMenuId(k){ return isTaKey(k) ? k.slice(0, -TA_SUFFIX.length) : k; }
function menuForKey(k){
  const m = state.menu.find(x=>x.id===baseMenuId(k));
  if(!m) return null;
  if(!isTaKey(k)) return m;
  return {...m, id:k, name:m.name+' (иловагӣ)', noService:true, isExtra:true, takeawayOsh:isOshDiscountItem(m)};
}
function roundMoney(n){ return Math.round((Number(n)||0)*100)/100; }
// Табақ / Лаълӣ (зарф) — аз он ҳаққи хизматрасонӣ гирифта намешавад ва ба он тахфиф дода намешавад.
function isLaaliName(name){ return /ла[ъьеиӣйі'’`]л|ляган|лаган|таба[қкq]/i.test(String(name||'')); }
function draftMainSubtotal(){

function draftExtraSubtotal(){

function moveDraftItemSection(fromKey, toExtra){
  const cur = Number(state.draftItems[fromKey])||0;
  if(cur<=0) return;
  const baseId = baseMenuId(fromKey);
  const targetKey = toExtra ? (baseId + TA_SUFFIX) : baseId;
  if(targetKey === fromKey) return;
  const m = state.menu.find(x=>x.id===baseId);
  const moveAmt = (m && m.unit!=='kg' && cur>1) ? 1 : cur;
  const rem = cur - moveAmt;
  if(rem<=0) delete state.draftItems[fromKey];
  else state.draftItems[fromKey] = rem;
  state.draftItems[targetKey] = (Number(state.draftItems[targetKey])||0) + moveAmt;
  render();
}
function takeawayOshDiscountPct(){ return Math.max(0, Math.min(100, Number(state.settings.takeawayDiscountPct)||0)); }
// Тахфифи собой танҳо ба ош (категорияи «Ош»), на ба нӯшокӣ, нон, лаълӣ ва ғайра.
function isOshDiscountItem(item){ return !!item && getItemCategory(item)==='Ош' && !isLaaliName(item.name); }
// 'own'   = фармоише, ки офитсиант худаш дар сари миз гирифтааст (ранги сурх)
// 'sched' = фармоиши вақтдор, ки ба миз гузошта шудааст (ранги сабз)
function orderSourceKind(o){
  if(!o) return '';
  if(o.type==='takeaway') return '';
  if(o.fromScheduled || o.type==='dine-in' || o.type==='scheduled') return 'sched';
  if(o.table===null || o.table===undefined) return '';
  return 'own';
}
function orderSourceBadge(o){
  const k = orderSourceKind(o);
  if(k==='own') return `<span class="order-src-badge own">🔴 Фармоиши офитсиант</span>`;
  if(k==='sched') return `<span class="order-src-badge sched">🕐 Фармоиши вақтдор</span>`;
  return '';
}
function fmtOshQtyUnit(unit, qty){
  const q = Math.max(0, Number(qty)||0);
  if(unit==='kg') return q>=1000 ? (Math.round((q/1000)*100)/100)+' кг' : Math.round(q)+' г';
  return Math.round(q)+'×';
}
// Муқоисаи оши фармоиши вақтдор бо миқдори ҳозира дар миз (барои муайян кардани «Оши доп» ё кам кардани ош)
function scheduledOshDiffs(order, currentItemsOverride){
  if(!order || orderSourceKind(order)!=='sched') return [];
  const initList = Array.isArray(order.initialItems) && order.initialItems.length ? order.initialItems : null;
  if(!initList) return [];
  const curList = Array.isArray(currentItemsOverride) ? currentItemsOverride : (order.items||[]);
  const initMap = {}, curMap = {};
  initList.forEach(it=>{
    const bId = baseMenuId(it.menuId);
    const m = state.menu.find(x=>x.id===bId) || it;
    if(!isOshDiscountItem({...m, ...it})) return;
    if(!initMap[bId]) initMap[bId] = {menuId:bId, name:m.name||it.name||'Ош', unit:it.unit||m.unit||'dona', qty:0};
    initMap[bId].qty += Math.max(0, Number(it.qty)||0);
  });
  curList.forEach(it=>{
    const bId = baseMenuId(it.menuId);
    const m = state.menu.find(x=>x.id===bId) || it;
    if(!isOshDiscountItem({...m, ...it})) return;
    if(!curMap[bId]) curMap[bId] = {menuId:bId, name:m.name||it.name||'Ош', unit:it.unit||m.unit||'dona', qty:0};
    curMap[bId].qty += Math.max(0, Number(it.qty)||0);
  });
  const allIds = [...new Set([...Object.keys(initMap), ...Object.keys(curMap)])];
  const diffs = [];
  allIds.forEach(bId=>{
    const inf = initMap[bId] || curMap[bId];
    const initQty = initMap[bId] ? initMap[bId].qty : 0;
    const curQty = curMap[bId] ? curMap[bId].qty : 0;
    const delta = curQty - initQty;
    if(Math.abs(delta) < 0.001) return;
    diffs.push({
      menuId: bId,
      name: inf.name,
      unit: inf.unit,
      initQty,
      curQty,
      delta,
      kind: delta > 0 ? 'dop' : 'less',
      initLabel: fmtOshQtyUnit(inf.unit, initQty),
      curLabel: fmtOshQtyUnit(inf.unit, curQty),
      deltaLabel: (delta>0?'+':'−') + fmtOshQtyUnit(inf.unit, Math.abs(delta))
    });
  });
  return diffs;
}
function renderScheduledOshDiffBanner(order, currentItemsOverride){
  const diffs = scheduledOshDiffs(order, currentItemsOverride);
  if(!diffs.length) return '';
  return `<div style="margin:6px 0 10px;display:flex;flex-direction:column;gap:6px;">` + diffs.map(d=>{
    if(d.kind==='dop'){

        <div style="font-size:11px;font-weight:600;color:#047857;margin-top:2px;">Вақтдор (пешакӣ): ${escapeHtml(d.initLabel)} → Ҳоло дар чек: ${escapeHtml(d.curLabel)}</div>
      </div>`;

function renderScheduledOshCardBadge(order){
  const diffs = scheduledOshDiffs(order);
  if(!diffs.length) return '';

    if(d.kind==='dop') return `<span class="reserve-detail" style="color:var(--olive);font-weight:700;">🍚 Оши доп: ${escapeHtml(d.deltaLabel)}</span>`;
